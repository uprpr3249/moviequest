<body>
<div id="app"></div>
<template id="body-intro-1">
  <h2>映像は、静止画の連続である</h2>
  <p>まず仕組みの話から始める。映像とは、静止画の連続である。フィルムのコマ、動画ファイルのフレーム、パラパラ漫画のページ。形は違っても、止まった絵を高速で切り替えることで「動いて見える」という点は共通している。パラパラ漫画は、1枚1枚はただの絵なのに、めくる速さが上がった瞬間にキャラクターが走り出す。映像の出発点は、静止画の集まりが時間の中で動きに変わる、この仕組みにある。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/heRuLp7CyTM?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="The horse in motion (Eadweard Muybridge) 1878" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>The horse in motion (Eadweard Muybridge) 1878（Channel Stop）。1878年、マイブリッジが走る馬を連続写真で撮り、それを順に切り替えた映像。1枚ずつはただの写真だ。<a class="yt" href="https://www.youtube.com/watch?v=heRuLp7CyTM" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>
  <p>ただし、これは仕組みの定義にすぎない。監視カメラの映像も名作映画も、仕組みの上ではどちらも静止画の連続だ。この定義だけでは、良い映像とそうでない映像の違いを説明できない。その違いを言葉にすることが、このサイト全体の仕事になる。</p>

  <h2>物差し：どこで止めても、いい絵になる</h2>
  <p>良い映像を見分ける物差しとして、このサイトでは次の目安を使う。<strong>良い映像は、どこで一時停止しても、いい絵になっている。</strong></p>
  <p>乱暴な基準に見えるが、使い道は広い。どのコマで止めても絵になっているなら、構図、色、被写体の置き方といった1枚の絵としての設計が、偶然に頼らず作られていることになる。止めるたびに中途半端な絵が出てくる映像は、1コマごとの設計を運に任せていることが多い。</p>
  <p>作り手にとっても、この物差しはすぐ使える。自分の映像を適当な場所で止めて、そこが1枚の絵として見られるかを確かめる。それだけで、直すべき場所がかなり見えてくる。詳しい使い方は画編で扱う。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/8U-gCTEYxCA?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="isshin REEL 2022" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画2</span>isshin REEL 2022（isshin）。好きな所で一時停止してみてほしい。どこで止めても1枚の絵として成り立っている。詳しくは画編で扱う。<a class="yt" href="https://www.youtube.com/watch?v=8U-gCTEYxCA" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>物差しの限界</h2>
  <p>この物差しには限界がある。止めると崩れて見えるのに、動かすと気持ちいいコマがあるからだ。速い動きの途中のブレた絵、着地の直前で歪んだポーズ、カメラが大きく振れた瞬間の流れた背景。どれも静止画としては崩れている。それでも前後の流れの中では、その崩れが速さや勢いを生んでいる。1コマの完成度では測れない良さが、映像にはある。</p>

  <h2>定義を更新する</h2>
  <p>仕組みとしての定義、止めてもいい絵という物差し、その限界。この3つを踏まえて、このサイトでは良い映像をこう定義する。</p>
  <div class="pull">
    <p class="lab">このサイトの定義</p>
    <p class="q">良い映像は、どの要素にも「何を魅せたいか」の意図が設計されている。</p>
  </div>

  <p>型を破るのも自由だ。ただ、破るときは、破ることで何を魅せたいのかを説明できるようにしておきたい。理由のある崩しと、知らずに崩れたものは、見る人には違って見えることが多い。型を知ったうえで、使うか破るかを自分で選ぶ。それがこのサイトの勧める付き合い方である。</p>

<template id="body-intro-4">
  <h2>映像には、そう作られている理由がある</h2>
  <p>0.3で、型は先人が出した答えの集まりだと書いた。この記事では、その答えを学ぶと作り手として何が変わるのかを考える。</p>
  <p>世の中の映像には、そう見える理由がある。作り手が意識していたかどうかは関係ない。たとえばインタビュー映像では、カメラの横にいる聞き手に向かって話す人を、画面の真ん中から少しずらし、顔が向いている側を広く空けて映すことが多い。視線の先に空間があると、画面が窮屈に見えにくく、見る人の目も話し手の視線に沿って流れる。構図の理論では、この空間をリードルーム（ルッキングルームとも）と呼ぶ。</p>
  <p>理論やセオリーは、こうした理由を言葉にして整理したものだ。何となく気持ちよく見えていた画面に、名前と理由が付く。</p>

  <h2>理由が分かると、自分の映像に使える</h2>
  <p>理由が分かると、それを自分の映像に持ち込める。しかも、元の場面とは違う場面にも当てはめられる。リードルームの理由が「視線や動きの先を空ける」ことだと分かっていれば、話す人だけでなく、走る車や、画面の外を指さす手にも同じ考え方が使える。</p>
  <p>逆に、あえて視線の先を詰めて、人物が追い詰められている感じを出すこともできる。理由を知っていれば、崩すときにも狙いを持てる。</p>

  <h2>言葉を知らないと、作れるものを想像しにくい</h2>
  <p>用語や語彙を知っていることには、もう一つ意味がある。知らない手法は、作るときの選択肢に上がってこない。</p>
  <p>編集の用語に、JカットとLカットがある。Jカットは、次の場面の音が映像より先に聞こえ始めるつなぎ方だ。Lカットはその逆で、前の場面の音が、映像が切り替わった後も残る。会話の場面で、相手の声が先に聞こえてから相手の顔に切り替わる、といった使い方をする。これを知らないうちは、映像と音を同じ位置で切ることしか思いつきにくい。名前を知ると、他人の作品の中でも見つけられるようになり、自分の編集で試せる手が一つ増える。詳しくは編集編で扱う。</p>
  <p>語彙は、頭の中で完成形を思い描くための部品のようなものだ。部品が多いほど、作る前に想像できる映像の幅が広がる。仕事の現場で用語が人と人をつなぐ共通言語になることは、0.3で触れた。</p>

  <h2>他人の作品をロジカルに読める</h2>
  <p>理論を学ぶうえでの一番の強みは、他人の作品をロジカルに考えられるようになることだ。</p>
  <p>理由と語彙がないうちは、良い作品を見ても「すごい」「かっこいい」で終わりやすい。理由と語彙があると、「ここで画より先に次の場面の音を入れている」「この人物は画面の右に寄せて、左を空けている」と、良さを分解できる。分解できたものは、自分の映像に持ち帰れる。</p>
  <p>参考になる映像は、世の中にいくらでもある。1本から持ち帰れる量が増えれば、見るたびに学べることが増えていく。好きな作品を見る時間が、そのまま勉強の時間になる。</p>

  <h2>理論を知ると、感覚が鈍るのか</h2>
  <p>理論を学ぶと、型にはまった映像しか作れなくなるのではないか、という心配もあるだろう。</p>
  <p>このサイトでは、理論を、感覚で「いい」と感じたものに後から理由を付ける道具として扱う。感覚で選んだ構図が、理論で説明できることは多い。説明できれば、その感覚を次の作品でも再現できる。理論で説明できないのに良いと感じるものがあれば、それは新しい発見として大事にすればいい。</p>
  <p>理論を学ばずに良い映像を作る人もいる。そうした人も、たくさんの映像を見るうちに、理由を言葉にしないまま体で覚えているのだろう、とこのサイトは考えている。理論は、その道のりを短くする手段の一つだ。</p>
  <p>何を使うかを決めるのは、0.3で書いたとおり作り手自身だ。理由を知ったうえで、自分の映像に何を持ち込むかを選ぶ。そのための材料を集めることが、理論を学ぶ意味である。</p>

  <p>ページの上にある細い色の帯は、全ての章を順に並べたものだ。今読んでいる章が黒い枠で示されるので、サイト全体のどのあたりにいるかが分かる。帯の1つ1つを押すと、その章に移れる。</p>

  <h2>用語の吹き出し</h2>
  <p>本文の中で点線の下線が付いた言葉は、カーソルを合わせると短い説明が出る。スマホでは、その言葉を押すと出る。たとえば、構図の型の一つである三分割法にカーソルを合わせてみてほしい。説明の下には、その言葉を詳しく扱っている章へのリンクがある。</p>
  <p>下線を付けるのは、その記事の中で最初に出てくる1回だけだ。全てに付けると本文が読みにくくなるからである。説明を読んでも分からないときや、下線のない所で意味を確かめたいときは、トップの黒い帯にある「用語索引」を開くと、全ての用語を章の順に一覧できる。</p>

  <h2>図と動画</h2>

  <p>歴史や人物についての事実は、調べて裏付けを取ってから書いている。まだ裏付けが取れていない所には「要確認」と書いて、そのことが分かるようにしている。</p>

  <p>この時代の映画は、カメラを固定し、1つの出来事を1カットで撮るものが中心だった。工場から出てくる人々、駅に着く列車。動く写真であること自体が見世物だった。</p>

  <p>このサイトのゴールは、理論を覚えきることに置いていない。自分が作りたい映像を、前より理由を持って作れるようになることに置いている。</p>

  <h2>24、30、60という数字</h2>
  <p>1秒間に何コマを見せるかを、fps（frames per second）で表す。よく使われる数字は、映画の24fps、日本や北米のテレビ放送の約30fps、滑らかさを重視する映像の60fpsだ。</p>
  <p>映画の24fpsは、音の付いた映画（トーキー）が広まった1920年代後半に定着した。それより前のサイレント映画は、16〜18fps前後で撮られることが多く、上映の速さもまちまちだったとされる。フィルムに音を記録して一緒に流すには、速さを一定に決める必要がある。音をきれいに再生できて、しかもフィルムを使いすぎない最低限の速さとして選ばれたのが24fpsだった。</p>
  <p>テレビの数字が30ちょうどでなく29.97fpsなのにも、歴史上の理由がある。1953年にアメリカで白黒放送がカラー放送へ移るとき、色の信号を、それまでの映像や音と干渉させずに載せるため、30fpsからほんの少し下げた。日本も同じ方式を使ったので、今でも動画の設定に29.97という数字が残っている。</p>
  <p>数字は技術の都合で決まったものが多い。それでも、長く使われるうちに、その数字自体が見た目の印象を持つようになった。</p>

  <h2>滑らかさと質感は別のもの</h2>
  <p>fpsの数字が大きいほど、動きは滑らかになる。ただ、滑らかなほど良い映像になるとは限らない。24fpsの映像には、多くの人が映画らしさを感じる。同じ素材を60fpsにすると、生々しく、ホームビデオやテレビの中継のように見えることがある。</p>
  <p>この違いがはっきり表に出たのが、2012年の映画『ホビット 思いがけない冒険』だ。この作品は、映画で一般的な24fpsの倍の48fpsで撮影され、48fpsで上映する劇場もあった。動きは滑らかになったが、批評家の多くは否定的で、「80年代のホームビデオのようだ」という評も出た。滑らかさが増したことで、かえってセットや衣装の作り物らしさが見えてしまった、という受け止め方だ。</p>
  <p>どちらが正しいという話ではない。ゲームの実況や、スポーツのように動きを正確に追いたい映像なら、60fpsの滑らかさが向いている。映画のような空気を出したいなら、24fpsを選ぶ人が多い。fpsは画質の設定であると同時に、作品の質感を選ぶ設定でもある。</p>

<template id="body-prep-2">
  <h2>解像度とピクセル</h2>
  <p>画面の1コマは、縦横に並んだ小さな点の集まりでできている。この点をピクセルと呼ぶ。解像度は、1コマが横に何個、縦に何個のピクセルでできているかを表す。1920×1080がフルHD、3840×2160が4Kと呼ばれる。4Kは、フルHDの縦横それぞれ2倍で、点の数は4倍になる。</p>
  <p>点の数が多いほど細かい所まで描けるが、ファイルは重くなり、編集や書き出しにも時間がかかる。見る人の画面がスマホなら、4Kで作っても違いが分かりにくいこともある。どこで、何の画面で見られるかから、必要な解像度を決める。</p>

  <h2>画質は解像度だけで決まらない</h2>
  <p>同じフルHDでも、きれいに見える映像と、ぼやけたりブロック状に崩れたりする映像がある。違いを生む大きな要因は、圧縮だ。</p>
  <p>動画のファイルは、そのままでは大きすぎるので、見た目に気づかれにくい情報を間引いて小さくしている。1秒あたりにどれだけの情報量を使うかをビットレートと呼ぶ。ビットレートが低いと、細かい模様や動きの激しい場面で、画面がブロック状に崩れやすい。紙吹雪、水しぶき、細かいノイズのような、コマごとに大きく変わる画は特に崩れやすい。</p>
  <p>投稿サイトは、アップロードされた動画をさらに圧縮し直す。手元ではきれいだったのに、投稿したら崩れた、ということが起きるのはこのためだ。撮影時のピントや手ぶれも、画質を左右する。解像度は、画質を決める条件の一つにすぎない。</p>

  <h2>アスペクト比の種類</h2>
  <p>アスペクト比は、画面の横と縦の比率だ。今の動画で一番多いのは16:9。古いテレビは4:3で、映画には2.39:1前後の横長の比率（シネマスコープ）がある。スマホで見るショート動画は、16:9を縦にした9:16が標準になっている。SNSの投稿では、正方形の1:1も使われる。</p>
  <figure class="fig" aria-label="高さをそろえて、4:3、16:9、2.39:1、1:1、9:16の画面を並べた図">

        <rect x="2" y="20" width="133" height="100"/>
        <rect x="155" y="20" width="178" height="100"/>
        <rect x="353" y="20" width="239" height="100"/>
        <rect x="612" y="20" width="100" height="100"/>
        <rect x="732" y="20" width="56" height="100"/>
      </g>
      <g font-size="17" text-anchor="middle">
        <text x="68" y="148">4:3</text><text x="244" y="148">16:9</text><text x="472" y="148">2.39:1</text><text x="662" y="148">1:1</text><text x="760" y="148">9:16</text>
      </g>
      <g font-size="13" text-anchor="middle" style="fill:#5C5C5C">
        <text x="68" y="166">古いテレビ</text><text x="244" y="166">今の動画</text><text x="472" y="166">映画の横長</text><text x="662" y="166">SNSの正方形</text><text x="760" y="166">縦型</text>
      </g>

  </figure>

  <h2>比率が持つ印象</h2>
  <p>横長の画面は、風景の広がりや、横に並んだ人物同士の関係を見せやすい。4:3や1:1は、被写体を中央にまとめやすく、画面の中が詰まって見える。縦型は、人物の全身や、上から下へ動くものを収めやすい。</p>
  <p>16:9の映像の上下に黒い帯を入れて、映画のような横長に見せる手法がある。これをレターボックスと呼ぶ。帯を足すだけで「映画っぽさ」が出るのは、横長の比率に映画の印象が結びついているからだろう。逆に、あえて4:3にして古い記録映像や家庭用ビデオの空気を出す作品もある。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/NF6Tjrr9290?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="Aspect Ratio Change (Xavier Dolan's Mommy)" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>

  </figure>
  <p>比率は、構図を考える前の、画面という紙の形にあたる。紙の形が違えば、同じ被写体でも置き方が変わる。構図の考え方は画編で扱う。</p>

  <h2>縦型の前提</h2>
  <p>縦型のショート動画には、もう一つ前提がある。画面の上下と右側に、アプリのボタン、アカウント名、説明文、曲名などが重なって表示されることだ。重なる位置はアプリや端末で少しずつ違う。</p>
  <figure class="fig" aria-label="縦型の画面で、上下と右側にアプリの表示が重なり、中央に大事なものを置きやすい範囲が残ることを示す図">

  </figure>
  <p>字幕や顔、作品の決めの部分を斜線の範囲に置くと、ボタンや説明文に隠れてしまう。大事なものは、中央の範囲に寄せておく。</p>
  <p>横長で撮った素材を縦に切り出すと、左右が大きく削られて、構図が崩れやすい。縦で見せる作品は、撮る段階、描く段階から縦で考えておく方が、仕上がりを想像しやすい。</p>

  <h2>作る前に決めること</h2>
  <p>解像度と比率も、fpsと同じく作り始める前に決めておく。どこに投稿し、何の画面で見られるのかから逆算すると決めやすい。横と縦の両方に出したいなら、どちらを主にするか、もう片方はどう作り直すかまで考えておく。</p>
</template>

<template id="body-prep-3">
  <h2>色の三属性</h2>
  <p>色は、色相・明度・彩度の3つで言い表せる。色相は、赤、黄、緑、青といった色の種類。明度は明るさ。彩度は鮮やかさで、低くすると灰色に近づく。</p>
  <figure class="fig" aria-label="色相、明度、彩度をそれぞれ1列に並べて変化させた図">
    <svg viewBox="0 0 720 220" role="img">
      <g font-size="16"><text x="0" y="44">色相</text><text x="0" y="114">明度</text><text x="0" y="184">彩度</text></g>
      <g stroke="#fff" stroke-width="2">
        <rect x="80" y="16" width="80" height="44" fill="#BF0000"/><rect x="160" y="16" width="80" height="44" fill="#BF6000"/><rect x="240" y="16" width="80" height="44" fill="#BFBF00"/><rect x="320" y="16" width="80" height="44" fill="#00BF00"/><rect x="400" y="16" width="80" height="44" fill="#00BFBF"/><rect x="480" y="16" width="80" height="44" fill="#0000BF"/><rect x="560" y="16" width="80" height="44" fill="#BF00BF"/>
        <rect x="80" y="86" width="80" height="44" fill="#2B2B00"/><rect x="160" y="86" width="80" height="44" fill="#555500"/><rect x="240" y="86" width="80" height="44" fill="#808000"/><rect x="320" y="86" width="80" height="44" fill="#AAAA00"/><rect x="400" y="86" width="80" height="44" fill="#D4D400"/><rect x="480" y="86" width="80" height="44" fill="#FFFF40"/><rect x="560" y="86" width="80" height="44" fill="#FFFFA6"/>
        <rect x="80" y="156" width="80" height="44" fill="#9A9A9A"/><rect x="160" y="156" width="80" height="44" fill="#A2A27E"/><rect x="240" y="156" width="80" height="44" fill="#A9A962"/><rect x="320" y="156" width="80" height="44" fill="#B0B046"/><rect x="400" y="156" width="80" height="44" fill="#B8B82A"/><rect x="480" y="156" width="80" height="44" fill="#BFBF0E"/><rect x="560" y="156" width="80" height="44" fill="#CCCC00"/>
      </g>
      <g font-size="13" style="fill:#5C5C5C"><text x="648" y="44">種類</text><text x="648" y="104">暗い</text><text x="648" y="124">→明るい</text><text x="648" y="174">くすむ</text><text x="648" y="194">→鮮やか</text></g>
    </svg>
    <figcaption><span class="no">図1</span>上の段は色の種類だけを変えた。中の段は同じ黄色の明るさだけ、下の段は鮮やかさだけを変えている。</figcaption>
  </figure>
  <p>この3つの言葉があると、「なんか派手すぎる」を「彩度が高すぎる」と言い換えられる。「暗くて見づらい」なら明度、「色がちぐはぐ」なら色相の組み合わせを疑う。言い換えられると、どこを直せばいいかが分かる。配色の考え方は画編の「色」で扱う。</p>

  <h2>画面の色は、光の三原色でできている</h2>
  <p>スマホやモニターの画面は、赤（R）、緑（G）、青（B）の3色の光を混ぜて、すべての色を作っている。これを光の三原色と呼ぶ。光は混ぜるほど明るくなり、3色を全部重ねると白になる。絵の具が混ぜるほど暗く濁っていくのとは、ちょうど逆の性質だ。</p>
  <figure class="fig" aria-label="赤、緑、青の光の円を重ねると、重なった所が黄、シアン、マゼンタになり、中央が白になる図">
    <svg viewBox="0 0 720 300" role="img">
      <rect x="190" y="0" width="340" height="300" fill="#000"/>
      <g style="mix-blend-mode:screen;isolation:isolate">
        <circle cx="315" cy="115" r="85" fill="#FF0000" style="mix-blend-mode:screen"/>
        <circle cx="405" cy="115" r="85" fill="#00FF00" style="mix-blend-mode:screen"/>
        <circle cx="360" cy="190" r="85" fill="#0000FF" style="mix-blend-mode:screen"/>
      </g>
      <g font-size="15"><text x="176" y="80" text-anchor="end">赤（R）</text><text x="544" y="80">緑（G）</text><text x="544" y="250">青（B）</text>
      <text x="176" y="250" text-anchor="end">重なると明るくなり、</text><text x="176" y="272" text-anchor="end">3色で白になる</text></g>
    </svg>
    <figcaption><span class="no">図2</span>赤と緑が重なると黄、緑と青でシアン、青と赤でマゼンタになる。</figcaption>
  </figure>
  <p>このサイトの編の色は、テレビの試験用の図「カラーバー」から取っている。カラーバーの色も、この三原色の組み合わせだ。準備編の黄は赤と緑、画編のシアンは緑と青、音編のマゼンタは赤と青の光を混ぜた色になっている。</p>
  <p>映像を作るソフトの中でも、色は赤・緑・青の3つの数値で扱われることが多い。色を数値で指定するときに出てくる #BFBF00 のような書き方も、赤・緑・青の強さを順に並べたものだ。</p>

  <h2>光の向きと影の出方</h2>
  <p>被写体のどこが明るく、どこに影が落ちるかは、光の向きで決まる。正面からの光を順光、横からの光をサイド光、被写体の後ろからの光を逆光と呼ぶ。</p>
  <figure class="fig" aria-label="同じ球に、正面、横、後ろから光を当てたときの明るさと影の違いを並べた図">

        <radialGradient id="mq-l1" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#F2F2B0"/><stop offset=".75" stop-color="#BFBF00"/><stop offset="1" stop-color="#8C8C00"/></radialGradient>
        <radialGradient id="mq-l2" cx="12%" cy="45%" r="95%"><stop offset="0" stop-color="#F2F2B0"/><stop offset=".45" stop-color="#BFBF00"/><stop offset=".7" stop-color="#3A3A00"/><stop offset="1" stop-color="#1A1A00"/></radialGradient>
        <radialGradient id="mq-l3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#262600"/><stop offset=".86" stop-color="#3A3A00"/><stop offset=".95" stop-color="#BFBF00"/><stop offset="1" stop-color="#FFFFC0"/></radialGradient>
      </defs>
      <circle cx="120" cy="120" r="72" fill="url(#mq-l1)"/>
      <circle cx="360" cy="120" r="72" fill="url(#mq-l2)"/>
      <circle cx="600" cy="120" r="72" fill="url(#mq-l3)"/>
      <ellipse cx="120" cy="204" rx="56" ry="7" fill="#D9D9D9"/>

      <ellipse cx="600" cy="210" rx="40" ry="6" fill="#D9D9D9"/>

      <g font-size="13" text-anchor="middle" style="fill:#5C5C5C"><text x="120" y="28">光は見る人の側から</text><text x="360" y="28">光は左から</text><text x="600" y="28">光は球の後ろから</text></g>
    </svg>
    <figcaption><span class="no">図3</span>順光は影が少なく、形が平らに見える。サイド光は明るい面と暗い面に分かれ、丸みや凹凸が強く出る。逆光は手前が暗くなり、輪郭だけが光る。</figcaption>
  </figure>
  <p>どれが正解ということはない。順光は顔や商品をはっきり見せたいときに、サイド光は立体感や緊張感を出したいときに、逆光はシルエットや空気感を見せたいときによく使われる。</p>
  <p>合成や3DCGで素材が浮いて見えるとき、原因の一つは、素材ごとに光の向きがそろっていないことだ。左から光が当たっている背景に、右から光が当たった人物を重ねると、見る人は理由が分からなくても違和感を覚える。光の向きを意識するだけで、画面全体のまとまりは変わる。光の質や当て方は、画編の「光とライティング」で扱う。</p>

  <h2>色温度とホワイトバランス</h2>
  <p>光には色がある。電球の光や夕日はオレンジ寄りで、曇りの日や日陰は青寄りだ。この光の色をケルビン（K）という単位の数字で表したものを、色温度と呼ぶ。数字が低いほどオレンジ寄り、高いほど青寄りになる。</p>
  <figure class="fig" aria-label="色温度の数字が低いとオレンジ、高いと青になることを、横長の帯と光源の目安で示した図">
    <svg viewBox="0 0 720 150" role="img">
      <defs><linearGradient id="mq-ct" x1="0" x2="1"><stop offset="0" stop-color="#FF8A1E"/><stop offset=".1" stop-color="#FFB46B"/><stop offset=".375" stop-color="#FFF4E6"/><stop offset=".6" stop-color="#E6EEFF"/><stop offset="1" stop-color="#9DB8FF"/></linearGradient></defs>
      <rect x="20" y="40" width="680" height="44" fill="url(#mq-ct)" stroke="#000" stroke-width="2"/>
      <g font-size="14" style="fill:#5C5C5C"><text x="20" y="28">2000K</text><text x="700" y="28" text-anchor="end">10000K</text></g>
      <g stroke="#000" stroke-width="2"><line x1="88" y1="84" x2="88" y2="100"/><line x1="275" y1="84" x2="275" y2="100"/><line x1="428" y1="84" x2="428" y2="100"/></g>
      <g font-size="14" text-anchor="middle"><text x="88" y="120">電球</text><text x="88" y="140">約2800K</text><text x="275" y="120">晴れた日の太陽</text><text x="275" y="140">約5000K</text><text x="428" y="120">曇り空</text><text x="428" y="140">約6800K</text></g>
    </svg>
    <figcaption><span class="no">図4</span>数字はおおよその目安。同じ「白い光」に見えても、光源によって色はかなり違う。</figcaption>
  </figure>
  <p>人の目は、光の色が変わっても白いものを白く感じるように、自然に補正している。カメラはそうはいかないので、光の色に合わせて「どの色を白として写すか」を設定する。これがホワイトバランスだ。電球の部屋で撮った映像がオレンジっぽくなったり、日陰で撮った映像が青っぽくなったりするのは、ホワイトバランスが光に合っていないからである。</p>
  <p>場所を変えて撮った素材をつなぐと、カットごとに色味が飛ぶことがある。撮るときにホワイトバランスをそろえておくか、編集で色を合わせる必要がある。逆に、あえてオレンジ寄りや青寄りに振って、時間帯や気分を伝えることもできる。夕方の温かさや、夜の冷たさは、色温度でかなり表現できる。</p>
</template>

<template id="body-prep-4">
  <h2>音は空気の振動</h2>
  <p>音の正体は、空気の震えだ。スピーカーやのどが空気を押したり引いたりすると、その揺れが波になって耳まで届く。この揺れを横に時間、縦に揺れの大きさを取って描いたものを波形と呼ぶ。編集ソフトの音のトラックに出ているギザギザも、この波形だ。</p>
  <p>波形を見ると、音の基本的な性質のうち2つが読み取れる。揺れの大きさが音量、揺れの細かさが音の高さにあたる。</p>
  <figure class="fig" aria-label="揺れの大きさが違う2つの波と、揺れの細かさが違う2つの波を並べた図">

  <h2>音量とデシベル</h2>
  <p>音の大きさはデシベル（dB）で表す。編集ソフトの音量メーターは、0dBを上限として、そこから下へマイナスの数字で表示されることが多い。-6dB、-12dBのように、数字が小さいほど小さい音だ。</p>
  <p>0dBは、デジタルで記録できる大きさの天井にあたる。それを超える大きさの音は、天井で頭を切り落とされて記録される。これをクリップと呼ぶ。クリップした音は、バリバリと割れたように聞こえ、後から音量を下げても元には戻らない。</p>

  <p>デシベルの数字は、足し算のように素直には増えない。6dB上げると、波の揺れの大きさはおよそ2倍になる。メーターの上では小さな変化でも、耳には大きな違いになることがある。音量を触るときは、数字だけでなく耳でも確かめる。投稿先ごとの音量の基準（ラウドネス）は、<a href="#sound-3">4.3</a>で扱う。</p>

  <h2>音の高さと周波数</h2>
  <p>音の高さは、空気が1秒に何回震えるか、つまり周波数（Hz、ヘルツ）で決まる。数字が小さいほど低い音、大きいほど高い音になる。人の耳に聞こえる範囲は、おおよそ20Hzから20000Hz（20kHz）とされ、年齢とともに高い側から聞こえにくくなっていく。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/3ilvfaM8HdY?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="20 Hz - 20 kHz Audio Frequency Sweep" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>20 Hz - 20 kHz Audio Frequency Sweep（Test Tones）。20Hzから20kHzまで、60秒かけて音が高くなっていく試験音。どこから聞こえ、どこで聞こえなくなるかを試せる。再生する前に音量を小さくしておくこと。<a class="yt" href="https://www.youtube.com/watch?v=3ilvfaM8HdY" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>
  <p>人の声の主な成分は、数百Hzから数千Hzのあたりに集まっている。BGMと声が重なって聞き取りにくいとき、両方がこのあたりの帯域でぶつかっていることが多い。イコライザー（EQ）は、帯域ごとに音量を上げ下げする道具で、BGMの声とぶつかる帯域だけを少し下げる、といった使い方をする。どの帯域を誰に譲るかという考え方は、音編の「音の情報量」で扱う。</p>

  <h2>音色と倍音</h2>
  <p>同じ高さ、同じ大きさの音でも、ピアノと声とギターは聞き分けられる。この違いを音色と呼ぶ。</p>
  <p>楽器や声の音は、基本の高さの波の上に、その2倍、3倍、4倍……の細かい波が重なってできている。この重なっている波を倍音と呼ぶ。どの倍音がどれくらい混ざっているかで、波形の形が変わり、音色が変わる。</p>

<template id="body-prep-5">
  <h2>道具は役割で分ける</h2>
  <p>映像を作る道具は種類が多く、同じ役割のソフトがいくつもある。この章では製品の名前ではなく、道具が受け持つ役割で全体像を整理する。役割が分かっていれば、どのソフトを使っていても、今どの段階の作業をしているのかが分かる。</p>
  <ul>
    <li>編集：素材を時間の上に並べ、切り、つなぎ、音を付けて1本の映像にする。ほとんどの映像は、最後にこの役割の道具を通って書き出される。</li>
    <li>合成：複数の素材を重ね、動きや効果を付けて、1つの画面の中身を作り込む。モーショングラフィックス、文字PV、MVの多くはここで作られる。</li>
    <li>3DCG：仮想の空間に形を作り、質感、光、カメラを決めて、画像として書き出す。</li>
    <li>デザインと作画：静止画のレイアウト、イラスト、ロゴ、文字の配置を作る。動き出す前の1枚絵もここで作ることが多い。</li>
    <li>音：声の録音、ノイズの除去、BGMや効果音の調整を行う。</li>
  </ul>
  <p>一つのソフトが複数の役割を持っていることも多い。編集ソフトの中に合成の機能が入っていたり、3DCGソフトで編集までできたりする。それでも、今やっている作業がどの役割にあたるかを意識しておくと、詰まったときにどの章や資料を探せばいいかが分かりやすい。</p>

  <h2>素材が書き出しまで流れる道</h2>
  <p>役割ごとの道具は、ばらばらに使うものではない。素材は道具の間を流れながら、最後に1本の映像にまとまる。</p>

  <p>ジャンルによって、どの役割に時間を使うかは大きく変わる。Vlogや切り抜きは編集が中心で、モーショングラフィックスや文字PVは合成が中心になる。3DCGの作品は、3DCGで作った画像を合成で仕上げてから編集に入ることが多い。自分のジャンルの流れは、応用編の各ジャンルの1章目で扱う。</p>

  <h2>機材より先に決めること</h2>
  <p>カメラ、マイク、パソコン、ペンタブレットなど、機材にもきりがない。ただ、機材やソフトは、何を作りたいかが決まってから選ぶ方が迷いにくい。</p>
  <p>高い機材があっても、魅せたいものが決まっていなければ映像は良くならない。逆に、スマホと無料のソフトでも作れる映像はたくさんある。今の道具で作ってみて、「この表現をするには道具が足りない」とはっきりしたときが、買い替えや乗り換えを考えるときだ。0.7で書いた言い方を借りれば、頭の出力が先にあり、道具はそれを形にするための手段になる。</p>
  <p>パソコンについて一つだけ書いておくと、映像の作業は重い。解像度やfpsを上げるほど、編集中の再生がカクついたり、書き出しに時間がかかったりする。1.1と1.2で決めた設定が、今のパソコンで無理なく扱えるかも、作り始める前に確かめておく。</p>

  <h2>操作はこのサイトの外で学ぶ</h2>
  <p>このサイトでは、ソフトの操作手順は扱わない。操作はソフトごとの公式の説明や解説動画の方が詳しく、版が変わるたびに古くなるからだ。</p>
  <p>ここで扱うのは、どのソフトを使っても変わらない、何をなぜするかの部分である。操作を調べるときは、「やりたいこと」を言葉で言えると探しやすい。このサイトで覚えた用語は、そのまま検索の言葉としても使える。</p>

  <h2>主役を1つに決める</h2>
  <p>1コマの中で一番見せたいもの、つまり主役は、1つに絞ると読みやすい。主役の候補が2つ同じ強さで並ぶと、目が2つの間を行き来して落ち着かない。2人の向かい合いのように、あえて2つを並べて対比を見せる画もあるが、その場合も「2つの関係」が主役になっている。</p>
  <p>主役を決めることは、入れないものを決めることでもある。画面の端に写り込んだ物、背景の看板の文字、通りすがりの人は、主役から目を奪いやすい。撮る前に一歩寄る、少し角度を変える、背景が整理された場所を選ぶ。どれも構図の仕事だ。</p>

  <h2>余白と被写体の大きさ</h2>
  <p>被写体の周りに何もない空間、つまり余白も構図の一部だ。被写体を大きく置けば迫力や表情の細かさが出て、小さく置いて余白を広く取れば、孤独や静けさ、その場所の広さが出る。同じ人物でも、どの大きさで切り取るかで伝わることが変わる。</p>
  <p>人物の視線や進む方向の先に余白を取ると、画面に流れが生まれる。この空間をリードルームと呼ぶ。逆に、視線の先を詰めて背中側を広く空けると、窮屈さや、後ろから何かが来るような不安が出る。これも意図して使えば一つの表現になる。</p>

  <h2>スタイルフレームとは何か</h2>
  <p>スタイルフレームは、動き出す前に作る、完成形の1枚絵だ。作品の色、形、書体、質感を、止まった画面で先に決めておく。</p>
  <p>似た言葉に絵コンテがある。絵コンテは、何がどの順番で起きるかという流れを決める下書きで、絵は簡単でいい。スタイルフレームは、完成したときの見た目を決める見本で、そのまま本編の1コマになるくらいまで作り込む。流れは絵コンテで、見た目はスタイルフレームで決める、と分けて考えると整理しやすい。</p>
  <p>モーショングラフィックスの制作でよく使われるが、文字PVや3DCGでも同じ考え方が使える。実写でも、撮る前に「こういう画にしたい」という色や光の参考を1枚にまとめておくのは、スタイルフレームに近い。</p>

  <h2>なぜ先に止めた絵で決めるのか</h2>
  <p>動かしながらデザインを考えると、動きの面白さに目を取られて、1枚の絵としての弱さに気づきにくい。先に止めた絵で完成させておけば、後は動かすことに集中できる。</p>
  <p>仕事では、依頼主と完成の見た目をすり合わせる道具にもなる。動かし終わってから「色の方向が違う」となると、作り直す量が大きい。止めた絵の段階なら、直すのは1枚で済む。</p>
  <p>isshinはインタビュー動画で、モーショングラフィックスは、モーションももちろん大事だが、グラフィックの面が大きいと話している。自分の作品についても、動きの気持ちよさだけでなく、1枚の静止画として見てもいいものを目指したと語り、話のまとめでは「いいグラフィックでなんぼ」と言っている（動画1、6分〜9分ごろと、終わりの方）。これはモーショングラフィックスの制作についての話で、映像一般で画が動きより大事だという意味ではない。</p>

  <h2>先に絵を決めないジャンルもある</h2>
  <p>ここまでとは逆の作り方をするジャンルもある。プログラムで形や動きを生み出す、ジェネラティブと呼ばれるジャンルだ。p5.jsのようなプログラミングの道具を使い、図形の数、位置、色、動きを、自分で決めたルールと乱数（ランダムな数）で決める。同じプログラムでも、動かすたびに違う画が生まれる。観客の前でコードを書き換えながら、その場で映像を変えていくライブコーディングという見せ方もある。</p>
  <p>このジャンルでは、1枚の完成形を先に決めて、構図を1コマずつ詰めることはあまりしない。ルールを作り、何が生まれるかを見ながら育てていく。ルールと偶然から生まれる形や動きそのものを見せる映像だ。スタイルフレームは多くのジャンルで役に立つが、すべての映像の作り方ではない。その例として知っておくといい。</p>

  <h2>デザインの4原則</h2>
  <p>1枚の画面のデザインを考えるときの手がかりとして、ロビン・ウィリアムズが『ノンデザイナーズ・デザインブック』で示したデザインの4原則がある。デザインを専門に学んでいない人に向けて書かれた本で、映像のタイトル画面、テロップ、サムネイルにもそのまま使える。</p>
  <ul>
    <li>近接：関係のあるものは近づけ、関係のないものは離す。近くにあるものは、ひとまとまりに見える。</li>
    <li>整列：要素を、見えない線にそろえて置く。端がそろっているだけで、画面は整理されて見える。</li>
    <li>反復：色、形、書体、線の太さなどを繰り返し使う。繰り返しが、作品全体のまとまりになる。</li>
    <li>コントラスト：違うものは、はっきり違えて見せる。大きさ、明るさ、色、太さの差が中途半端だと、「違うのか、同じなのか」と見る人を迷わせる。</li>

  <h2>階層：何を一番に見せるか</h2>
  <p>4原則のコントラストを、画面の中の順番づけに使うと階層になる。一番見せたいものを一番大きく、明るく、強い色で置き、二番目、三番目と順に弱めていく。全部を同じ強さで置くと、どれも目立たなくなる。2.1の「最初に目が行く場所」と同じ考えを、文字や図形の並びに当てはめたものと言える。</p>
  <p>確かめるには、画面を小さく縮めるか、目を細めてぼかして見るといい。細かい所が見えなくなっても一番目立っているものが、一番見せたいものと一致していれば、階層ができている。</p>

  <h2>読む順番の型：Z型、F型、N型</h2>
  <p>2.1では、線や明るさの差で目の通り道を作る話をした。文字や図形が並ぶ画面では、目は文字の向きに沿っても動く。横書きなら左上から右へ、縦書きなら右上から下へ読み始める。この読む順番に合わせて要素を置く型に、Z型、F型、N型がある。</p>
  <ul>
    <li>Z型：左上から右上、左下、右下と、Zの字の順に目が動く前提で置く。要素の少ない画面に向いていて、左上に題名、右上に絵、左下に説明、右下に日時やロゴのように置く。タイトル画面、告知、サムネイルで使いやすい。</li>
    <li>F型：左端に沿って上から下へ見ていき、ところどころで右へ読み進める。Nielsen Norman Groupが2006年に発表した、Webページを読む人の視線の計測で見られた動き方だ。文字の多い画面では、大事な言葉を行の頭（左側）に置くと拾われやすい。</li>
    <li>N型：縦書きの画面の型。右上から下へ読み、1列読み終えたら左の列の上へ移る。縦書きのポスターや題字で、読ませたい順に右から左へ要素を並べる。</li>

  <h2>形と質感をそろえる</h2>
  <p>線の太さ、角の丸さ、紙のようなざらつき、光沢。こうした質感が作品の中でばらばらだと、1本の作品としてのまとまりが弱くなる。4原則の反復を、作品全体に広げた考え方だ。スタイルフレームの段階で、線は何px、角は丸める、影は付けない、といったルールを決めておくと、後から足す要素も迷わず作れる。</p>
  <p>Vlogでも同じことができる。テロップの書体、色、出し方を作品を通してそろえると、それがチャンネルの顔になる。</p>

  <h2>作り方の流れ</h2>
  <ol>
    <li>参考を集める。好きな映像だけでなく、写真、ポスター、街や自然の色も入れる。</li>
    <li>作品で一番大事な場面を1枚、完成形まで作る。</li>
    <li>その1枚で決めた色、書体、質感のルールで、ほかの場面を3〜5枚作る。</li>
    <li>全部を並べて見て、1枚だけ浮いている所を直す。</li>

<template id="body-visual-3">
  <h2>色の3つの役割</h2>
  <p>色を言い表す言葉（色相・明度・彩度）は、準備編の「色と光の最低限」で扱った。この章では、その色を画面の中でどう使うかを考える。このサイトでは、映像の色の役割を3つに分けて考える。目を引くこと、情報を分けること、気分を作ることだ。</p>
  <p>1つの色が3つを同時にこなすこともある。たとえば暗い夜の場面で1つだけ赤い傘を写せば、目を引き、その人物を周りと分け、寂しさの中の温かさのような気分も作る。色を選ぶときは、その色にどの役割を持たせたいかを先に考えると迷いにくい。</p>

  <h2>配色の型：同系、補色、アクセント</h2>
  <p>色相を円の形に並べたものを色相環と呼ぶ。配色の型は、この円の上で色同士がどれくらい離れているかで考えると分かりやすい。</p>

  <p>色相の近い色でまとめる同系色の配色は、落ち着いた統一感が出る。色相環で向かい合う補色を組み合わせると、強い対比が出る。全体を少ない色でまとめて1色だけ目立つ色を差すアクセントカラーは、見せたい所に視線を集めやすい。</p>
  <p>実写でも、写るものの色を選べば配色を作れる。夕方の暖かい色の街に青い服の人を立たせれば、補色の対比で人物が浮き上がる。白や灰色の壁の前で、手に持った1つの物だけ鮮やかな色にすれば、アクセントカラーになる。服や小物、撮る場所を選ぶことも、配色の一部だ。</p>

  <h2>色より先に、明るさの差</h2>
  <p>色相がはっきり違っても、明度が近い2色は、白黒にすると同じような灰色になる。2.1で書いた通り、目が最初に拾うのは明るさの差だ。色の差だけで主役と背景を分けていると、思ったほど主役が浮かないことがある。</p>

  <p>配色を確かめるときは、一度彩度を0にして白黒で見るといい。白黒でも主役と背景が分かれて見えるなら、色はその上で自由に選べる。</p>

  <h2>色で情報を分ける</h2>
  <p>色は雰囲気だけでなく、情報も運ぶ。ゆっくり実況でキャラクターごとに字幕の色を変える、グラフの項目を色で分ける、このサイトで編ごとに色を変えている。どれも色で情報を分ける使い方だ。</p>
  <p>分けるときは、色の数を絞る。色が多すぎると、どの色が何を表すかを覚えきれない。また、色の見え方は人によって違い、赤と緑の区別がつきにくい人もいる。色だけに頼らず、明るさの差や、形、位置の違いも合わせて付けておくと、より多くの人に伝わる。</p>

  <h2>配色を探す・試すサイト</h2>
  <p>配色を一から考えるのが難しいときは、配色を作ったり、ほかの人の配色を探したりできるサイトが役に立つ。</p>
  <ul>
    <li><a href="https://color.adobe.com/ja/" target="_blank" rel="noopener">Adobe Color</a>：色相環の上で、同系色や補色などの型を選ぶと、それに沿った配色が作れる。写真を読み込んで、その中の色を取り出す機能もある。作った配色が、色の見え方の違う人にも見分けやすいかを確かめる機能もあり、上の節の注意をそのまま試せる。</li>
    <li><a href="https://coolors.co/" target="_blank" rel="noopener">Coolors</a>：キーを押すたびに5色の配色が出てきて、気に入った色を固定しながら、残りの組み合わせを探せる。ほかの人が作った配色の一覧も見られる。</li>
  </ul>
  <p>好きな写真や映画の場面から色を取り出してみると、なぜその画をいいと感じるのかを、色の面から確かめられる。取り出した配色は、そのまま自分の作品の出発点にもなる。</p>

  <h2>作品全体の色の設計</h2>
  <p>1コマごとの配色が良くても、場面ごとに色の方向がばらばらだと、作品としてのまとまりが弱くなる。作品全体で使う色を先に数色決め、その中で場面ごとの変化を付けるといい。</p>
  <p>場面ごとの色の変化を、作る前に一列に並べて決める方法にカラースクリプトがある。各場面を小さな色の絵にして横に並べ、作品の始まりから終わりまで、色と光がどう移り変わるかを一目で見られるようにしたものだ。ピクサーの『トイ・ストーリー』（1995）でラルフ・エグルストンが作ったことでよく知られている。エグルストン本人は、それより前に美術監督を務めた『FernGully: The Last Rainforest』（1992）でこの方法を使い始めたという。</p>

<template id="body-visual-4">
  <h2>読ませる文字と、見せる文字</h2>
  <p>映像の中の文字は、2つに分けて考えると整理しやすい。字幕や説明のテロップのように、内容を読んでもらうための文字と、タイトルや文字PVのように、文字の形そのものを見せる文字だ。</p>
  <p>読ませる文字は、読みやすさが一番大事になる。見せる文字は、読みやすさをある程度手放してでも、形や動きで印象を作ることがある。1本の作品の中に両方が出てくることも多いので、今置こうとしている文字がどちらなのかを先に決めておくと、書体も大きさも選びやすい。</p>

  <h2>書体の性格</h2>
  <p>書体には性格がある。明朝体は、縦の線が太く横の線が細く、筆の名残の形があり、落ち着きや物語らしさ、上品さを感じさせやすい。ゴシック体は線の太さが均一で、はっきりして現代的に見え、字幕や説明に向いている。角を丸めた丸ゴシックは、柔らかく親しみやすい印象になる。手書き風や装飾の強い書体は印象が強い分、長い文には向きにくい。</p>
  <figure class="fig" aria-label="同じ「映像の時間」という言葉を、明朝体、ゴシック体、丸ゴシック体で並べた図">
    <svg viewBox="0 0 720 200" role="img">
      <g font-size="44">
        <text x="0" y="62" style="font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP',serif">映像の時間</text>
        <text x="0" y="122" style="font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif">映像の時間</text>
        <text x="0" y="182" style="font-family:'Hiragino Maru Gothic ProN','Zen Maru Gothic','M PLUS Rounded 1c','Hiragino Sans',sans-serif">映像の時間</text>
      </g>
      <g font-size="15" style="fill:#5C5C5C"><text x="300" y="54">明朝体：落ち着き、物語らしさ</text><text x="300" y="114">ゴシック体：はっきり、現代的</text><text x="300" y="174">丸ゴシック：柔らかい、親しみ</text></g>
    </svg>
    <figcaption><span class="no">図1</span>同じ言葉でも、書体で受け取る印象が変わる。表示される書体は、見ている端末によって少し違う。</figcaption>
  </figure>
  <p>選ぶときは、その文字で何を伝えたいかから考える。かっこいい書体を先に選んでから内容を合わせると、作品の空気とずれやすい。また、1本の作品で使う書体は2〜3種類に絞ると、2.2の反復の原則どおり、まとまりが出やすい。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/_CTvqaqLsIQ?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="テロップデザインの基礎" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>テロップデザインの基礎をデザイナーに教えてもらいました（まきおfilm）。明朝とゴシックの使い分け、文字の間隔などを、テロップの実例で説明している。<a class="yt" href="https://www.youtube.com/watch?v=_CTvqaqLsIQ" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>大きさ、字間、行間、置き場所</h2>
  <p>文字の大きさと太さは、2.2で書いた階層を作る道具だ。一番読ませたい言葉を大きく、補足を小さく置く。</p>
  <p>文字と文字の間（字間）を詰めると締まった強い印象になり、広げると静かで落ち着いた印象になる。大きく置くタイトルは、書体のままだと字間が不ぞろいに見えることがあるので、1文字ずつ間隔を整える。行と行の間（行間）は、狭いと詰まって読みにくく、広すぎると行のつながりが切れて見える。</p>
  <p>置き場所にも気をつけたい。画面の端ぎりぎりに置いた文字は、見る環境によって切れたり、縦型動画ではアプリのボタンや説明文に隠れたりする。大事な文字は、画面の端から内側に余裕を取った範囲に収める。この範囲をセーフエリアと呼ぶ。縦型の画面でUIが重なる範囲は、準備編の「解像度とアスペクト比」で扱った。</p>
  <figure class="fig" aria-label="字間を詰めた、標準の、広げた文字の比較と、16対9の画面の内側にセーフエリアの点線を引いた図">

      <g font-size="30">

      </g>
      <g font-size="13" style="fill:#5C5C5C"><text x="0" y="72">詰める：締まって強い</text><text x="0" y="132">標準</text><text x="0" y="192">広げる：静かで落ち着く</text></g>

  <h2>背景との差を作る</h2>
  <p>写真や動く映像の上に文字を置くとき、背景と文字の明るさの差が小さいと読めない。2.3で書いた通り、目は色の差より先に明るさの差を拾う。差を作る方法は主に4つある。文字に縁取りを付ける、影を落とす、文字の下に帯や板を敷く、背景のほうを暗くしたりぼかしたりする。</p>

  <p>どの方法も、やりすぎると文字が重く見える。作品の書体や質感のルールに合う方法を1つ選び、作品を通してそろえるといい。</p>

  <h2>表示時間：読み切れるか</h2>
  <p>映像の文字は、紙の文字と違って、表示される時間が決まっている。読み切れないうちに消える字幕は、見る人にストレスを残す。</p>
  <p>目安の一つとして、Netflixの日本語字幕のガイドラインでは、字幕を読む速さの上限を1秒あたり4文字としている。20文字の字幕なら、5秒は出しておく計算になる。字幕の翻訳のための基準だが、テロップやVlogの説明文の長さを考えるときの手がかりにもなる。</p>
  <p>逆に、あえて読み切れない速さで文字を流し、情報量の多さや勢いを感じさせる演出もある。読ませる文字と見せる文字を分けて考えていれば、どちらを選んでいるかがはっきりする。文字PVでの具体的な使い方は、応用編Bで扱う。</p>

  <h2>タイトルデザインという仕事</h2>
  <p>映画の冒頭のタイトルを、作品の一部としてデザインしてきた人たちがいる。ソール・バスは、アルフレッド・ヒッチコック監督の『めまい』（1958）などのタイトルで、図形と文字を動かして、本編が始まる前から作品の空気を伝えた。日本では、赤松陽構造が多くの映画の題字やタイトルを手がけている。文字を見せる側の仕事の例として、見ておくと参考になる。</p>

  <h2>フォントのライセンス</h2>
  <p>フォントには、使ってよい範囲を決めたライセンスがある。無料で配られているフォントでも、動画での使用や、収益化した動画などの商用利用、ロゴへの使用を認めていないものがある。使う前に、配布元の利用規約で、動画に使えるか、商用利用ができるかを確かめておく。部の作品を投稿したり、外部に出したりする場合も同じだ。</p>

  <h2>機材がなくてもできること</h2>
  <p>照明の機材がなくても、光は選べる。窓の光をキーライトにして、人物を窓に対して斜めに座らせる。晴れた日の直射が硬すぎれば、レースのカーテンを閉めて柔らかくする。影が濃すぎれば、窓の反対側に白い紙や板を置いて光を返し、フィルライトの代わりにする。光を返すための板をレフ板と呼ぶ。</p>

  <h2>光の色で、時間と気分を作る</h2>
  <p>光の色は、時間と気分を伝える。オレンジ寄りの光は夕方や室内の温かさを、青寄りの光は夜明けや夜の冷たさを感じさせやすい。色温度の数字の話は、準備編の「色と光の最低限」で扱った。</p>

<template id="body-motion-1">
  <h2>動きは、コマとコマの間で生まれる</h2>
  <p>映像は静止画の連続だと、<a href="#intro-1">0.1</a>で書いた。1枚ずつの絵の良さは画編で扱った。動き編が扱うのは、その絵と絵の間、つまり1コマ目から2コマ目へ、何がどれだけ変わるかだ。同じ絵を並べても、変化の付け方しだいで、動きは重くも軽くも、気持ちよくもぎこちなくもなる。</p>
  <p>0.1では、止めると崩れて見えるのに、動かすと気持ちいいコマがあることも書いた。それが起きるのは、気持ちよさが1枚の中ではなく、変化のほうにあるからだ。この章では、その変化をどう設計するかを考える。</p>

  <h2>動きを3つに分けて考える</h2>
  <p>このサイトでは、動きを次の3つに分けて考える。</p>
  <ol>
    <li>速さの変化：どこで速くなり、どこで遅くなり、どこで止まるか。次の章「<a href="#motion-2">イージング</a>」で詳しく扱う。</li>
    <li>方向と軌道：どちらへ向かい、どんな線を描いて動くか。</li>
    <li>タイミング：何コマかけて動くか。何と同時に、何より後に動くか。</li>
  </ol>
  <p>動きがぎこちないと感じたら、この3つのどれがずれているかを探すと、直す場所が見つけやすい。3つすべてに「何を魅せたいか」からの理由がある動きは、見ていて迷いがない。</p>

  <h2>軌道は弧を描く</h2>
  <p>腕を振る、首を振る、ボールを投げる。生き物の動きや、投げた物の動きは、ほとんどが関節や重力のせいで弧を描く。2点の間をまっすぐ結んで動かすと、機械が動いているように見えやすい。アニメーションの12原則でも、弧（アーク）は原則の一つに数えられている（12原則は「<a href="#motion-4">歴史：動きの原則</a>」で一覧にしている）。</p>

  <h2>予備動作とフォロースルー</h2>
  <p>ボールを投げる前には、腕を一度後ろへ引く。止まった後も、髪や服は少し遅れて揺れる。動きの前の溜めを予備動作、止まった後の余韻をフォロースルーと呼ぶ。</p>
  <p>予備動作があると、見る人は次に何が起きるかを一瞬早く察知でき、動きを見逃しにくい。溜めが長いほど、その後の動きは強く、速く感じられる。フォロースルーがあると、物に重さや柔らかさが感じられ、動きがぷつりと切れずに収まる。</p>

  <h2>動きの主役を1つにする</h2>
  <p><a href="#visual-1">2.1</a>で、1つの画面に主役を1つ決めると書いた。動きにも同じことが言える。目は、止まっているものより動いているものに引かれる。画面の中で同時にたくさんのものが動くと、どれを見ればいいか分からなくなる。</p>
  <p>たくさんの要素を出すときは、出す順番を決めて、動き出しを少しずつずらす。ずらす順番が、見てほしい順番になる。</p>

  <h2>止めると崩れるコマの役割</h2>
  <p>速い動きを表すために、アニメでは、ブレた絵や、極端に引き伸ばした絵を1コマだけ入れることがある。止めて見ると崩れているが、流れの中では速さとして感じられる。実写のカメラでも、シャッターが開いている間に被写体が動けば、その軌跡がブレとして写る。モーショングラフィックスや3DCGでは、このブレを計算で付けるモーションブラーがある。</p>

  <p>大事なのは、崩れが偶然ではなく、速さを伝えるために置かれていることだ。0.1の定義に照らせば、崩れたコマにも「何を魅せたいか」の意図が設計されている状態である。</p>

  <h2>実写では、撮る前に動きを決める</h2>
  <p>実写やVlogでは、被写体の動きを後から作り直すことは難しい。そのぶん、撮る前に動きを決めておく。人がどちらから画面に入り、どちらへ歩いて、どこで止まるか。手前から奥へ歩くのか、横切るのか。画面の外から入ってくるのか、最初から画面の中にいるのか。</p>
  <p>同じ「歩く」でも、画面の端から入って中央で止まれば、そこに着いたことが伝わる。画面の中を横切って反対側へ抜ければ、通り過ぎていく途中の一場面に見える。動きの方向と、止まる位置を決めることは、実写での動きの設計になる。カメラ自体の動きは、3.3の「<a href="#motion-3">カメラワーク</a>」で扱う。</p>

  <h2>等速の動きは、機械に見えやすい</h2>
  <p>現実の物は、急に最高速度で動き出したり、急に止まったりしない。机の上のコップを押せば、ゆっくり動き出して速くなり、摩擦で遅くなって止まる。動き出しの加速と、止まる前の減速を付けることを、イージングと呼ぶ。</p>
  <p>身近な例は、スマホの画面だ。一覧を指ではじくと、指を離した後も画面は滑り続け、だんだん遅くなって止まる。いきなり止まらず、減速しながら止まるので、画面の中の一覧が、重さのある物として手の動きを受け止めたように感じられる。もし、はじいた一覧が同じ速さで流れて、ぴたりと止まったら、どこか機械的で、触っている感じが薄くなるはずだ。</p>
  <p>加速も減速もない等速の動きは、コマごとに同じ距離だけ進む。図1の上の段のように、玉の間隔がすべて同じになる。この動きは、ベルトコンベアやエスカレーターのような、機械的で硬い印象になりやすい。</p>

  <p>機械らしさを魅せたいときは、あえて等速を選べばいい。時計の秒針、流れ続けるテロップ、一定の速さで回る地球儀。等速も、イージングの選び方の一つである。</p>

  <h2>加速と減速の呼び方</h2>
  <p>ゆっくり加速して動き出すことと、ゆっくり減速して止まることには、イーズイン、イーズアウトという呼び名がある。ただし、どちらをインと呼ぶかは、ソフトや本によって逆になっていることがある。ある所では「イーズイン」が動き出しのことで、別の所では止まり際のことを指す。</p>
  <p>このサイトでは、混乱を避けるために、なるべく「加速」「減速」と書く。人と話すときや、ソフトの設定を見るときは、どちらの意味で使われているかを、実際の動きで確かめるのが確実だ。</p>

  <h2>グラフで速さを読む</h2>

  <h2>長さと配分は、別のつまみ</h2>
  <p>動きの印象を決めるつまみは2つある。1つは、動きに何コマかけるかという長さ。もう1つは、その時間の中で速さをどう配分するかというイージングだ。</p>
  <p>同じイージングでも、12コマで動けばきびきびと、48コマで動けばゆったりと見える。逆に、同じ24コマでも、イージングを変えれば重さが変わる。動きがしっくりこないときは、どちらのつまみがずれているのかを分けて考えると、直しやすい。長すぎるのにイージングだけをいじっても、もたつきは消えにくい。</p>

  <h2>実写のイージング</h2>
  <p>イージングは、モーショングラフィックスやアニメだけの話ではない。実写でカメラを動かすときも、動き出しと止まり際の速さが、映像の印象を決める。三脚の上でパンするとき、いきなり振り始めていきなり止めると、画面がガクッと揺れる。ゆっくり振り始め、ゆっくり止めると、滑らかに見える。カメラの動きについては<a href="#motion-3">3.3</a>で扱う。</p>
  <p>編集で再生の速さを変えることもできる。1つのカットの中で、速い再生からスローへ、スローから速い再生へと速さを変える手法を、スピードランプと呼ぶ。Vlogやスポーツの映像で、跳んだ瞬間だけゆっくりにして、前後を速く見せるような使い方がある。これも、時間の中で速さをどう配分するかという、イージングの考え方そのものだ。</p>
  <figure class="ref">

  <h2>設定に頼りきると、どれも同じになる</h2>
  <p>ソフトには、ボタン1つで加速と減速を付ける機能や、名前の付いたイージングの一覧が用意されていることが多い。手早く動きを付けるには便利だが、全部の動きに同じものをかけると、どの要素も同じ重さ、同じ性格に見えてしまう。</p>
  <p>用意された設定は出発点として使い、要素ごとに「これはどんな重さの物か」を考えて、グラフで山の位置と形を変えていく。名前の付いたイージングが、どんな計算で、どこから広まったかは、「<a href="#motion-4">歴史：動きの原則</a>」で触れる。</p>

  <h2>固定で見せる強さ</h2>
  <p>カメラを動かさない固定のショットは、画面の中の動きをそのまま見せる。被写体の小さな表情や仕草が際立ち、見る人は画面の中を落ち着いて見回せる。<a href="#motion-1">3.1</a>で、大事な動きの前後に止まった時間を置くと書いた。カメラにとっての止まった時間が、固定のショットだ。</p>
  <p>カメラが動かないことは、何もしていないことと同じではない。動かないこと自体が、「この画面をじっと見てほしい」という合図になる。カメラを動かすかどうか迷ったら、まず固定で撮れないかを考えると、動かす理由がはっきりする。</p>

  <h2>カメラの動きの種類</h2>
  <p>カメラの動きは、大きく2つに分けられる。カメラの位置はそのままで向きだけを変える動きと、カメラごと場所を移す動きだ。</p>
  <ul>
    <li>パン：カメラの位置はそのままで、左右に首を振る。</li>
    <li>チルト：カメラの位置はそのままで、上下に首を振る。</li>
    <li>ドリー：カメラごと、被写体に向かって前後に動く（寄るのをドリーイン、離れるのをドリーアウトと呼ぶ）。</li>
    <li>トラック：カメラごと、横に動く。横移動とも言う。呼び方は現場によって違い、前後の動きをトラックと呼ぶこともある。</li>
    <li>クレーン（ペデスタル）：カメラごと、上下に動く。</li>
    <li>ズーム：カメラは動かさず、レンズで写る範囲を狭めたり広げたりする。</li>
  </ul>

  <h2>ズームとドリーは、見え方が違う</h2>
  <p>ズームもドリーも、被写体を大きく写すという点では同じだ。違うのは、背景の写り方である。ドリーで近づくと、手前の被写体は大きくなるが、遠くの背景はあまり大きくならない。被写体と背景の距離の関係が変わり、空間の中を進んでいく感覚が出る。ズームで寄ると、被写体も背景も同じ割合で大きくなる。写真の一部を切り抜いて拡大したのと同じで、空間の中を進む感覚は出ない。</p>

  <h2>カメラが動く理由</h2>
  <p>カメラが動くとき、見る人の視点も一緒に動く。そのため、カメラの動きには、見る人が納得できる理由があるといい。このサイトでは、カメラが動く理由を主に3つに分けて考える。</p>
  <ol>
    <li>追う：動く被写体を、画面の中にとどめ続ける。走る人の横を一緒に走るトラックや、飛ぶ鳥を追うパン。</li>
    <li>見せる：画面の外にあったものを、順番に見せる。部屋を見渡すパンで、最後に人物が現れる。上から下へのチルトで、建物の高さを伝える。</li>
    <li>近づく、離れる：見る人と被写体の距離を変える。ゆっくりドリーインすると、人物の気持ちに入り込んでいく感覚が出る。ドリーアウトで離れると、人物が周りの中で小さく、孤独に見える。</li>
  </ol>
  <p>理由のないまま動かすと、見る人は、何を見ればいいのか、どこへ連れて行かれるのかが分からなくなる。動き出す前に、動いた先に何を見せるのかを決めておくと、動きが迷わない。</p>

  <h2>揺れも設計できる</h2>
  <p>カメラを手で持って撮ると、どうしても画面が揺れる。揺れは失敗のように思えるが、揺れにも伝わるものがある。手持ちの揺れは、その場に撮っている人がいる感覚、つまり臨場感や生々しさ、慌ただしさを渡す。三脚や、揺れを打ち消す台（ジンバル）を使った揺れのない映像は、落ち着きや、整った印象を渡す。</p>
  <p>Vlogなら、出来事の真ん中にいる場面は手持ちで、街の様子を見せる場面はジンバルや三脚で、というように、場面ごとに揺れの量を選べる。揺らすか止めるかも、何を魅せたいかから決めることの一つだ。</p>

  <h2>カメラの動きにもイージングがある</h2>
  <p><a href="#motion-2">3.2</a>で扱ったイージングは、カメラの動きにもそのまま当てはまる。パンでもドリーでも、ゆっくり動き出してゆっくり止まると滑らかに見え、いきなり動き出していきなり止まると、画面がガクッと揺れる。速く振って急に止めるパンは、勢いや驚きを出したいときに、あえて使うこともある。</p>
  <p>カメラが動く長さも、3.2の「長さと配分は別のつまみ」と同じように考えられる。ゆっくり長く動くと、見る人は動きの途中の景色も味わう。短く速く動くと、動いた先の画が強く印象に残る。</p>

  <h2>仮想のカメラは自由すぎる</h2>
  <p>3DCGやモーショングラフィックスのカメラは、空中のどこにでも置け、どんな速さでも、どんな軌道でも動かせる。自由な分、何も考えずに動かすと、現実のカメラでは起こりえない動きになる。重さのないカメラが、一定の速さでするすると滑り、ぴたりと止まる。見る人は、どこか浮いた、作り物の映像として受け取りやすい。</p>
  <p>現実のカメラには、重さがあり、人が持ったり台に載せたりして動かしている。そのため、動き出しが少し遅れ、止まるときも少し行き過ぎ、手持ちなら細かく揺れる。仮想のカメラにも、こうした制約をあえて足すと、そこにカメラがあるという実在感が出る。逆に、現実ではできない動きをはっきり魅せたいときは、制約を外せばいい。3DCGでのカメラの決め方は、応用編Gの「<a href="#cg-6">ライティングとカメラ</a>」で扱う。</p>
  <p>なお、カメラの向きを変えながらカットをつなぐときに、見る人が向きを見失わないようにする考え方（180度ルールなど）は、<a href="#intro-3">0.3</a>で紹介し、<a href="#edit-1">編集編</a>で扱う。</p>

  <h2>動きを分解して見る（1878年）</h2>
  <p>1878年、エドワード・マイブリッジは、走る馬を何台ものカメラで連続して撮り、脚の動きを1枚ずつの写真に分けて見せた。<a href="#intro-1">0.1</a>の最初の動画で見た、あの馬だ。人の目では速すぎて見えなかった動きが、コマに分けて並べられた。</p>
  <p>マイブリッジはその後も、人や動物のさまざまな動きを連続写真に撮った。動きを分解して観察するという姿勢は、後のアニメーターたちにも引き継がれていく。</p>

  <h2>絵を動かす工夫が始まる（1914年）</h2>
  <p>1914年2月8日、漫画家ウィンザー・マッケイの『恐竜ガーティ』が公開された。恐竜のガーティが、マッケイの指示に合わせて踊ったり、水を飲んだりする短編アニメだ。</p>
  <p>この作品では、先に動きの要になる絵を描いてから間の絵を埋める描き方、紙の位置を合わせる目印、同じ動きを繰り返し使うループなど、後のアニメ制作で当たり前になる技法が早い時期に使われた（英語版ウィキペディア「Gertie the Dinosaur」による）。要の絵を先に決めて間を埋める考え方は、今のソフトで要の時点の値を置き、間をソフトに計算させるキーフレームの考え方と同じだ。</p>

  <h2>現場で動きを学ぶ（1930年代）</h2>
  <p>1928年の『蒸気船ウィリー』で音と動きを同期させたディズニーは（<a href="#sound-5">音編</a>で扱う）、1930年代に、短編アニメを大量に作りながら、絵描きたちに動きの描き方を教える仕組みを作った。1932年11月15日、画家のドン・グラハムが、ディズニーのスタジオで夜のデッサン講座を始めた。グラハムは1940年まで、スタジオの社内講座を率いた（D23「This Day」、英語版ウィキペディア「Donald W. Graham」による）。</p>
  <p>講座の中身は、人や動物の実際の動きを観察し、それを絵でどう伝えるかを学ぶものだったとされる（要確認）。現場で使われていた動きのコツが、少しずつ共通の言葉になっていった時期だ。</p>

  <h2>省くことも設計になる（1963年）</h2>
  <p>1963年1月1日、手塚治虫の『鉄腕アトム』が、フジテレビ系で放送を始めた。テレビで毎週放送するアニメを作るために、コマ数を減らし、同じ絵を使い回し、口など一部分だけを動かす、徹底して省力化したリミテッドアニメーションが採られた（nippon.com、中野晴行の記事による）。歩く、飛ぶといった動画をストックしておき、何度も使い回す方法は「バンクシステム」と呼ばれた（PRESIDENT Online、津堅信之の記事による）。</p>
  <p>動かす枚数を減らすと、どこを動かし、どこを止めるかを選ぶことになる。止め絵や少ない枚数でも気持ちよく見せる工夫が、その後の日本のテレビアニメにどう受け継がれたかは、このサイトではまだ調べきれていない（要確認）。<a href="#prep-1">1.1</a>で扱ったコマ打ちの話ともつながる。</p>

  <h2>12の原則として本になる（1981年）</h2>
  <p>1981年、ディズニーのアニメーターだったフランク・トーマスとオーリー・ジョンストンが、『Disney Animation: The Illusion of Life』を出版した。2人が現場で積み重ねてきた動きのコツが、12の基本原則としてまとめられた（英語版ウィキペディア「The Illusion of Life」による）。日本では「アニメーションの12原則」として知られている。</p>
  <p>12の原則は次の通りだ。訳語は本や解説によって違う。</p>
  <ol>
    <li>スクワッシュ＆ストレッチ：物が潰れたり伸びたりする変形で、柔らかさや勢いを出す。</li>
    <li>予備動作：動きの前の溜め。次の動きを見る人に知らせる（3.1）。</li>
    <li>ステージング：見せたいことが一目で伝わるように、ポーズや配置を整える。</li>
    <li>ストレートアヘッドとポーズ・トゥ・ポーズ：最初から順に描いていくか、要の絵を先に決めて間を埋めるか、の2つの描き方。</li>
    <li>フォロースルーとオーバーラッピング：止まった後の余韻と、部分ごとに遅れて動くこと（3.1）。</li>
    <li>スローイン・スローアウト：動き出しと止まり際の加速と減速（3.2のイージング）。</li>
    <li>弧（アーク）：生き物の動きは弧を描く（3.1）。</li>
    <li>副次的な動き：主な動きを支える、別の小さな動き。歩きながら腕を振る、など。</li>
    <li>タイミング：何コマかけて動くかで、重さや性格を表す（3.2）。</li>
    <li>誇張：現実の動きを少し大げさにして、はっきり伝える。</li>
    <li>しっかりした絵：形、重さ、立体感のある絵を描くこと。</li>
    <li>魅力：見る人が見ていたくなるキャラクターや動きにすること。</li>
  </ol>
  <p>どの原則も、現実の物理を観察し、それを少し誇張して、見る人に動きをはっきり伝えるための工夫だ。それぞれを文字、図形、3DCGの動きでどう使うかは、応用編の<a href="#moji-5">文字PV「文字を動かす」</a>、<a href="#mg-4">モーショングラフィックス「動きを付ける」</a>、<a href="#cg-5">3DCG「アニメーション」</a>で扱う。</p>

  </figure>

  <h2>コンピュータの中へ（1987年）</h2>
  <p>1987年、ピクサーのジョン・ラセターは、SIGGRAPH（コンピュータグラフィックスの国際会議）で、論文「Principles of Traditional Animation Applied to 3D Computer Animation」を発表した。手描きアニメの原則を、3DCGのアニメーションに当てはめて説明したものだ。参考文献には、前の年にピクサーが作った短編『ルクソーJr.』（1986年）が挙げられている（SIGGRAPHの歴史アーカイブによる）。</p>
  <p>コンピュータは、要の絵の間を自動で埋めてくれる。しかし、そのまま埋めさせると、動きは等速で、まっすぐになりやすい。手描きの時代の原則は、コンピュータに任せた動きに、重さや気持ちよさを取り戻すための言葉として使われるようになった。</p>

  </figure>

  <h2>イージングに名前が付く（2000年代）</h2>
  <p>今、多くのソフトやWebの世界で使われている「easeInQuad」のような、名前の付いたイージングの多くは、ロバート・ペナーがまとめたイージングの計算式がもとになっている。ペナーは、当時Webで動きを作るのに広く使われていたFlashのプログラム向けに、加速と減速、ばねのような弾み、跳ね返りなどを式にして公開した。2002年の著書『Robert Penner's Programming Macromedia Flash MX』の第7章では、「イージングとは加速、つまり速さの変化である」と書いている（同書第7章、josh.earth「Improved Easing Functions」による）。</p>
  <p>手描きのアニメーターが紙の上で調整していた速さの変化が、名前の付いた式になり、誰でもボタン1つで使えるようになった。<a href="#motion-2">3.2</a>の最後に書いた「設定に頼りきると、どれも同じになる」は、この便利さの裏返しでもある。</p>

  <h2>原則は、決まりではなく言葉</h2>
  <p>この章で見てきた原則は、どれも、気持ちいい動きを見て、その理由を言葉にしたものだ。<a href="#intro-3">0.3</a>で書いた通り、このサイトでは、こうした原則を守るべき決まりとしては扱わない。気持ちいい動きを見たときに理由を読み取り、自分の動きに足りないものを探すための物差しとして使う。</p>
  <p>原則を全部守った動きが、必ず良い動きになるわけでもない。何を魅せたいかによっては、あえて弧を描かず、あえて等速で動かすほうがいい場面もある。原則を知っていれば、それを外したときにも、なぜ外したのかを説明できる。</p>

  <h2>音が変える3つのこと</h2>
  <p>隕石の例で起きていることを分けると、音は少なくとも3つのことを変えている。</p>
  <p>1つ目は雰囲気だ。同じ衝突の画が、怖いBGMでは絶望に、ドリフのBGMでは笑いになる。ドリフのBGMを知らなくても笑えるのは、地球が滅ぶほどの深刻な画に、のんきで軽い曲が付いているからだ。画と音の気分が食い違うと、そのちぐはぐさがシュールな可笑しさになる（食い違う音の使い方は、この章の後半で扱う）。2つ目は、受け取り方の合図だ。ドリフのBGMを知っている人にとっては、あの音は「ここは笑っていい所だ」という合図にもなる。ホラーの不穏な低音や、感動場面の弦楽器も、見る人に画の受け取り方を教えている。3つ目は、時間の感じ方だ。衝突の瞬間にBGMが鳴り始めるからこそ、反転が一気に起きる。音がどこで鳴るかで、画の中のどの瞬間が強調されるかが変わる。音と画のタイミングは、<a href="#sound-2">4.2</a>で扱う。</p>

  <h2>映像の音は4種類</h2>

  <h2>寄り添う音と、知らん顔をする音</h2>
  <p>悲しい場面に悲しい曲を付けるように、画と同じ気分の音を付けるのは、一番分かりやすい付け方だ。その逆に、画の気分にまったく構わない音を付ける方法もある。</p>
  <p>映画の音を研究したミシェル・シオンは、場面の気分に寄り添う音楽と、場面に無関心なまま流れ続ける音楽を分けて考えた（著書『オーディオ・ヴィジョン』、1990年。英訳1994年）。たとえば、人物が絶望している場面で、遠くのメリーゴーラウンドの陽気な音楽が何事もなかったように鳴り続ける。シオンは、こうした音が場面の感情をかえって強めると書いている。音楽に限らず、ヒッチコックの『サイコ』（1960年）で、殺人の後もシャワーの音が流れ続ける場面も例に挙げている。</p>
  <p>楽しい曲を悲惨な場面に付けると、ちぐはぐさが笑いになることもあれば、残酷さが際立つこともある。冒頭の隕石にドリフのBGMを付けた動画は、笑いになった例だ。どちらになるかは、前後の流れと、何を魅せたいかで決まる。</p>

  <h2>音は画に意味を足す</h2>
  <p>シオンは同じ本で、音が画に与える働きを「付加価値」と名付けた。音が画に表現や情報を足しているのに、見ている人には、その意味が画そのものから自然に出てきたように感じられる、という考え方だ。殴る場面に鈍い音を付けると、画は同じでも、殴られた側の痛みが重く見える。見ている人は音のおかげだと気付かず、「痛そうな画だ」と感じる。</p>
  <p>シオンはもう1つ、同時に起きた音と画は、本当は関係がなくても、一つの出来事として結び付いて感じられる、という性質にも名前を付けている（シンクレーシス）。まったく別の物を叩いて録った音でも、画の中の動きと同時に鳴れば、その動きの音に聞こえる。効果音が成り立つのも、音ハメで画と音が一体に見えるのも、この性質の上に乗っている。</p>
  <p>このサイトの中心の定義は「良い映像は、どの要素にも『何を魅せたいか』の意図が設計されている。」だ。音は、画が同じままでも意味を変えられる要素なので、意図を設計する手段として大きい。</p>

  <p>自分で撮った10秒ほどの映像を1つ選び、明るい曲、暗い曲、緊張感のある曲の3つを、それぞれ付けて見比べてみる。歩いているだけの映像でも、楽しい散歩、帰り道の寂しさ、誰かに追われている場面、と見え方が変わるはずだ。曲によって、映像のどの瞬間が目立つかも変わる。</p>

  <h2>拍をフレームに直す</h2>
  <p>音楽には、一定の間隔で刻まれる拍がある。1分間の拍の数をBPMと呼ぶ。1拍の長さは、60をBPMで割った秒数になる。BPM120なら0.5秒だ。</p>
  <p>映像は1秒をコマに分けているので、拍の長さをフレーム数に直せる。1拍の秒数にfpsを掛ければいい。BPM120、30fpsなら、0.5×30で、1拍は15フレームになる。拍がフレームの境目にぴったり乗るので、合わせやすい組み合わせだ。</p>

  <p>BPMとfpsの組み合わせによっては、拍がフレームの境目にぴったり来ない。そのときは、拍に一番近いフレームを選ぶ。計算だけで決めず、前後のフレームで見比べて、合って見える方を選ぶといい。編集ソフトの多くは、音の波形を表示でき、拍の位置に印（マーカー）を打てる。耳で拍を聞きながら印を打っておくと、あとの作業が速くなる。</p>

  <h2>合わせる場所を選ぶ</h2>
  <p>全ての拍に合わせると、単調で疲れる映像になりやすい。曲の中で強く聞こえる所を選んで、大きな変化を置く。合わせる場所の候補は、たとえば次のような所だ。</p>
  <ul>
    <li>ドラムのキック（低い「ドン」）とスネア（高い「パン」）</li>
    <li>歌の歌い出しや、言葉の頭</li>
    <li>小節の頭（4拍ごとの1拍目など）</li>
    <li>曲の展開が変わる所（サビに入る所、音が急に減る所）</li>
  </ul>
  <p>曲の展開に合わせて、カットの細かさを変える方法もある。静かな所では1つのカットを長く見せ、盛り上がる所ではカットを細かくする。曲の構成が、そのまま映像の構成になる。</p>

  <h2>少し前に動き出す</h2>
  <p>拍の位置に動きの頭を置くより、拍の少し前に動き出して、拍と同時に動きが決まるようにすると、合っている感じが強く出ることがある。ボールが床に当たる瞬間を拍に合わせるなら、ボールは拍の前から落ち始めている必要がある。<a href="#motion-1">3.1</a>の予備動作と同じ考え方だ。</p>
  <p>カットの切り替えも同じで、拍と同じフレームで切るか、1フレーム前で切るかで、印象が少し変わる。どちらが正しいということはないので、両方を試して、自分の映像で合って見える方を選ぶ。</p>

  <h2>効果音と動きを合わせる</h2>
  <p>音楽の拍だけでなく、効果音と画の動きを合わせることも、音のタイミングの仕事だ。ドアが閉まる画の、閉まりきったフレームに「バタン」を置く。画と音が同時に起きると、本当は別々に録った音でも、一つの出来事として感じられる（<a href="#sound-1">4.1</a>のシンクレーシス）。</p>
  <p>では、音と画はどれくらいずれると気付かれるのか。放送の規格を決める国際電気通信連合の勧告（ITU-R BT.1359、1998年）は、音が画より45ミリ秒早い所から、125ミリ秒遅い所までを、ずれに気付きにくい範囲としている（英語版ウィキペディア「Audio-to-video synchronization」による）。30fpsに直すと、音が約1.4フレーム早い所から、約3.8フレーム遅い所までだ。</p>
  <figure class="fig" aria-label="横軸に音のずれをとり、音が早い側に45ミリ秒、遅い側に125ミリ秒までの範囲を帯で示した図。遅い側の方が帯が長い">
    <svg viewBox="0 0 720 190" role="img">
      <line x1="40" y1="90" x2="680" y2="90" stroke="#000" stroke-width="2"/>
      <rect x="295" y="70" width="295" height="40" fill="#BF00BF" opacity=".35"/>
      <line x1="401" y1="55" x2="401" y2="125" stroke="#000" stroke-width="2"/>
      <g stroke="#BF00BF" stroke-width="3"><line x1="295" y1="62" x2="295" y2="118"/><line x1="590" y1="62" x2="590" y2="118"/></g>
      <g font-size="15" text-anchor="middle"><text x="401" y="45">ぴったり</text><text x="295" y="145">45ミリ秒早い</text><text x="590" y="145">125ミリ秒遅い</text></g>
      <g font-size="14"><text x="40" y="70">← 音が早い</text><text x="600" y="70">音が遅い →</text></g>
      <g font-size="13" style="fill:#5C5C5C"><text x="40" y="180">帯の中は、ずれに気付きにくい範囲（ITU-R BT.1359）</text></g>
    </svg>
    <figcaption><span class="no">図3</span>音が早い側の方が、ずれに気付かれやすい。音を少し遅らせる分には、早める場合より気付かれにくい。</figcaption>
  </figure>
  <p>この数字は、放送で、音と画を別々に送るときの許容範囲の話だ。映画の口の動きとセリフは、もっと厳しく、前後22ミリ秒以内にそろえることが求められる（同）。編集で音ハメをするときは、数字より自分の目と耳を信じていいが、音が画より先に鳴るずれには特に気を付ける、と覚えておくと役に立つ。</p>

  <h2>外す、ためる、裏拍</h2>
  <p>合わせることを覚えたら、外すことも設計の対象になる。</p>
  <p>ためるのは、期待させてから外す方法だ。サビの頭で大きな変化が来ると見る人が予想している所で、あえて何も変えず、次の小節で変える。裏拍に合わせるのは、「ドン」と「ドン」の間の「タン」の位置で動かす方法で、跳ねるような軽さが出る。音がない所で動かすのは、音のある所との差で、動きを目立たせる方法だ。</p>
  <p>どれも、合わせる所がしっかりしているから外しが効果を持つ。外す場所が多すぎると、ただずれているように見える。</p>

  <h2>BGMを尺に合わせる</h2>
  <p>BGMの長さが映像と合わないことは多い。曲を途中で切るときは、小節の頭など、拍の切れ目で切ると、つなぎ目が目立ちにくい。同じ曲の別の部分をつなぐときも、拍の位置をそろえてつなぐ。</p>
  <p>曲の終わりを映像の終わりに合わせたいときは、曲の終わりを先にタイムラインの最後に置き、そこから前に向かって曲をつないでいく方法がある。曲を途中で消すなら、音量をだんだん下げるフェードアウトを使う。その場合も、フレーズの切れ目に合わせて下げ始めると自然に聞こえる。</p>

  <h2>どこまで合わせるかはジャンルで変わる</h2>
  <p>音ハメの比重は、ジャンルによって大きく違う。音MADや文字PVでは、音ハメが作品の中心になる。Vlogや切り抜きでは、BGMの区切りに場面転換を合わせる程度で十分なこともある。何を魅せたいかによって、どこまで合わせるかを決める。</p>

  <p>どれくらい下げるかは、BGMの曲調と声の大きさによる。下げすぎると、BGMが急に消えたように感じられる。声がはっきり聞こえる所まで下げ、それ以上は下げない、という決め方が分かりやすい。</p>

  <h2>帯域を空ける</h2>
  <p>声が聞き取りにくい原因は、音量が小さいことだけではない。<a href="#prep-4">1.4</a>で見たように、人の声の主な成分は数百Hzから数千Hzのあたりに集まっている。BGMが同じ帯域で大きく鳴っていると、声とぶつかって聞き取りにくくなる。</p>
  <p>イコライザーで、BGMのうち声とぶつかる帯域だけを少し下げると、BGM全体の音量をあまり下げずに、声を前に出せる。声の帯域を空けておく、という考え方だ。</p>

  </figure>

  <h2>録る段階で決まること</h2>
  <p>声の聞き取りやすさの多くは、録る段階で決まる。あとから直せることは、思ったより少ない。</p>
  <p>1つ目はマイクとの距離だ。マイクが口から遠いと、声が小さくなるだけでなく、部屋の響きや周りの音が相対的に大きく入る。カメラに付いたマイクで離れた人の声を録ると、こもったように聞こえるのはこのためだ。2つ目は部屋の響きで、何もない部屋や風呂場では声が反射して重なる。カーテンや布団のある部屋で録ると、響きが減る。3つ目はノイズで、エアコン、冷蔵庫、外の車の音は、録っている最中は慣れて気付きにくい。録る前に一度、耳を澄ましてみるといい。屋外では、風がマイクに当たる音にも気を付ける。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/2gYIkCzEMzE?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="YouTubeで聴きやすい声の録り方と処理" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>YouTubeで聴きやすい声の録り方と処理（宮崎雄也と音楽の話）。録る段階の工夫と、録った後の処理の考え方。<a class="yt" href="https://youtu.be/2gYIkCzEMzE" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>左右の置き場所</h2>
  <p>左右2つのスピーカーで鳴らすステレオでは、音を左右のどこに置くかも決められる。声は真ん中に置くのが基本になる。BGMは左右に広く、効果音は画面の中で音が出ている側に寄せる、という置き方がある。画面の右から車が来るなら、車の音を右から鳴らし始める。</p>
  <p>ただし、見る人がどんな環境で聞くかは分からない。イヤホン、スマホのスピーカー、テレビ、パソコンでは、聞こえ方がかなり違う。仕上げの前に、少なくともイヤホンとスマホのスピーカーの両方で聞いて、声が聞き取れるかを確かめておくと安心だ。</p>

  <h2>投稿先の音量の基準：ラウドネス</h2>
  <p>動画を続けて見ていて、ある動画だけ急に音が大きい、ということがある。それを防ぐために、放送や配信では、耳で感じる音の大きさをそろえる仕組みが使われている。耳で感じる音の大きさを測った値をラウドネスと呼ぶ。</p>
  <p><a href="#prep-4">1.4</a>で見た0dBの天井は、波の一番高い所（ピーク）の話だった。ピークが同じでも、大きな音がずっと続く曲と、ときどき大きな音が鳴るだけの曲では、耳で感じる大きさが違う。ラウドネスは、その感じ方に近づけて、一定の時間の平均の大きさを測る。単位はLUFS（またはLKFS。同じもの）で、測り方は国際電気通信連合の勧告ITU-R BS.1770で決められている。</p>
  <figure class="fig" aria-label="縦に音の大きさの目盛りを取り、テレビ放送の基準と配信サイトの基準の高さを示した図">
    <svg viewBox="0 0 720 260" role="img">
      <line x1="120" y1="30" x2="120" y2="230" stroke="#000" stroke-width="2"/>
      <g font-size="14" text-anchor="end"><text x="110" y="35">0</text><text x="110" y="95">-10</text><text x="110" y="155">-20</text><text x="110" y="215">-30</text></g>
      <g stroke="#D9D9D9"><line x1="120" y1="30" x2="690" y2="30"/><line x1="120" y1="90" x2="690" y2="90"/><line x1="120" y1="150" x2="690" y2="150"/><line x1="120" y1="210" x2="690" y2="210"/></g>

      <g font-size="15"><text x="570" y="119">-14前後</text><text x="570" y="173">-23</text></g>
      <g font-size="14"><text x="140" y="108">配信サイトの多く（音量を自動でそろえる目安）</text><text x="140" y="162">ヨーロッパのテレビ放送（EBU R 128）</text></g>
      <g font-size="13" style="fill:#5C5C5C"><text x="0" y="252">単位はLUFS。数字が0に近いほど大きい</text></g>
    </svg>
    <figcaption><span class="no">図4</span>テレビは放送の基準として、配信サイトは再生時に音量をそろえる目安として、ラウドネスの値を使っている。</figcaption>
  </figure>
  <p>テレビ放送では、ラウドネスの値が基準として決められている。ヨーロッパ放送連合の基準（EBU R 128、2010年）は-23 LUFSで、2012年ごろから各国の放送局で使われるようになった（英語版ウィキペディア「EBU R 128」による）。日本のテレビ放送にも同じ考え方の基準があり、値は-24 LKFSとされる（要確認）。テレビ局に納める映像を作る仕事では、この値に合わせることが求められる。</p>
  <p>配信サイトの多くは、大きすぎる動画の音量を、再生するときに自動で下げている。YouTubeの目安は-14 LUFS前後とされるが、これはYouTubeが公式に発表した値ではなく、外部の計測による（英語版ウィキペディア「EBU R 128」「Loudness war」による）。また、YouTubeは下げる方向にだけ調整すると報告されている。つまり、必要以上に大きく作っても下げられるだけで、小さすぎる音は大きくしてもらえない。</p>
  <p>部員の作品で気にするなら、編集ソフトや無料の測定ツールでラウドネスを測り、極端に小さすぎないか、ピークが0dBを超えていないかを確かめるところから始めればいい。</p>

  </figure>

  <h2>字幕で補う</h2>
  <p>音だけで全部を伝えようとしなくていい。音を消して見る人や、騒がしい場所で見る人もいる。声の内容をテロップや字幕で見せると、聞き取りにくい所を文字が補う。ゆっくり実況のように、声と文字を同時に出すのが前提のジャンルもある。文字の読みやすさは、<a href="#visual-4">2.4</a>で扱った。</p>
  <p>反対に、文字があるからと音の聞き取りやすさを後回しにすると、文字を読まない人には伝わらない。文字は補いとして置き、音は音で整えておく。</p>

  <h2>あえて減らす判断</h2>
  <p>音を足すより、減らす方が伝わることもある。効果音を全部の動きに付けると、どれが大事な動きなのか分からなくなる。BGMを止めて声だけにすると、その言葉が際立つ。音を減らすことも、優先順位を決める手段の一つだ。何も鳴らさない時間については、次の章で扱う。</p>
</template>

<template id="body-sound-4">
  <h2>環境音が場所を作る</h2>
  <p>風の音、遠くの車の音、店のざわめき。画面に映っていなくても、環境音は「ここがどんな場所か」を伝える。画が同じでも、蝉の声が入れば夏の昼に、虫の声が入れば秋の夜に感じられる。</p>
  <p>環境音がまったくないと、映像はどこか作り物のように感じられることがある。カットの間で環境音が急に変わると、つなぎ目が耳で分かってしまう。撮影の現場では、誰も話さず動かない状態で、その場所の音だけを録っておくことがある。これをルームトーンと呼ぶ（英語版ウィキペディア「Presence (sound recording)」による）。録っておくと、編集で声を切った所の隙間を埋めたり、カットの間の音のつながりを整えたりできる。長さに決まりはないが、編集で使い回せるだけの長さ、たとえば30秒ほど録っておくと困りにくい。</p>

  <h2>効果音で質感を作る</h2>
  <p>映像の効果音は、現実の音をそのまま録ったものとは限らない。現実のパンチの音は、映画の殴り合いで聞こえる音ほど大きくも重くもない。効果音は、見る人がその画から受け取ってほしい重さや痛みや速さに合わせて、現実より大げさに作られることが多い。</p>
  <p>映画やアニメでは、足音、衣ずれ、物を置く音などを、画に合わせて後から演じて録る。この作業や、それを担う人の名前から、フォーリーと呼ばれる。名前の元になったジャック・フォーリーは、ユニバーサルの撮影所で、トーキーへの切り替えのころから音の仕事を始め、1967年に亡くなるまで映画の音を作り続けた（英語版ウィキペディア「Foley (filmmaking)」による）。</p>

  <p>自分の作品で効果音を選ぶときも、現実にどんな音がするかより、その画で何を感じてほしいかで選ぶ。かわいい動きには軽く高い音、重い物には低く長い音。<a href="#prep-4">1.4</a>で見た音の高さや音色が、質感の手がかりになる。Vlogでも、場面転換や文字の出入りに小さな効果音を足すと、画のリズムが分かりやすくなる。足しすぎると騒がしくなるので、<a href="#sound-3">4.3</a>の優先順位も合わせて考える。</p>

  <h2>BGMは「何を魅せたいか」で選ぶ</h2>
  <p>BGMを選ぶときは、好きな曲から選ぶ前に、この場面で何を魅せたいかを1つ決めておくと迷いにくい。景色の広さを魅せたいのか、人物の気持ちを魅せたいのか、テンポの良さを魅せたいのか。決まると、曲の速さ、楽器、明るさの候補が絞れる。</p>
  <p>声が入る場面では、歌のある曲は声とぶつかりやすい。言葉と言葉が重なると、どちらも聞き取りにくくなるからだ。歌のない曲を選ぶか、声の間だけ歌のない部分を使う。曲の盛り上がりの位置も見ておく。盛り上がりが、映像の一番見せたい所と重なるように配置すると、音と画の山がそろう。</p>
  <p>BGMには、使ってよい条件が曲ごとに決められている。投稿先や使い方によって条件が変わることもあるので、使う前に確かめる。素材と権利の詳しい話は、応用編の<a href="#mad-6">音MAD</a>と<a href="#cut-6">切り抜き</a>の章で扱う。</p>

  <h2>沈黙の使い方</h2>
  <p>音が途切れた瞬間、見る人の注意は画面に向く。大きな出来事の直前に音を消すと、次に来るものへの緊張が高まる。感情的な場面でBGMを止めると、言葉や表情がそのまま届く。</p>

  <p>沈黙を使うには、その前に音があることが前提になる。ずっと静かな映像では、沈黙は目立たない。鳴っている時間と鳴っていない時間の差を設計することが、沈黙の使い方である。</p>
  <p>完全な無音にせず、BGMだけを止めて環境音を残す方法もある。完全な無音は、再生が止まったと思われることもあるので、長く続けるなら、かすかな環境音を残しておくと、場面が続いていることが伝わる。</p>

  <h2>音で場面をつなぐ、音を切って場面を切る</h2>
  <p>音は、画が切り替わっても続けられる。前の場面の音を次の場面まで続けたり、次の場面の音を少し早く鳴らし始めたりすると、2つの場面が一続きに感じられる。音で場面の間に橋を架ける、という意味で、サウンドブリッジと呼ばれる。画と音の切り替えをずらすつなぎ方（JカットとLカット）は、<a href="#edit-1">編集編</a>で扱う。</p>
  <p>反対に、騒がしい場面から、画の切り替えと同時に音をすべて切ると、場面がはっきり断ち切られる。夢から覚める、場所が一瞬で変わる、といった場面で、断ち切られた感じを魅せたいときに使える。</p>

  <h2>ジャンルごとの主役の音</h2>
  <p>ジャンルによって、音の主役は違う。Vlogでは現場の音と空気、ゆっくり実況では声の聞き取りやすさ、音MADでは素材の音そのもの、3DCGやモーショングラフィックスでは効果音とBGMが画の動きを支えることが多い。自分のジャンルで何が主役の音かを決めておくと、足す音と削る音の判断がしやすい。</p>

  <p>映画に音が付いたのは、映画が生まれてから約30年後のことだった。音が付いたことで、画と音をどう合わせるか、あえて合わせないか、という問いも生まれた。この章では、その流れを年表でたどる。</p>

  <h2>サイレントでも、上映は静かではなかった</h2>
  <p>初期の映画には、フィルムに音が入っていなかった。それでも上映の場は静かではなく、劇場ではピアノやオーケストラの生演奏が付いていた。</p>
  <p>日本では、活動弁士と呼ばれる語り手が、スクリーンの横で字幕を読み上げ、登場人物の声を演じ分け、自分の解説も加えた。1927年には、日本に6818人の弁士がいた（英語版ウィキペディア「Benshi」による）。映画の音は、上映するその場で、人が付けるものだった。</p>

  <h2>映画に音が付く（1926〜1931年）</h2>
  <p>1926年8月、アメリカのワーナー・ブラザースは、映画『ドン・ファン』を公開した。映像に合わせて、オーケストラの音楽と効果音をレコード盤から再生する方式で、セリフはなかった。翌1927年10月の『ジャズ・シンガー』は、ほとんどはサイレントのまま、歌と一部のセリフを映像と同期させた作品で、トーキーの時代を開いた作品として知られている（英語版ウィキペディア「Vitaphone」、ブリタニカ「Introduction of sound」による）。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/22NQuPrwbHA?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="The Jazz Singer - Ain&#x27;t Heard Nothin&#x27; Yet Scene" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>The Jazz Singer, "Ain't Heard Nothin' Yet" Scene（Warner Bros. Entertainment）。『ジャズ・シンガー』で、歌の後にセリフが聞こえる場面。<a class="yt" href="https://youtu.be/22NQuPrwbHA" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>
  <p>レコード盤の方式は、フィルムと盤を別々に扱うので、ずれや取り違えが起きやすかった。同じころ、音をフィルムの端に焼き付ける方式も使われ始め、1927年にはフォックスがこの方式でニュース映画を上映した。1931年までに、ワーナーもレコード盤をやめ、フィルムに音を焼き付ける方式に移った（ブリタニカ、同）。</p>

  <h2>音を画と逆に使え（1928年）</h2>
  <p>トーキーが広がり始めた1928年、ソ連の映画監督エイゼンシュテイン、プドフキン、アレクサンドロフらは、音についての宣言を出した。画と音をぴったり同期させた「しゃべる映画」ばかりになると、カットをつないで意味を作るモンタージュの文化が壊れる、という警告だった。代わりに彼らは、音を画から切り離した新しいモンタージュの要素として扱い、画に対して対位法的に、つまり画とは別の線として使うことを求めた。</p>
  <p>画の気分に構わずに鳴る音（<a href="#sound-1">4.1</a>）や、画と音をずらすつなぎ方は、この宣言が求めた方向の延長にある。モンタージュそのものは、<a href="#edit-2">編集編</a>で扱う。</p>

  <h2>アニメが音と同期する（1924〜1928年）</h2>
  <p>アニメと音の同期も、この時代に始まった。フライシャー兄弟は、1924年から1926年にかけて、フィルムに音を焼き付ける方式で、歌に合わせて歌詞の上をボールが跳ねる短編「Song Car-Tunes」を作った。ただ、音を最後まで同期させ続けることはできなかった。1928年8月には、ポール・テリーの音付きアニメ『ディナー・タイム』も公開されたが、観客の受けは良くなかった（英語版ウィキペディア「Steamboat Willie」「Dinner Time (film)」による）。</p>
  <p>1928年11月18日、ディズニーの『蒸気船ウィリー』がニューヨークで公開された。「最初の音付きアニメ」と広く誤解されてきたが、音と動きがぴったり合う楽しさを多くの人に印象付けた作品である。録音では、演奏者が拍を保つために、拍を刻む音（クリック・トラック）を使った。1928年9月の最初の録音は失敗し、2回目は、テンポを示す跳ねるボールの映像を演奏者に見せて成功した（英語版ウィキペディア「Steamboat Willie」による）。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/I5pG1wbRKOg?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="Steamboat Willie (1928 Film) - 4K Film Remaster" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画2</span>Steamboat Willie（1928年）の高画質版（Did You Catch This?）。口笛や、動物を楽器のように鳴らす場面で、音と動きが合わせてある。<a class="yt" href="https://youtu.be/I5pG1wbRKOg" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>
  <p>拍の位置を先に決めて、そこに動きを合わせるという考え方は、今の音ハメとほとんど変わらない。音楽に合わせてキャラクターの動きをぴったり同期させる手法は、のちにミッキーマウシングと呼ばれるようになった。</p>

  <h2>日本のトーキー（1931年）</h2>
  <p>日本では、トーキーへの切り替えが遅かった。弁士の人気と影響力が大きかったことと、劇場や製作会社にとって設備の費用が重かったことが理由として挙げられている。日本のサイレント映画は、1930年代半ばまで作られ続けた（英語版ウィキペディア「Benshi」による）。</p>
  <p>1931年8月、松竹の五所平之助監督の『マダムと女房』が公開された。日本で初めて、長編の全編に音を使った映画で、現存する最も古い日本のトーキーでもある（英語版ウィキペディア「The Neighbor's Wife and Mine」による）。隣の家から聞こえるジャズがうるさくて仕事が進まない劇作家の話で、音そのものが物語の中心にある。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/Hyv4ytQvv4o?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="トーキー第1号「マダムと女房」公開（昭和6年）" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画3</span>トーキー第1号「マダムと女房」公開（TBSスパークル映像ライブラリー）。公開当時の様子を伝える映像。<a class="yt" href="https://youtu.be/Hyv4ytQvv4o" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>音を設計する仕事へ（1979年）</h2>
  <p>トーキーになってから、映画の音は、撮影の現場で録る音と、後から作って足す音に分かれていった。<a href="#sound-4">4.4</a>で触れたフォーリーも、トーキーの初期に始まった仕事だ。</p>
  <p>1979年の『地獄の黙示録』で、ウォルター・マーチは「サウンドデザイナー」として初めてクレジットされた。この作品は、今5.1チャンネルと呼ばれる方式で公開された2本目の映画でもあり、スクリーンの裏の3つのスピーカー、低音用、客席の後ろの2つのスピーカーに音を割り振っていた（英語版ウィキペディア「Walter Murch」による）。マーチは、<a href="#intro-3">0.3</a>で紹介した編集の6つのルールを書いた人でもある。録った音を実際の部屋で鳴らし直して録り直し、その場所で鳴っているように聞こえる音を作る、といった工夫でも知られている。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/gfi8nhUv7KI?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="ウォルター・マーチ：サウンドデザイナーの役割" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画4</span>ウォルター・マーチ：サウンドデザイナーの役割（Web of Stories）。マーチ本人が、サウンドデザイナーという呼び名について話している。<a class="yt" href="https://youtu.be/gfi8nhUv7KI" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>波形を見て合わせられる今</h2>
  <p>『蒸気船ウィリー』の録音では、演奏者がクリック・トラックを聞き、跳ねるボールを見ながら、画に音を合わせた。今は、編集ソフトの画面に音の波形が表示され、誰でも1フレーム単位で、画と音の位置を見比べながら合わせられる。</p>
  <p>音MADのような、素材の音を1音ずつ切って並べるジャンルが生まれたのも（<a href="#intro-2b">0.2b</a>）、画と音を細かく見て合わせられる環境があったからだ。道具は変わったが、拍の位置を決め、そこに画を置くという考え方は、約100年前のアニメーターの工夫の延長線上にある。</p>
</template>

<template id="body-edit-1">
  <h2>カットとは何を切ることか</h2>
  <p>カットには2つの意味がある。1つは、カメラが回り始めてから止まるまでの一続きの映像のこと。もう1つは、その映像を編集で切る行為のことだ。編集でカットするとは、素材の中から見せる時間を選び、見せない時間を捨てることである。</p>
  <p>どこで切るかで、同じ素材から伝わることが変わる。表情が変わる直前で切るか、変わった後まで見せるかで、場面の意味は違ってくる。</p>

  <h2>つなぎの種類</h2>
  <p>カットとカットのつなぎ方にはいくつかの種類がある。そのまま切り替えるカット（ストレートカット）、片方が消えながらもう片方が現れるディゾルブ、黒や白を挟むフェード。似た形や動きでつなぐマッチカット、同じ構図のまま時間が飛ぶジャンプカット。0.4で触れたJカット・Lカットは、音を映像からずらしてつなぐ方法だ。</p>
  <p>どのつなぎにも、見る人への合図がある。ディゾルブは時間の経過や場面の区切りとして受け取られやすい。理由なく多用すると、その合図が効かなくなる。</p>

  <h2>継ぎ目を見せる、消す</h2>
  <p>0.3で紹介した連続性編集は、つなぎ目を見る人に気づかせない作り方だ。動きの途中で切り替える（アクションつなぎ）、視線の先にあるものを次に見せる、といった工夫で、カットが変わっても時間が続いているように感じさせる。</p>
  <p>反対に、ジャンプカットや派手なトランジションで、継ぎ目をはっきり見せる作り方もある。Vlogやネット動画では、継ぎ目を見せることでテンポや勢いを出すことが多い。見せるか消すかは、作品で何を魅せたいかで選ぶ。</p>
</template>

<template id="body-edit-2">
  <h2>並びが意味を作る仕組み</h2>
  <p>無表情の顔のカットの後にスープの皿を見せると空腹に、棺を見せると悲しみに見える。1920年代のソ連の映画作家クレショフの実験として伝えられている話で、クレショフ効果と呼ばれる（実験の細部は要確認）。</p>
  <p>カット単体の意味は、前後に何が並ぶかで変わる。並べたカットの間に、見る人が自分で意味を補うからだ。この考え方をモンタージュと呼ぶ。</p>

  <h2>対比と連想</h2>
  <p>モンタージュの使い方は大きく2つある。1つは対比で、豪華な食卓と空の皿を並べて格差を見せるように、違うものを並べて差を際立たせる。もう1つは連想で、時計の針と焦る顔を並べて時間の迫りを感じさせるように、似たものや関係のあるものを並べて別の意味を呼び起こす。</p>
  <p>練習や準備の様子を短いカットで次々に見せ、時間の経過を伝える手法も、日本語では「モンタージュ」と呼ばれることが多い。</p>

  <h2>切り抜き・MADへのつながり</h2>
  <p>切り抜きは、元の動画の一部を選び、並べ直して新しい面白さを作る。音MADは、素材の声や画を曲に合わせて並べ直し、元とは違う意味を生む。どちらも、並びが意味を作るというモンタージュの考え方の上にある。具体的な作り方は応用編のEとFで扱う。</p>
</template>

<template id="body-edit-3">
  <h2>カットの長さと情報量</h2>
  <p>映像が退屈に感じられるとき、原因の多くは、カットの長さと、そのカットに入っている情報量が釣り合っていないことにある。見る人が画面の情報を読み終えた後もカットが続くと、待たされている感じが生まれる。</p>
  <p>情報の多いカットは長めに、少ないカットは短めに。見る人が読み終えたタイミングで次に行く、というのが一つの目安になる。</p>

  <h2>間（ま）の使い方</h2>
  <p>テンポは速ければ良いわけではない。ずっと速いと、見る人は疲れ、どこが大事か分からなくなる。大事なセリフの後、驚きの前、オチの直前にあえて少し長い間を取ると、そこが強調される。</p>
  <p>速い所と遅い所の差があるから、リズムが生まれる。全体を同じ速さで刻むより、場面ごとに速さを変える方が、テンポは豊かになる。</p>

  <h2>ジャンルごとの適正テンポ</h2>
  <p>適したテンポはジャンルで違う。切り抜きや縦型ショートは、間を詰めた速いテンポが合うことが多い。Vlogは、景色や空気を味わう時間を残す方が合うこともある。音MADや文字PVでは、テンポは曲が決める。</p>
  <p>同じジャンルの好きな作品を、カットごとの長さを測りながら見てみると、そのジャンルのテンポの感覚がつかみやすい。</p>
</template>

  <p class="tk">この章は叩き台。人物や年の裏付けは、まだ取りきれていない所に「要確認」と書いている。</p>
  <h2>ワンショットの時代</h2>
  <p>映画が生まれた1890年代、作品の多くはカメラを固定した1カットの映像だった。リュミエール兄弟の作品は、1本が1分弱の1カットで、出来事をそのまま記録するものが中心だった。</p>

  <h2>編集の発見</h2>
  <p>1900年前後から、複数のカットをつないで物語を語る試みが広がる。イギリスのブライトン派と呼ばれる作家たちや、アメリカのエドウィン・S・ポーターの『大列車強盗』（1903年）が、場所の違うカットをつないで出来事を進める方法を示した（誰が最初かについては諸説あり、要確認）。</p>
  <p>D・W・グリフィスは、離れた場所で同時に起きている出来事を交互に見せるクロスカッティングや、クロースアップを物語の中で使い、編集で緊張感を作る方法を広げたとされる（評価の言い方は要確認）。</p>

  <h2>モンタージュ理論の広がり</h2>
  <p>1920年代のソ連では、クレショフ、エイゼンシュテイン、プドフキンらが、カットの並びが意味を生む仕組みを理論として研究した。エイゼンシュテインの『戦艦ポチョムキン』（1925年）は、その実践としてよく挙げられる。</p>
  <p>この時代に考えられたモンタージュの理論は、映画だけでなく、CM、MV、ネット動画の編集にも受け継がれている。並べ方で意味を作る考え方は、この編の「モンタージュ」で扱った。</p>

<template id="body-composite-1">
  <h2>レイヤー構造で画を考える</h2>
  <p>コンポジットとは、複数の素材を重ねて1つの画を作ることだ。背景、被写体、文字、光の効果。それぞれを別の層（レイヤー）として持ち、上から順に重ねる。紙に描いた絵を透明なシートに分けて重ねるのに近い。</p>
  <p>レイヤーに分けておくと、後から1つの要素だけを動かしたり、色を変えたりできる。画を1枚の絵として見るだけでなく、何層でできているかで考える習慣が、合成の入口になる。</p>

  <h2>描画モードの基礎</h2>
  <p>上のレイヤーを下のレイヤーにどう混ぜるかを、描画モード（ブレンドモード）と呼ぶ。基本の「通常」は上の画で下を覆う。「スクリーン」は明るい所だけを足すので、光や炎の素材を重ねるのに向く。「乗算」は暗い所だけを残すので、影や汚れを重ねるのに向く。</p>
  <p>描画モードは多くの種類があるが、まず「明るくする系」と「暗くする系」があると押さえれば、どれを選ぶか当たりを付けやすい。</p>

  <h2>合成が浮くとき何が起きているか</h2>
  <p>合成した素材が浮いて見えるとき、原因はたいてい、素材と背景の何かがそろっていないことにある。光の向き、色味、明るさの幅、ピントやボケ、ノイズの量、動き方。どれか1つがずれるだけで、目は違和感を拾う。</p>
  <p>浮いていると感じたら、この項目を1つずつ見比べて、ずれている所を探す。光と色の言葉は準備編の「色と光の最低限」、切り抜きの境目は次の章「マスクとキーイング」で扱う。</p>
</template>

  <h2>魅せたいものを1文で言う</h2>
  <p>構成は、作品で何を魅せたいかを決めることから始まる。0.1の定義で言えば、全ての要素が向かう先を決める作業だ。編集編がカット単位の時間の設計なら、構成編は作品全体の時間の設計である。</p>

  <h2>盛る要素と捨てる要素</h2>
  <p>魅せたいものが決まると、素材の中から盛る要素と捨てる要素を選べるようになる。撮った素材や思いついたアイデアが良くても、魅せたいものにつながらないなら削る。削った分、残した要素が目立つ。</p>

  <p>何を魅せるかは、ジャンルによって出発点が違う。Vlogでは日常のどこを切り取るか、文字PVでは曲のどの言葉を立てるか、切り抜きでは長い元動画のどの瞬間を選ぶか。応用編の各ジャンルの1章目で、そのジャンルで何を魅せるかを扱う。</p>

<template id="body-structure-2">
  <h2>フックの役割</h2>
  <p>フックは、作品の冒頭で見る人の注意をつかむ仕掛けだ。どれだけ後半が良くても、最初の数秒で離れられたら、その良さは届かない。ネット動画では、見る人は一覧の中から次々に動画を試すので、冒頭で残ってもらえるかが特に重要になる。縦型ショートでは、その時間がさらに短くなる。</p>

  <h2>最初に見せるのは一番いい所か</h2>
  <p>冒頭に作品の一番の見せ場を持ってくる作り方がある。結末やクライマックスを先に少し見せ、「どうしてこうなったのか」と思わせてから最初に戻る方法だ。切り抜きや解説動画でよく使われる。</p>
  <p>ただ、一番いい所を最初に出し切ると、後半の驚きが弱くなることもある。冒頭で見せるのは、見せ場そのものより、見せ場への期待や疑問の方がよい場合もある。何を魅せたいかによって選ぶ。</p>

  <p>ジャンルによって使われやすいフックの形は違う。解説やゆっくり実況では、最初に問いを投げる。切り抜きでは、一番面白い発言を先に見せる。文字PVやMVでは、最初の1画面の絵の強さと、曲の入りで引き込む。Vlogでは、その日の一番いい景色を最初に見せる。自分のジャンルの再生数の多い作品の、最初の5秒を比べてみると、型が見えてくる。</p>

<template id="body-structure-3">
  <h2>起承転結を型として使う</h2>
  <p>起承転結は、導入（起）、展開（承）、転換（転）、結末（結）の4つで話を組み立てる型だ。もとは漢詩の構成から来た言葉とされる。映像でも、何を見せる作品かを伝え、それを広げ、予想外のことを起こし、着地させる、という流れとして使える。</p>
  <p>ほかにも、序破急や、映画脚本で使われる三幕構成などの型がある。型があると、素材をどの順番に並べればいいか迷ったときの出発点になる。</p>

  <h2>情報を小出しにする効果</h2>
  <p>同じ素材でも、情報を出す順番で面白さは変わる。答えを先に言うか、後で言うか。全部を一度に見せるか、少しずつ見せるか。見る人が「次はどうなるのか」と思っている間は、作品から離れにくい。</p>
  <p>小出しにしすぎると、見る人は何の話か分からずに離れてしまう。何を先に渡し、何を後に取っておくかの釣り合いを決めることが、情報の出し方の設計である。</p>

  <h2>型を外すときの判断</h2>
  <p>型どおりに作ると、分かりやすい代わりに、先が読めることもある。転をあえて置かない、結を見せずに終える、といった外し方で、余韻や驚きを作れる。0.3で書いたとおり、型を外すなら、外すことで何を魅せたいのかを説明できるようにしておきたい。</p>

  <p>Vlogは、作り手の日常や体験を撮って見せるジャンルだ。大きな出来事が起きなくても成り立つ代わりに、日常のどこを切り取り、どんな空気として見せるかが作品の中心になる。魅せたいものは、出来事そのものより、その場の空気や作り手の目線であることが多い。</p>

  <h2>素材を見て使う所を選ぶ</h2>
  <p>編集は、撮った素材を全部見返して、使える所に印を付けることから始まる。最初に決めた「何を見せたいか」に照らして、残す場面と捨てる場面を分ける。全部を時系列に並べるより、見せたいものにつながる場面を軸にした方が、まとまりやすい。</p>

  <h2>ジャンプカットとテンポ</h2>
  <p>話している途中の言いよどみや、移動中の何も起きない時間を切って詰めると、同じ構図のまま時間が飛ぶジャンプカットになる。Vlogでは、ジャンプカットをテンポを出す手段として使うことが多い。カットのつなぎ方は編集編の「カットとつなぎ」で扱っている。</p>

  <h2>Bロールで間をつなぐ</h2>
  <p>ジャンプカットが続きすぎると、画面が細かく飛んで落ち着かない。話の間にBロールを挟むと、声は続けたまま、画面に変化と空気を足せる。</p>

  <h2>詰まりやすい所</h2>
  <p>撮った本人は全ての場面に思い入れがあるので、削るのが難しい。一度最後までつないだら、しばらく置いてから見直すと、長いと感じる所が見つけやすい。</p>
</template>

<template id="body-vlog-6">

  <p>投稿先が推奨する解像度、fps、形式に合わせて書き出す。撮影したときのfpsと書き出しのfpsがずれると、動きがカクつくことがある（準備編の「コマとfps」）。</p>

  <h2>詰まりやすい所</h2>
  <p>色を作り込みすぎて、肌の色が不自然になることがある。人が映っている場面では、肌の色が自然に見えるかを基準にして、やりすぎを止める。</p>

<template id="body-moji-1">
  <h2>このジャンルで何を魅せるか</h2>
  <p>文字PVは、歌詞などの文字を主役にして、曲に合わせて動かすジャンルだ。文字は読まれる情報であると同時に、画面を作る絵でもある。曲の言葉と気分を、文字の形と動きで見せることが中心になる。</p>

  <h2>重要な軸：文字、タイミング、合成</h2>
  <p>特に比重が大きいのは、文字のデザイン（画編の「文字とタイポグラフィ」）、曲へのタイミング（音編の「タイミングと音ハメ」）、背景や質感を重ねる合成（合成編の「コンポジット」）だ。</p>

  <h2>作り方の流れ</h2>
  <p>この編では、曲を聴き込んで構成を決める → 書体とレイアウト → 歌詞のタイミング → 文字を動かす → 背景と仕上げ、の順に章を立てている。</p>

  <h2>参考にするもの</h2>
  <p>参考になるのは、他の文字PVやリリックビデオ、ポスターや本の表紙などのグラフィックデザインだ。好きな作品を止めて、1画面の文字の置き方を見てみると、レイアウトの型が見えてくる（参考作品は今後、候補を挙げて選ぶ）。</p>
</template>

<template id="body-moji-2">
  <h2>曲の展開を書き出す</h2>
  <p>作り始める前に、曲を何度も聴いて、イントロ、Aメロ、Bメロ、サビ、間奏といった展開と、それぞれの時間を書き出す。どこで曲が盛り上がり、どこで静かになるかが分かると、映像のどこに力を入れるかが決めやすくなる。</p>

  <h2>歌詞から見せたい言葉を選ぶ</h2>
  <p>歌詞の全ての言葉を同じ強さで見せる必要はない。曲の中心になる言葉、繰り返される言葉、意味の強い言葉を選び、そこを大きく、印象的に見せる。選ばなかった言葉は、小さく添えるか、流すように見せる。</p>

  <h2>全体の構成を決める</h2>
  <p>展開と言葉が見えたら、全体の構成を決める。サビで画面の色を変える、最後のサビで最初の画面に戻る、といった大きな流れを先に決めておくと、細部を作るときに迷いにくい。構成の考え方は構成編で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>最初から細かい動きを作り始めると、途中で全体のバランスが崩れやすい。先に全体を簡単な文字だけで仮に並べ、曲の頭から終わりまで通して見てから、作り込む所を決めるとよい。</p>
</template>

<template id="body-moji-3">
  <h2>書体を選ぶ</h2>
  <p>書体は曲の印象を左右する。明朝体は物語や切なさ、太いゴシック体は力強さ、手書き風は親しさを出しやすい。1本の作品で使う書体は2〜3種類程度に絞ると、まとまりが出やすい。書体の性格は画編の「文字とタイポグラフィ」で扱っている。</p>

  <h2>文字の大きさと強弱</h2>
  <p>1画面の中で、一番見せたい言葉を大きく、他を小さくして階層を作る。大きさだけでなく、太さ、色、傾きでも強弱は付けられる。全部を大きくすると、どれも目立たなくなる。</p>

  <h2>画面の中の置き方（三分割法など）</h2>
  <p>画面を縦横に3等分する線と交点を目安に文字を置く三分割法は、置き場所に迷ったときの出発点になる。真ん中に大きく置く、端に寄せて余白を広く取る、斜めに流す、といった置き方もある。止めて1枚の絵として見られるかを確かめながら決める。構図の考え方は画編の「構図」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>デザインに凝りすぎて、読めない画面になることがある。読ませたい言葉と、絵として見せる言葉を分けて考え、読ませたい言葉は背景との明るさの差を十分に取る。</p>
</template>

<template id="body-moji-4">
  <h2>歌詞を音に合わせる</h2>
  <p>歌い出しの瞬間に文字が出るように、タイムラインに歌詞の頭の位置の印を打つ。波形を見ながら、1音ずつ合わせるか、1フレーズごとに合わせるかを、曲の速さと見せたい印象で決める。</p>

  <h2>読める表示時間</h2>
  <p>文字は、読み切れるだけの時間、画面に残っている必要がある。歌が速い所では、フレーズをまとめて出す、先に少し早めに出しておく、といった工夫で読める時間を作る。読ませる速さの考え方は画編の「文字とタイポグラフィ」で扱っている。</p>

  <h2>音ハメで強調する</h2>
  <p>ドラムの強い音や、歌の強い言葉に合わせて、文字を揺らす、拡大する、色を変えると、その瞬間が強調される。全部の音に合わせると単調になるので、強調する所を選ぶ。合わせる所と外す所の考え方は、音編の「タイミングと音ハメ」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>歌声に合わせたつもりでも、見ると少し遅れて感じることがある。文字が完全に出きる瞬間が歌い出しに来るように、動き出しを1〜2フレーム早めると、合って見えることが多い。</p>
</template>

<template id="body-moji-5">
  <h2>出し方・消し方の型</h2>
  <p>文字の出し方には、フェードで現れる、横からスライドする、1文字ずつ出る、拡大して現れる、などの型がある。消し方も同じだけある。曲の雰囲気に合う型を数種類に絞り、作品の中で使い分けると、統一感を保ちながら変化を付けられる。</p>

  <h2>イージングで動きに表情を付ける</h2>
  <p>同じスライドでも、イージングの付け方で、軽やかにも重くも見える。勢いよく出てふわっと止まる、ゆっくり出て強く止まる。動きの速さの設計は、動き編の「イージング」で扱っている。</p>

  <h2>アニメーションの12原則から使えるもの</h2>
  <p>アニメーションの12原則は、文字の動きにも応用できる。動く前に少し逆へ引く「予備動作」、止まった後に少し揺れる「フォロースルー」、着地の瞬間に少し潰れる「スクワッシュ＆ストレッチ」。どれも、文字に重さや弾みを感じさせる。12原則の一覧と成り立ちは、動き編の「<a href="#motion-4">歴史：動きの原則</a>」にまとめている。</p>

  <h2>詰まりやすい所</h2>
  <p>動きの種類を増やしすぎると、画面が騒がしくなり、文字が読みにくくなる。読ませたい言葉の所では動きを控えめにして、読ませる時間を優先する。</p>
</template>

<template id="body-moji-6">
  <h2>背景の役割</h2>
  <p>文字PVの背景は、文字を引き立てながら、曲の世界観を伝える役割を持つ。単色、写真やイラスト、抽象的な模様など、何を使うかは曲の印象で決める。背景が主張しすぎると、文字が埋もれる。</p>

  <h2>質感とエフェクト</h2>
  <p>紙のざらつき、ノイズ、光のにじみ、色ずれなどの質感を重ねると、画面に味が出る。質感は作品全体で統一すると、まとまりが出やすい。仕上げの効果の考え方は、合成編の「仕上げ」で扱っている。</p>

  <h2>文字を読みやすく保つ</h2>
  <p>背景と質感を足した後も、文字が読めるかを確かめる。背景を暗く落とす、文字に影を付ける、文字の後ろだけ背景をぼかす、などの方法で、文字と背景の差を保つ。</p>

  <h2>詰まりやすい所</h2>
  <p>仕上げの効果を重ねるほど、書き出しや再生が重くなる。投稿先で再圧縮されると、細かいノイズや質感は崩れやすいので、書き出した後に投稿先の画質でも確認する。</p>
</template>

<template id="body-mg-1">

<template id="body-mg-2">
  <h2>コンテで流れを決める</h2>
  <p>動かし始める前に、作品全体の流れを簡単な絵と文字で並べたコンテを作る。どの場面で何を見せ、どうつながっていくか。絵は簡単な四角や矢印でもよい。全体の流れが決まると、作る画面の数と順番が見えてくる。</p>

  <h2>スタイルフレームを作る</h2>
  <p>コンテの中から要所の画面を選び、完成形の1枚絵として作り込む。これがスタイルフレームだ。色、形、書体、質感をここで決めておくと、残りの画面もそのルールに沿って作れる。考え方は画編の「デザインとスタイルフレーム」で扱っている。</p>

  <h2>構図の型（三分割法など）</h2>
  <p>スタイルフレームの構図を決めるとき、三分割法は置き場所の目安になる。図形の大きさの差、余白の取り方、視線の流れも合わせて考える。止めてもいい絵になっているかを、ここで確かめておく。構図の考え方は画編の「構図」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>スタイルフレームを作らずに動かし始めると、動きは付いたのに画面が弱い、という状態になりやすい。動かす前に、止まった画面で完成させるのが先だ。</p>
</template>

<template id="body-mg-3">
  <h2>動かす単位で分ける</h2>
  <p>デザインを作るときは、後でどう動かすかを考えて、動かす単位ごとに部品を分けておく。顔と腕を別々に動かしたいなら、別の部品として作る。1枚の絵として作ってしまうと、後から分けるのに手間がかかる。</p>

  <h2>レイヤーを整理する</h2>
  <p>部品が増えるほど、レイヤーの数も増える。レイヤーに分かりやすい名前を付け、関係のあるものをまとめておくと、動かす作業や修正が速くなる。IllustratorやPhotoshopで作った素材をAfter Effectsに読み込む場合、元のファイルの時点で整理しておくと後が楽になる。</p>

  <h2>詰まりやすい所</h2>
  <p>動かし始めてから、回転の中心（アンカーポイント）がずれている、部品が足りない、といった問題に気づくことがある。作った素材を読み込んだら、本格的に動かす前に、各部品を少し動かして確かめておく。</p>
</template>

<template id="body-mg-4">
  <h2>キーフレームとイージング</h2>
  <p>動きは、ある時点の位置や大きさを記録するキーフレームを置き、その間をソフトに補間させて作る。キーフレームの間の速さの変化を決めるのがイージングだ。グラフエディタで速度の変化を見ながら調整すると、動きを意図どおりに作り込める。考え方は動き編の「イージング」で扱っている。</p>

  <h2>動き出しをずらす</h2>
  <p>複数の要素を同時に動かすと、機械的に見えやすい。動き出しを数フレームずつずらすと、波のような流れが生まれる。どの順番でずらすかで、見る人の視線の流れを作れる。</p>

  <h2>アニメーションの12原則から使えるもの</h2>
  <p>図形の動きにも、アニメーションの12原則は応用できる。動く前の「予備動作」、止まった後の「フォロースルー」、加速と減速の「スローイン・スローアウト」、潰れて伸びる「スクワッシュ＆ストレッチ」。どれも図形に重さや弾みを与える。12原則の一覧と成り立ちは、動き編の「<a href="#motion-4">歴史：動きの原則</a>」にまとめている。</p>

  <h2>詰まりやすい所</h2>
  <p>イージングのプリセットを全部の動きに同じようにかけると、どの動きも同じ感触になる。要素ごとに、どんな重さの物として見せたいかを決めてから調整する。</p>
</template>

<template id="body-mg-5">
  <h2>形と動きでつなぐ</h2>
  <p>モーショングラフィックスでは、場面を切り替えるとき、図形が広がって次の画面になる、ある形が別の形に変わる、といった方法でつなぐことが多い。前の場面の形や色を次の場面に引き継ぐと、つなぎ目を感じさせずに場面が変わる。</p>

  <h2>つなぎの方向をそろえる</h2>
  <p>動きの方向がつなぎの前後でそろっていると、流れが途切れずに見える。右へ流れて消えた要素の後は、次の要素も右から入ってくる、というように方向をそろえる。方向を急に変えると、そこで区切りが生まれる。区切りを作りたいときは、あえて変える。</p>

  <h2>詰まりやすい所</h2>
  <p>トランジションに凝りすぎると、つなぎの動きばかりが目立ち、本来見せたい画面が短くなる。トランジションは見せたい画面を引き立てるためのもの、と考えて長さを決める。</p>
</template>

  <h2>書き出しの設定</h2>
  <p>投稿先の推奨する解像度とfpsに合わせて書き出す。細い線や細かいグラデーションは、圧縮で崩れやすいので、書き出した後に確認する。</p>

  <h2>詰まりやすい所</h2>

<template id="body-yukkuri-1">

<template id="body-yukkuri-2">
  <h2>何を伝える回か決める</h2>
  <p>台本を書く前に、この回で見る人に何を持ち帰ってほしいかを1文で決める。ゲームのある場面の面白さか、攻略の情報か、ある話題の解説か。決まっていないと、掛け合いが脱線したまま戻ってこなくなりやすい。</p>

  <p>1回のセリフが長すぎると、字幕が読みきれず、聞く側も疲れる。長い説明は、相づちや質問を挟んで区切る。セリフの長さを変えることで、会話のテンポも作れる。</p>

  <h2>詰まりやすい所</h2>
  <p>書いている本人には分かっている前提を、説明し忘れることがある。台本を書いたら、その話題を知らない人のつもりで読み返し、分からない所がないかを確かめる。</p>

  <p>配信や動画には、配信者や制作者の著作権などの権利がある。さらに、配信の中で流れているゲームの映像、BGM、他の人の作品にも、それぞれの権利者がいる。切り抜きは他人の作品を素材にする活動なので、許可のない切り抜きは削除や問題につながるおそれがあることを知っておく。</p>

  <h2>配信者のガイドラインを確認する</h2>
  <p>配信者や所属事務所の中には、切り抜きのガイドラインを公開している人がいる。切り抜きを許可しているか、収益化してよいか、タイトルや概要欄に元の配信へのリンクを入れる必要があるか、といった条件が書かれていることが多い。切り抜く前に、その配信者のガイドラインを確認する。ガイドラインがない場合は、許可されているとは限らない。</p>

  <h2>迷ったときの判断</h2>
  <p>ガイドラインが見つからない、条件がはっきりしないときは、切り抜かない、または配信者に確認する。配信の中のゲームや音楽の権利も別にあるので、ゲームの配信ガイドラインなども合わせて確かめる。部の作品として公開する場合は、部としての方針も確認しておく。</p>
</template>

<template id="body-cg-1">
  <h2>このジャンルで何を魅せるか</h2>
  <p>3DCGは、仮想の空間に形を作り、質感、光、カメラ、動きをすべて自分で決めて映像にするジャンルだ。現実にない物も、撮れない角度も作れる。自由度が高い分、何を魅せたいかを決めないと、どこを見ればいいか分からない映像になりやすい。</p>

  <h2>重要な軸：構図、光、カメラ</h2>
  <p>特に比重が大きいのは、構図（画編の「構図」）、光（画編の「光とライティング」）、カメラ（動き編の「カメラワーク」）だ。仕上げでは、合成編の「レンダーパス合成」の考え方も使う。</p>

  <h2>作り方の流れ</h2>
  <p>この編では、モデリング → マテリアルとテクスチャ → リギング → アニメーション → ライティングとカメラ → レンダリング → コンポジット、の順に章を立てている。動かない静止画や、キャラクターの出てこない作品なら、リギングやアニメーションは飛ばしてよい。</p>

  <h2>参考にするもの</h2>
  <p>参考になるのは、他の3DCG作品のほか、写真、映画の撮影と照明、現実の物そのものだ。質感や光は、現実の物をよく見ることが一番の参考になる（参考作品は今後、候補を挙げて選ぶ）。</p>
</template>

<template id="body-cg-2">
  <h2>映る所から作る</h2>
  <p>モデリングは、3DCGの形を作る工程だ。最初に、カメラにどう映るかを決めておくと、作る量を減らせる。カメラに映らない裏側や、遠くて小さくしか映らない物は、細かく作り込まなくてよい。</p>

  <h2>大きな形から細部へ</h2>
  <p>形は、大まかな塊から作り始め、全体のバランスを確かめてから細部を足していく。最初から細部を作ると、後で全体の比率がおかしいと気づいたときに直すのが大変になる。資料の写真や三面図を下に敷いて作ると、形を取りやすい。</p>

  <h2>作り込む量の判断</h2>
  <p>どこまで細かく作るかは、カメラからの距離と、その物が画面の中でどれだけ大事かで決める。主役の物は作り込み、背景の物は簡単な形にとどめる。細かい凹凸は、形で作らずに次の章のテクスチャで表現する方法もある。</p>

  <h2>三角形、四角形、Nゴン</h2>
  <p>3DCGの形は、ポリゴンと呼ばれる面の集まりでできている。面の角（頂点）が3つなら三角ポリゴン、4つなら四角ポリゴン（クアッド）、5つ以上ならNゴンと呼ぶ。</p>

  <h2>詰まりやすい所</h2>
  <p>面の向きが裏返っている、面が重なっている、といった形の乱れは、後の工程で表示やレンダリングの不具合になりやすい。作業の区切りごとに、形の乱れがないかを確かめておく。</p>
</template>

<template id="body-cg-3">
  <h2>色とつや</h2>
  <p>マテリアルは、物の表面がどう光を返すかの設定だ。基本になるのは、表面の色、つやの強さ（ラフネス）、金属かどうか（メタリック）の3つである。同じ形でも、つやを変えるだけで、プラスチックにも陶器にも見える。</p>
  <p>現実の物をよく見ると、完全に均一な色やつやの物はほとんどない。少しのむらが、本物らしさにつながる。</p>

  <h2>テクスチャで情報を足す</h2>
  <p>テクスチャは、表面に貼る画像で、色の模様や汚れ、細かい凹凸、つやのむらを表現する。形を細かく作らなくても、テクスチャで凹凸があるように見せられる（ノーマルマップ、バンプマップなど）。画像を貼るための展開（UV展開）の作業も、この工程に含まれる。</p>

  <h2>詰まりやすい所</h2>
  <p>マテリアルは、光の当て方で見え方が大きく変わる。仮の光だけで調整すると、本番のライティングで違って見えることがある。ライティングをある程度決めてから、マテリアルを最終調整するとよい。</p>
</template>

<template id="body-cg-4">
  <h2>骨を入れる</h2>
  <p>リギングは、キャラクターや物を動かすための仕組みを作る工程だ。人の体なら、関節の位置に骨（ボーン）を入れ、骨が動くと周りの形も一緒に動くように結び付ける。骨と形の結び付きの強さ（ウェイト）を調整して、曲げたときに形が自然に変形するようにする。</p>

  <h2>動かしやすい操作を作る</h2>
  <p>骨を1本ずつ回して動かすのは手間がかかる。手首を動かすと腕全体がついてくる仕組み（IK）や、指をまとめて曲げる操作など、動かしやすい操作を作っておくと、次のアニメーションの工程が速くなる。</p>

  <h2>詰まりやすい所</h2>
  <p>肩や肘を大きく曲げたときに、形が潰れたり、ねじれたりしやすい。リギングが終わったら、極端なポーズを取らせて、崩れる所がないかを確かめる。Blenderには人型の骨組みを自動で作る機能もある（機能名は要確認）。</p>
</template>

<template id="body-cg-5">
  <h2>キーフレームとグラフエディタ</h2>
  <p>3DCGのアニメーションも、ある時点のポーズや位置をキーフレームとして記録し、その間をソフトに補間させて作る。グラフエディタで、位置や回転の値が時間とともにどう変わるかを見ながら、速さの変化を調整する。考え方は動き編の「イージング」で扱っている。</p>

  <h2>重さを感じさせる</h2>
  <p>3DCGの動きは、補間に任せると、重さのない、ふわふわした動きになりやすい。重い物はゆっくり動き出して強く止まる、着地の瞬間に少し沈み込む、といった工夫で、物の重さを感じさせる。</p>

  <h2>アニメーションの12原則から使えるもの</h2>
  <p>アニメーションの12原則は、3DCGのアニメーションでも使われている。動く前の「予備動作」、止まった後の「フォロースルー」、体の部位が少しずつ遅れて動く「オーバーラッピング」、ポーズとポーズの間を弧を描くように動かす「アーク」。12原則の一覧と成り立ちは、動き編の「<a href="#motion-4">歴史：動きの原則</a>」にまとめている。</p>

  <h2>詰まりやすい所</h2>
  <p>体の全ての部位が同時に動き出して、同時に止まると、ロボットのように見える。部位ごとに動き出しと止まりを少しずらすと、生き物らしくなる。</p>
</template>

<template id="body-cg-6">
  <h2>見せたい所を照らす</h2>
  <p>3DCGのライティングは、見せたい所に光を当て、見せなくていい所を暗く落とす作業だ。光の向き、強さ、色、大きさを決める。主になる光（キーライト）、影を和らげる光（フィルライト）、輪郭を出す光（リムライト）の三点照明から組み立てるのが一つの出発点になる。考え方は画編の「光とライティング」で扱っている。</p>
  <p>空全体からの光を画像で与える方法（HDRIなど）を使うと、現実の空間に近い光を手早く作れる。</p>

  <h2>カメラの位置とレンズ</h2>
  <p>カメラの位置と高さで、被写体の見え方が変わる。低い位置から見上げると大きく強く見え、高い位置から見下ろすと小さく見える。レンズの焦点距離も大事で、広角は遠近感が強く、望遠は遠近感が弱くなる。現実のカメラに近い焦点距離を選ぶと、見慣れた自然な画になりやすい。</p>

  <h2>構図の型（三分割法など）</h2>
  <p>カメラの画面の中で、主役をどこに置くかを決める。三分割法は置き場所の目安になる。3DCGでは物の位置を自由に動かせるので、カメラだけでなく、物の配置を構図に合わせて動かすこともできる。構図の考え方は画編の「構図」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>光を足していくと、影がなくなって平らな画になりやすい。光を足す前に、本当にその光が必要か、影を残した方が見せたい所が際立つのではないかを考える。</p>
</template>

<template id="body-cg-7">
  <h2>画質と時間の釣り合い</h2>
  <p>レンダリングは、3DCGの空間を画像として書き出す工程だ。画質を上げるほど、1枚にかかる時間は長くなる。映像では1秒に何十枚も書き出すので、1枚の時間の差が全体では大きな差になる。サンプル数、解像度、光の反射の回数などを、見た目が許せる範囲で下げて、時間との釣り合いを取る。</p>
  <p>Blenderでは、速く書き出せるEeveeと、光を正確に計算するCyclesを使い分けることができる。</p>

  <h2>パスに分けて書き出す</h2>
  <p>後の合成で調整できるよう、色、影、反射、光などの要素ごとに分けて書き出すことがある。これがレンダーパスだ。物体ごとの選択用の画像も書き出しておくと、合成で特定の物だけを調整しやすい。考え方は合成編の「レンダーパス合成」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>長いレンダリングの途中で失敗すると、やり直しの時間が大きい。動画ファイルで直接書き出すより、連番の画像で書き出す方が、途中で止まっても続きから再開できる。本番の前に、低い画質で全体を書き出して確かめておく。</p>
</template>

<template id="body-cg-8">
  <h2>パスを重ねる流れ</h2>
  <p>書き出したレンダーパスを、合成ソフトで重ねて画を仕上げる。BlenderのコンポジターやAfter Effects、DaVinci ResolveのFusionなどを使う。基本の色のパスに、光や反射のパスを足し、影のパスを掛け合わせる、という順に重ねていく。考え方は合成編の「レンダーパス合成」で扱っている。</p>

  <h2>色と光を後から整える</h2>
  <p>パスに分けておくと、反射だけを強める、特定の物の色だけを変える、といった調整を、レンダリングをやり直さずにできる。光のにじみ（グロー）や被写界深度のボケ、全体の色の調整も、この段階で加えることが多い。仕上げの考え方は合成編の「仕上げ」で扱っている。</p>

  <h2>実写と合わせる</h2>
  <p>3DCGの物を実写の映像に合成する場合は、実写の光の向き、色、ボケ、ノイズ、カメラの動きに合わせる。カメラの動きは、合成編の「トラッキング」で扱っているカメラトラッキングで読み取る。</p>

  <h2>詰まりやすい所</h2>
  <p>合成で調整できるからといって、3DCGの段階の作業を雑にすると、合成で直しきれないことがある。光の向きや形の問題は、3DCGの段階で直しておく。</p>
</template>

<script>
var PARTS = [
 {id:"intro",name:"序論",desc:"映像とは何かを定義し、このサイトの立場と読み方を決める。",start:0,articles:[
  {id:"intro-0",pub:true,body:"body-intro-0",mins:3,n:"0.0",title:"凡例",sub:"このサイトの読み方",summary:"このサイトの作りと、本文を読むときの約束ごと。編と章の番号の読み方、用語の吹き出し、図と動画、「要確認」と出典の扱い。",outline:["編と章の作り","用語の吹き出し","図と動画","「要確認」と出典"],further:["intro-1","intro-5","intro-3"]},
  {id:"intro-1",n:"0.1",title:"映像とは何か",sub:"静止画の連続から、意図の設計へ",pub:true,body:"body-intro-1",mins:7,summary:"映像は静止画の連続である、という仕組みの定義から出発する。「どこで止めてもいい絵になる」という物差しとその限界を経て、このサイトの中心となる定義にたどり着く。",further:["visual-1","motion-1","intro-3"]},

  {id:"intro-3",n:"0.3",title:"映像理論の流派",sub:"このサイトの立場",pub:true,body:"body-intro-3",mins:5,summary:"このサイトは型を強制せず、中心の定義を物差しとして使う。対比として、連続性編集のルール、ウォルター・マーチの6つのルール、ドグマ95という型やルールで考える例を見て、型との付き合い方を決める。",outline:["このサイトの立場：定義は物差しとして置く","例1：連続性編集のルール","例2：ウォルター・マーチの6つのルール","例3：ドグマ95","型とどう付き合うか"],further:["intro-1","edit-1","intro-4"]},
  {id:"intro-4",n:"0.4",title:"映像理論を学ぶ意味",sub:"映像の理由が読めるようになる",pub:true,body:"body-intro-4",mins:4,summary:"世の中の映像には、そう作られている理由がある。理論はその理由を言葉にしたもの。理由と語彙を知ると、自分の映像に活かせて、作れるものを想像しやすくなり、他人の作品をロジカルに読めるようになる。",outline:["映像には、そう作られている理由がある","理由が分かると、自分の映像に使える","言葉を知らないと、作れるものを想像しにくい","他人の作品をロジカルに読める","理論を知ると、感覚が鈍るのか"],further:["intro-3","visual-1","edit-1"]},
  {id:"intro-5",n:"0.5",title:"学ぶかどうか、学び方を決める",sub:"詰まった所から開いていい",pub:true,body:"body-intro-5",mins:3,summary:"理論を学ばず、作りながら必要な記事だけ開く選び方もある。どちらを選んでも、全編を順番に読む必要はない。詰まった所から開き、1記事で区切っていい。編と章に分けたのは、一度に抱える量を減らし、自分のペースで進めるため。",outline:["学ばずに作る、という選び方もある","全部を一度に理解しなくていい","詰まった所から読む","1記事で区切る","困りごと索引の使い方"],further:["intro-4","intro-6","intro-1"]},
  {id:"intro-6",pub:true,body:"body-intro-6",mins:3,n:"0.6",title:"ゴールとプランを練る",sub:"読んだら作る、全部は読まなくていい",summary:"読んだことは次の1本で試して初めて身につく。全編を読む必要はなく、作るジャンルに必要な章が分かれば止めていい。ジャンル別の読む順番の例と、応用編から逆引きする読み方、理論の外側にあるものを書く。",outline:["読んだら作る","全部読まなくていい","ジャンル別の読む順番の例","応用編から逆引きする","映像理論の外側"],further:["intro-5","intro-7","structure-1"]},

 ]},

 {id:"motion",name:"動き編",desc:"モーション・イージング・カメラワーク。映像でしか味わえない快感を扱う。",articles:[

  {id:"motion-2",pub:true,body:"body-motion-2",mins:4,title:"イージング",sub:"速度の設計",summary:"等速の動きは機械に見えやすい。加速と減速の付け方、値と速度のグラフの読み方、重い・軽い・弾むの違い、長さと配分の2つのつまみ、実写でのイージングとスピードランプ。",outline:["等速の動きは、機械に見えやすい","加速と減速の呼び方","グラフで速さを読む","重い、軽い、弾む","長さと配分は、別のつまみ","実写のイージング","設定に頼りきると、どれも同じになる"],further:["mg-4","moji-5","cg-5"]},
