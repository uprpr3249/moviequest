<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>映像とは何か — カラーバー版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
/* Direction: the SMPTE color-bar test pattern. Each 編 is one bar; its color follows it everywhere.
   Everything else stays black on white so the bars are the only loud thing. */
:root{
  --paper:#FFFFFF; --ink:#000000; --gray:#5C5C5C; --line:#D9D9D9; --shade:#F2F2F2;
  --display:"Dela Gothic One","Hiragino Sans",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.9;
  line-break:strict;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-weight:400;text-wrap:balance;font-feature-settings:"palt"}
p,li{text-wrap:pretty}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}

/* ---------- home: the pattern ---------- */
.bars{display:flex;height:min(60vh,560px);min-height:300px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  padding:18px 0 14px;text-decoration:none;transform-origin:bottom;box-shadow:1px 0 0 currentColor;position:relative}
.bar .nm{writing-mode:vertical-rl;font-family:var(--display);font-size:clamp(1.05rem,2.6vw,2rem);line-height:1;letter-spacing:.06em}
.bar .ct{font-size:.78rem;opacity:.85}
.bar:hover .nm,.bar:focus-visible .nm{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.bar:focus-visible{outline-offset:-6px}
@media (prefers-reduced-motion:no-preference){
  .bars.intro .bar{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
}
.band{background:var(--ink);color:#fff;padding:34px 0 30px}
.band .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 48px;align-items:end}
.band h1{font-family:var(--display);font-size:clamp(2.6rem,7.5vw,5.4rem);line-height:1.05;margin:0;letter-spacing:.01em}
.band p{margin:0;font-size:.95rem;line-height:1.85;color:#D6D6D6}
.band .tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;border-top:1px solid #3A3A3A;padding-top:16px}
.band .tools a{font-size:.92rem;text-decoration:none;border-bottom:2px solid #fff}
.band .tools a:hover{border-bottom-color:transparent}
.band input{flex:1 1 220px;max-width:360px;font:inherit;font-size:.92rem;background:#fff;color:#000;border:0;padding:8px 12px;border-radius:0;min-height:40px}
.band input::placeholder{color:#777}

.thesis{padding:72px 0 8px}
.thesis p.k{margin:0 0 10px;font-size:.9rem}
.thesis blockquote{margin:0;font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.4rem);line-height:1.5;max-width:20em}
.thesis .src{margin:16px 0 0;font-size:.92rem}

.part{padding-top:72px}
.part h2{font-family:var(--display);font-size:clamp(1.5rem,3vw,2rem);line-height:1.3;margin:0 0 4px;display:flex;align-items:center;gap:14px}
.sw{width:.85em;height:.85em;flex-shrink:0;display:inline-block}
.part h2 a{text-decoration:none}
.part h2 a:hover{text-decoration:underline}
.part .desc{margin:0 0 14px;color:var(--gray);font-size:.95rem}
.chl{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.chl a{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:2px 14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none}
.chl .n{color:var(--gray);font-size:.88rem}
.chl .t{font-size:1.04rem}
.chl .s{color:var(--gray);font-size:.88rem;font-weight:400;margin-left:.6em}
.chl .st{font-size:.8rem;color:var(--gray);white-space:nowrap}
.chl a.draft .t{color:var(--gray)}
.chl a:hover .t{text-decoration:underline}
.chl a.pub .st{color:var(--ink)}
.results{padding-top:48px}
.results h2{font-family:var(--display);font-size:1.4rem;margin:0 0 12px}
.empty{color:var(--gray)}

/* ---------- inner pages ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--paper)}
.top .row{display:flex;align-items:center;gap:16px;padding:10px 0}
.top .home{font-family:var(--display);font-size:1.05rem;text-decoration:none}
.top .where{color:var(--gray);font-size:.88rem;margin-left:auto}
.top .where a{text-decoration:none}
.top .where a:hover{text-decoration:underline}
.strip{display:flex;height:10px;gap:1px;background:var(--paper)}
.strip a{flex:1;display:block;opacity:.32}
.strip a.pub{opacity:.7}
.strip a.on{opacity:1;box-shadow:inset 0 0 0 2px var(--ink);transform:scaleY(1.8);transform-origin:top}
.strip a:hover{opacity:1}

.phead{color:var(--c-ink)}
.phead .wrap{padding-top:64px;padding-bottom:28px}
.phead h1{font-family:var(--display);font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.1;margin:0 0 12px}
.phead p{margin:0;max-width:34em}

.ahead{padding-top:56px}
.ahead .pn{font-size:.92rem;display:flex;align-items:center;gap:10px;margin:0 0 14px}
.ahead .pn a{text-decoration:none}
.ahead .pn a:hover{text-decoration:underline}
.ahead h1{font-family:var(--display);font-size:clamp(2.2rem,6.5vw,3.8rem);line-height:1.15;margin:0}
.ahead .sub{color:#222;font-size:clamp(1.05rem,2.4vw,1.3rem);margin:12px 0 0;line-height:1.55}
.ahead .sum{color:var(--gray);margin:16px 0 0;max-width:36em;font-size:.98rem}
.ahead .meta{margin:14px 0 0;font-size:.88rem;color:var(--gray)}
.ahead .meta b{color:var(--ink)}
.body{max-width:36em;margin-top:40px}
.body h2{font-family:var(--display);font-size:clamp(1.3rem,2.6vw,1.6rem);line-height:1.45;margin:2.4em 0 .7em}
.body h2:first-child{margin-top:0}
.body p{margin:0 0 1.15em}
.body strong{font-weight:400;background:linear-gradient(transparent 62%,var(--c) 62%)}
.body .pull{margin:2.2em 0}
.body .pull .lab{font-size:.9rem;margin:0 0 8px}
.body .pull .q{font-family:var(--display);font-size:clamp(1.35rem,3vw,1.75rem);line-height:1.55;margin:0}
.body .fig{margin:2em 0 2.2em}
.body .fig svg{display:block;width:100%;height:auto}
.body .fig svg text{font-family:var(--body);fill:var(--ink)}
.body .fig figcaption,.body .ref figcaption{margin-top:10px;font-size:.9rem;color:var(--gray);line-height:1.7}
.body .fig figcaption .no,.body .ref figcaption .no{color:var(--ink);margin-right:.8em}
.body .ref{margin:2em 0 2.2em}
.body .ref .frame{position:relative;aspect-ratio:16/9;background:var(--ink)}
.body .ref .frame{display:block;overflow:hidden;text-decoration:none}
.body .ref .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.body .ref .frame .play{position:absolute;left:0;bottom:0;background:var(--ink);color:#fff;padding:8px 14px;font-size:.92rem;line-height:1.4}
.body .ref .frame:hover .play{background:#BF0000}
.body .ref a{color:var(--gray)}
.body .ref iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.body .ref .yt{margin-left:.6em}
.outline{max-width:36em;margin:40px 0 0;padding-left:1.6em}
.outline li{padding:4px 0 4px .3em;font-size:1.04rem}
.outline li::marker{color:var(--gray)}
.note{max-width:36em;margin:18px 0 0;color:var(--gray);font-size:.92rem}
.more{max-width:36em;margin-top:56px}
.more h2{font-size:1rem;margin:0 0 6px}
.prevnext{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:80px 0 0;padding:18px 0 0;border-top:2px solid var(--ink)}
.prevnext a{text-decoration:none;display:block}
.prevnext small{display:block;color:var(--gray);font-size:.82rem}
.prevnext b{font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.4}
.prevnext a:hover b{text-decoration:underline}
.prevnext .nx{text-align:right}

.idx h1{font-family:var(--display);font-size:clamp(2.2rem,6vw,3.6rem);margin:56px 0 10px;line-height:1.15}
.idx > p{color:var(--gray);margin:0 0 28px;max-width:36em}
.tr{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.tr li{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr);gap:4px 24px}
.tr .q{font-size:1.02rem}
.tr .ls{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.94rem}
.tr .ls a{display:inline-flex;align-items:center;gap:7px}
.tr .ls a .sw{width:.7em;height:.7em}
.tr .ls a.draft{color:var(--gray)}
.gl{margin:0;border-top:2px solid var(--ink)}
.gl div{display:grid;grid-template-columns:12em minmax(0,1fr);gap:4px 24px;padding:14px 0;border-bottom:1px solid var(--line)}
.gl dt{font-family:var(--display);font-size:1rem}
.gl dd{margin:0;color:#222;font-size:.95rem}
.gl dd a{color:var(--gray);font-size:.86rem;margin-left:.4em}

footer{margin-top:96px;padding:20px 0 48px;border-top:1px solid var(--line);color:var(--gray);font-size:.84rem}

@media (max-width:760px){
  body{font-size:16px}
  .band .wrap{grid-template-columns:1fr}
  .bars{height:52vh}
  .bar .ct{font-size:.68rem}
  .chl a{grid-template-columns:2.8em minmax(0,1fr)}
  .chl .st{grid-column:2}
  .chl .s{display:block;margin-left:0}
  .tr li,.gl div{grid-template-columns:1fr}
  .top .where{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="body-intro-1">
  <h2>映像は、静止画の連続である</h2>
  <p>まず仕組みの話から始める。映像とは、静止画の連続である。フィルムのコマ、動画ファイルのフレーム、パラパラ漫画のページ。形は違っても、止まった絵を高速で切り替えることで「動いて見える」という点は共通している。パラパラ漫画は、1枚1枚はただの絵なのに、めくる速さが上がった瞬間にキャラクターが走り出す。映像の出発点は、静止画の集まりが時間の中で動きに変わる、この仕組みにある。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/heRuLp7CyTM?rel=0" title="The horse in motion (Eadweard Muybridge) 1878" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>The horse in motion (Eadweard Muybridge) 1878（Channel Stop）。1878年、マイブリッジが走る馬を連続写真で撮り、それを順に切り替えた映像。1枚ずつはただの写真だ。<a class="yt" href="https://www.youtube.com/watch?v=heRuLp7CyTM" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>
  <p>ただし、これは仕組みの定義にすぎない。監視カメラの映像も名作映画も、仕組みの上ではどちらも静止画の連続だ。この定義だけでは、良い映像とそうでない映像の違いを説明できない。その違いを言葉にすることが、このサイト全体の仕事になる。</p>

  <h2>物差し：どこで止めても、いい絵になる</h2>
  <p>良い映像を見分ける物差しとして、このサイトでは次の目安を使う。<strong>良い映像は、どこで一時停止しても、いい絵になっている。</strong></p>
  <p>乱暴な基準に見えるが、使い道は広い。どのコマで止めても絵になっているなら、構図、色、被写体の置き方といった1枚の絵としての設計が、偶然に頼らず作られていることになる。止めるたびに中途半端な絵が出てくる映像は、1コマごとの設計を運に任せていることが多い。</p>
  <p>作り手にとっても、この物差しはすぐ使える。自分の映像を適当な場所で止めて、そこが1枚の絵として見られるかを確かめる。それだけで、直すべき場所がかなり見えてくる。詳しい使い方は画編で扱う。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/8U-gCTEYxCA?rel=0" title="isshin REEL 2022" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画2</span>isshin REEL 2022（isshin）。好きな所で一時停止してみてほしい。どこで止めても1枚の絵として成り立っている。詳しくは画編で扱う。<a class="yt" href="https://www.youtube.com/watch?v=8U-gCTEYxCA" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>物差しの限界</h2>
  <p>この物差しには限界がある。止めると崩れて見えるのに、動かすと気持ちいいコマがあるからだ。速い動きの途中のブレた絵、着地の直前で歪んだポーズ、カメラが大きく振れた瞬間の流れた背景。どれも静止画としては崩れている。それでも前後の流れの中では、その崩れが速さや勢いを生んでいる。1コマの完成度では測れない良さが、映像にはある。</p>

  <h2>定義を更新する</h2>
  <p>仕組みとしての定義、止めてもいい絵という物差し、その限界。この3つを踏まえて、このサイトでは良い映像をこう定義する。</p>
  <div class="pull">
    <p class="lab">このサイトの定義</p>
    <p class="q">良い映像は、どの要素にも「何を魅せたいか」の意図が設計されている。</p>
  </div>
  <p>大事なのは「どの要素にも」の部分だ。ジャンルによって、要素の重みは変わる。画が主役の作品もあれば、音が主役の作品もある。重みが小さいことと、意図がないことは別の話だ。脇役の要素が「なんとなく」「初期設定のまま」になっている映像は、見る人に小さな引っかかりを残しやすい。目立たない要素にまで理由が通っている映像は、全体として強くなる。</p>
  <p>偶然撮れた一瞬が良い、という反論もあるだろう。それでも、その一瞬を残し、その位置に置くと決めたのは作り手だ。意図は撮影の瞬間だけでなく、選ぶことと並べることにも宿る。</p>
  <p>ここで言う要素とは、本編を構成する6つ、画・動き・音・編集・合成・構成のことだ。良い映像の条件をこの6つに分け、1つずつ言葉にしていく。それがこのサイトのやり方である。</p>
</template>
<template id="body-intro-3">
  <h2>このサイトの立場：定義は物差しとして置く</h2>
  <p>0.1で、このサイトは良い映像をこう定義した。「良い映像は、どの要素にも『何を魅せたいか』の意図が設計されている。」この定義は、守るべき決まりとして置いたものではない。作品を見るとき、作るときに当てて測る物差しとして置いている。</p>
  <p>このサイトは「こう撮れ」「こう切れ」と指示しない。構図にも色にも編集にも、たくさんの型や定石がある。それらは紹介するが、使うかどうかは作り手が決める。判断の基準として最後に残るのは、その選択が「何を魅せたいか」に役立っているかどうかだ。作り手の自由を土台にするこの立場は、音楽理論の学習サイトSoundQuestの立ち位置に倣っている。</p>
  <p>ただ、映像の世界には反対側の考え方もある。決まった型やルールを先に覚え、それに沿って作る考え方だ。このサイトの立場をはっきりさせるために、ここでは型やルールで考える例を3つ見ておく。</p>

  <h2>例1：連続性編集のルール</h2>
  <p>撮影と編集の現場で広く共有されている基本のルールに、180度ルールと30度ルールがある。</p>
  <p>180度ルールは、2人の会話のような場面で、2人を結ぶ想定線（イマジナリーライン）の片側からだけ撮る、というものだ。線を越えて反対側から撮ると、画面の中で2人の左右が入れ替わり、見る人は誰がどちらを向いているのか一瞬分からなくなる。30度ルールは、同じ被写体を続けて映すとき、カメラの位置を30度以上変える、というものだ。角度の変化が小さいと、つなぎ目がジャンプカット（画面が飛んだように見えるつなぎ）に見えやすい。</p>
  <figure class="fig" aria-label="180度ルールの図：上から見た2人とカメラの位置">
    <svg viewBox="0 0 600 345" role="img">
      <rect x="0" y="0" width="600" height="165" fill="#F2F2F2"/>
      <text x="16" y="28" font-size="19">この側からなら、どこから撮ってもいい</text>
      <line x1="0" y1="165" x2="600" y2="165" stroke="#BF0000" stroke-width="3" stroke-dasharray="10 7"/>
      <text x="16" y="194" font-size="18" style="fill:#BF0000">イマジナリーライン</text>
      <circle cx="220" cy="165" r="24" fill="#000"/><text x="220" y="171" font-size="20" text-anchor="middle" style="fill:#fff">A</text>
      <circle cx="380" cy="165" r="24" fill="#000"/><text x="380" y="171" font-size="20" text-anchor="middle" style="fill:#fff">B</text>
      <g transform="translate(130,70) rotate(35)"><rect x="-18" y="-12" width="36" height="24" fill="#000"/><polygon points="18,-8 32,-14 32,14 18,8" fill="#000"/></g>
      <text x="86" y="122" font-size="18">カメラ1</text>
      <g transform="translate(470,70) rotate(145)"><rect x="-18" y="-12" width="36" height="24" fill="#000"/><polygon points="18,-8 32,-14 32,14 18,8" fill="#000"/></g>
      <text x="436" y="122" font-size="18">カメラ2</text>
      <g transform="translate(300,258) rotate(-90)"><rect x="-18" y="-12" width="36" height="24" fill="#fff" stroke="#BF0000" stroke-width="2.5"/><polygon points="18,-8 32,-14 32,14 18,8" fill="#fff" stroke="#BF0000" stroke-width="2.5"/></g>
      <line x1="280" y1="238" x2="320" y2="278" stroke="#BF0000" stroke-width="3"/><line x1="320" y1="238" x2="280" y2="278" stroke="#BF0000" stroke-width="3"/>
      <text x="300" y="330" font-size="18" text-anchor="middle" style="fill:#BF0000">線を越えると、AとBの左右が入れ替わる</text>
    </svg>
    <figcaption><span class="no">図1</span>180度ルールを上から見た図。カメラ1とカメラ2はどちらもAを左、Bを右に映す。線の反対側に置いたカメラでは、AとBの左右が逆になる。</figcaption>
  </figure>
  <p>どちらも、見る人が空間と動きの向きを見失わないためのルールだ。ドラマやCMの現場では、スタッフ同士の共通の前提になっている。映像の仕事に就きたい人は、まずここから覚えることになるだろう。詳しくは編集編で扱う。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/mJ0j74PCk04?rel=0" title="イマジナリーラインの基本" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>イマジナリーラインの基本（VideoAlpha Channel）。日本語の解説。<a class="yt" href="https://www.youtube.com/watch?v=mJ0j74PCk04" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>例2：ウォルター・マーチの6つのルール</h2>
  <p>映画編集者のウォルター・マーチは、著書『In the Blink of an Eye』(1995)で、理想のカットが満たす6つの条件を挙げ、それぞれに重みを付けた。</p>
  <figure class="fig" aria-label="ウォルター・マーチの6つのルールの重み">
    <svg viewBox="0 0 600 330" role="img">
      <text x="0" y="24" font-size="18" style="fill:#000">感情</text>
      <rect x="0" y="32" width="510" height="16" fill="#000"/>
      <text x="520" y="46" font-size="19" style="fill:#000">51%</text>
      <text x="0" y="76" font-size="18" style="fill:#000">物語</text>
      <rect x="0" y="84" width="230" height="16" fill="#BFBFBF"/>
      <text x="240" y="98" font-size="19" style="fill:#000">23%</text>
      <text x="0" y="128" font-size="18" style="fill:#000">リズム</text>

  <p>5%の「画面上の左右の位置関係」は、例1の180度ルールのことだ。ルールを体系立てて並べた本人が、現場で最も知られた型の重みを小さくし、その瞬間の感情を半分以上の重みで一番上に置いている。型を大事にする立場の中にも、最後に優先されるのは見る人に何を感じさせたいか、という考え方がある。このサイトの定義とも重なる部分だ。</p>

  </figure>

  <h2>例3：ドグマ95</h2>
  <p>1995年3月13日、デンマークの映画監督ラース・フォン・トリアーとトマス・ヴィンターベアは、パリで「ドグマ95」という映画運動を発表した。2人は「純潔の誓い」と呼ぶ10か条を自分たちに課した。撮影はロケのみでセットを持ち込まない、カメラは手持ち、映像と別に音を作らない、ジャンル映画は撮らない、監督の名前をクレジットしない、といった内容だ。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/lZg46C_wAUY?rel=0" title="Festen (1998) - Trailer HQ - DK Version" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画3</span>Festen (1998) - Trailer HQ - DK Version（Nimbus Film）。『セレブレーション』の予告編。制作会社による公開。手持ちカメラとロケ撮影の質感が分かる。<a class="yt" href="https://www.youtube.com/watch?v=lZg46C_wAUY" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>
  <p>ここでのルールは、誰かに守らされるものとして作られてはいない。豪華なセットや後付けの音楽に頼らない映画を撮るために、作り手が自分から選んだ縛りだ。ルールそのものが、一つの流派の主張になっている。しかも、作った本人たちも完全には守れていない。ヴィンターベアは『セレブレーション』の撮影中に窓を覆った（小道具と照明を足した）と告白しており、トリアーも『イディオッツ』で音楽を使っている。運動は2005年に終わった。</p>

  <h2>型とどう付き合うか</h2>
  <p>3つの例を並べると、型やルールの正体が見えてくる。どの型も、誰かが「見る人に何を伝えたいか」を考えた末に残した答えだ。180度ルールは「空間を迷わせない」ための答えで、ドグマ95は「飾りに頼らない」ための答えだった。</p>
  <p>だから、このサイトは型を否定しない。型は、先人が出した答えの集まりとして役に立つ。特に仕事で映像を作る場合、型は人と人をつなぐ共通言語になる。監督やクライアントと話すとき、「ここは線を越えてもいいですか」と言えるのは、全員が同じ型を知っているからだ。</p>
  <p>型を破るのも自由だ。ただ、破るときは、破ることで何を魅せたいのかを説明できるようにしておきたい。理由のある崩しと、知らずに崩れたものは、見る人には違って見えることが多い。型を知ったうえで、使うか破るかを自分で選ぶ。それがこのサイトの勧める付き合い方である。</p>
</template>
<template id="body-intro-4">
  <h2>映像には、そう作られている理由がある</h2>
  <p>0.3で、型は先人が出した答えの集まりだと書いた。この記事では、その答えを学ぶと作り手として何が変わるのかを考える。</p>
  <p>世の中の映像には、そう見える理由がある。作り手が意識していたかどうかは関係ない。たとえばインタビュー映像では、カメラの横にいる聞き手に向かって話す人を、画面の真ん中から少しずらし、顔が向いている側を広く空けて映すことが多い。視線の先に空間があると、画面が窮屈に見えにくく、見る人の目も話し手の視線に沿って流れる。構図の理論では、この空間をリードルーム（ルッキングルームとも）と呼ぶ。</p>
  <p>理論やセオリーは、こうした理由を言葉にして整理したものだ。何となく気持ちよく見えていた画面に、名前と理由が付く。</p>

  <h2>理由が分かると、自分の映像に使える</h2>
  <p>理由が分かると、それを自分の映像に持ち込める。しかも、元の場面とは違う場面にも当てはめられる。リードルームの理由が「視線や動きの先を空ける」ことだと分かっていれば、話す人だけでなく、走る車や、画面の外を指さす手にも同じ考え方が使える。</p>
  <p>逆に、あえて視線の先を詰めて、人物が追い詰められている感じを出すこともできる。理由を知っていれば、崩すときにも狙いを持てる。</p>

  <h2>言葉を知らないと、作れるものを想像しにくい</h2>
  <p>用語や語彙を知っていることには、もう一つ意味がある。知らない手法は、作るときの選択肢に上がってこない。</p>
  <p>編集の用語に、JカットとLカットがある。Jカットは、次の場面の音が映像より先に聞こえ始めるつなぎ方だ。Lカットはその逆で、前の場面の音が、映像が切り替わった後も残る。会話の場面で、相手の声が先に聞こえてから相手の顔に切り替わる、といった使い方をする。これを知らないうちは、映像と音を同じ位置で切ることしか思いつきにくい。名前を知ると、他人の作品の中でも見つけられるようになり、自分の編集で試せる手が一つ増える。詳しくは編集編で扱う。</p>
  <p>語彙は、頭の中で完成形を思い描くための部品のようなものだ。部品が多いほど、作る前に想像できる映像の幅が広がる。仕事の現場で用語が人と人をつなぐ共通言語になることは、0.3で触れた。</p>

  <h2>他人の作品をロジカルに読める</h2>
  <p>理論を学ぶうえでの一番の強みは、他人の作品をロジカルに考えられるようになることだ。</p>
  <p>理由と語彙がないうちは、良い作品を見ても「すごい」「かっこいい」で終わりやすい。理由と語彙があると、「ここで画より先に次の場面の音を入れている」「この人物は画面の右に寄せて、左を空けている」と、良さを分解できる。分解できたものは、自分の映像に持ち帰れる。</p>
  <p>参考になる映像は、世の中にいくらでもある。1本から持ち帰れる量が増えれば、見るたびに学べることが増えていく。好きな作品を見る時間が、そのまま勉強の時間になる。</p>

  <h2>理論を知ると、感覚が鈍るのか</h2>
  <p>理論を学ぶと、型にはまった映像しか作れなくなるのではないか、という心配もあるだろう。</p>
  <p>このサイトでは、理論を、感覚で「いい」と感じたものに後から理由を付ける道具として扱う。感覚で選んだ構図が、理論で説明できることは多い。説明できれば、その感覚を次の作品でも再現できる。理論で説明できないのに良いと感じるものがあれば、それは新しい発見として大事にすればいい。</p>
  <p>理論を学ばずに良い映像を作る人もいる。そうした人も、たくさんの映像を見るうちに、理由を言葉にしないまま体で覚えているのだろう、とこのサイトは考えている。理論は、その道のりを短くする手段の一つだ。</p>
  <p>何を使うかを決めるのは、0.3で書いたとおり作り手自身だ。理由を知ったうえで、自分の映像に何を持ち込むかを選ぶ。そのための材料を集めることが、理論を学ぶ意味である。</p>
</template>
<template id="body-intro-5">
  <h2>学ばずに作る、という選び方もある</h2>
  <p>0.4では、理論を学ぶ意味を書いた。ただ、このサイトは学ぶことも強制しない。今は理論を読まずに作り始め、作りながら困ったときに必要な記事だけを開く。それも一つのやり方だ。</p>
  <p>作りたいものがはっきりしているなら、先に1本作ってみると、自分が何を分かっていないのかが見えやすい。分からない所が見えてから読むと、記事の内容が自分の作品の話として入ってくる。</p>
  <p>どちらを選ぶかは、作り手が決めればいい。この記事では、どちらを選んだ人にも使える読み方を書く。</p>

  <h2>全部を一度に理解しなくていい</h2>
  <p>このサイトは序論を含めて9つの編に分かれ、それぞれの編がいくつかの章に分かれている。全部を順番に読み通す前提では作っていない。</p>
  <p>映像には、構図、色、動き、音、編集、合成、構成と、考えることが多い。全部を一度に頭に入れようとすると、どれも中途半端になりやすい。編と章に分けたのは、一度に抱える量を減らし、自分のペースで進められるようにするためだ。</p>
  <p>一度読んで分からなかった記事も、作品を何本か作った後に読み返すと、意味がつかめることがある。最初から全部を理解できなくていい。</p>

  <h2>詰まった所から読む</h2>
  <p>目次の順番に読む必要はない。今作っている作品で詰まっている所があれば、その章から開いていい。</p>
  <p>たとえば動きがカクカクして見えるなら、動き編のイージングや、準備編のコマとfpsの章から読めばいい。記事の中でほかの章の話が出てくるときは、どの章で扱っているかを書いてある。分からない言葉が出てきたら、そこだけ戻ればいい。</p>

  <h2>1記事で区切る</h2>
  <p>このサイトの記事は、1記事で1つのテーマだけを扱う。どの記事も数分で読める長さにしてあり、記事の上に読む時間の目安を書いている。</p>
  <p>1記事読んだら、そこでやめていい。何記事も続けて読むより、読んだことを次の作品で一つ試すほうが身につく、とこのサイトは考えている。</p>
  <p>記事の最後には「続けて読む」として、関係する記事を挙げている。続きを読みたくなったときの入口に使えばいい。</p>

  <h2>困りごと索引の使い方</h2>
  <p>何が原因で詰まっているのか、自分でもはっきりしないことがある。「なんか安っぽく見える」「なんか退屈に感じる」のような、言葉にしにくい違和感だ。</p>
  <p>そういうときは、トップの黒い帯にある「困りごとから探す」を開く。理論の順番とは別に、作品の症状から関係する章を引けるようにしてある。たとえば「なんか退屈に感じる」には、編集編のテンポの章と、構成編のフックの章を挙げている。</p>
  <p>灰色の章は、まだ章立てだけで本文がない。本文は少しずつ増やしていく。言葉の意味だけを知りたいときは、同じ帯にある用語索引を使う。</p>

<script>

var FLAT=[],BY={};
PARTS.forEach(function(p,pi){

var firstHome=true;

function chRow(a){
  return '<li><a class="'+(a.pub?"pub":"draft")+'" href="#'+a.id+'"><span class="n">'+a.num+'</span><span class="t">'+esc(a.title)+'<span class="s">'+esc(a.sub)+'</span></span><span class="st">'+(a.pub?"本文あり":"章立てのみ")+'</span></a></li>';
}

}
var FOOT='<footer><div class="wrap">'+FLAT.length+'章のうち '+FLAT.filter(function(a){return a.pub}).length+'章に本文あり。ほかの章は章立てと概要を先に載せ、本文を順次追加する。</div></footer>';

}

    h+='<ol class="outline">'+a.outline.map(function(o){return '<li>'+esc(o)+'</li>'}).join("")+'</ol><p class="note">章立てと概要から、読みたい内容の当たりを付けられる。</p>';
  }
  h+='<nav class="prevnext" aria-label="前後の章">'+(pv?'<a href="#'+pv.id+'"><small>前の章　'+pv.num+'</small><b>'+esc(pv.title)+'</b></a>':'<span></span>')+
     (nx?'<a class="nx" href="#'+nx.id+'"><small>次の章　'+nx.num+'</small><b>'+esc(nx.title)+'</b></a>':'<span></span>')+'</nav></main>'+FOOT;
  app.innerHTML=h;
  if(a.pub)document.getElementById("body").appendChild(document.getElementById(a.body).content.cloneNode(true));
}
function lk(id){var a=BY[id];return '<a class="'+(a.pub?"":"draft")+'" href="#'+a.id+'"><span class="sw" style="background:'+a.part.c+'"></span>'+a.num+' '+esc(a.title)+'</a>'}
function viewTroubles(){
  app.innerHTML=topBar(null,null)+'<main class="wrap idx"><h1>困りごとから探す</h1><p>理論の順番ではなく、作品で詰まっている症状から章を引く。灰色の章は、まだ章立てだけ。</p>'+
   '<ul class="tr">'+TROUBLES.map(function(t){return '<li><span class="q">'+esc(t.q)+'</span><span class="ls">'+t.l.map(lk).join("")+'</span></li>'}).join("")+'</ul></main>'+FOOT;
}
function viewGlossary(){
  app.innerHTML=topBar(null,null)+'<main class="wrap idx"><h1>用語索引</h1><p>章の中で使う言葉の、最小限の定義。詳しくは各章で扱う。</p>'+
   '<dl class="gl">'+GLOSSARY.map(function(g){var a=BY[g.l];return '<div><dt>'+esc(g.t)+'</dt><dd>'+esc(g.d)+'<a href="#'+a.id+'">'+a.num+' '+esc(a.title)+'</a></dd></div>'}).join("")+'</dl></main>'+FOOT;
}
function route(){go((location.hash||"#top").slice(1))}
function go(h){
  var part=PARTS.filter(function(p){return p.id===h})[0];
  if(BY[h])viewArticle(BY[h]); else if(part)viewPart(part);
  else if(h==="troubles")viewTroubles(); else if(h==="glossary")viewGlossary(); else viewHome();
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
addEventListener("popstate",route);
/* プレビュー画面などハッシュ移動が効かない環境でも、サイト内リンクで画面を切り替える */
document.addEventListener("click",function(e){
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  var a=e.target.closest?e.target.closest('a[href^="#"]'):null; if(!a)return;
  var h=a.getAttribute("href").slice(1)||"top";
  e.preventDefault(); go(h);
  try{history.pushState(null,"","#"+h)}catch(err){}
});
route();
})();
</script>
</body>
</html>
