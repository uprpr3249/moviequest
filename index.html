<body>
<div id="app"></div>
<template id="body-intro-1">
  <h2>映像は、静止画の連続である</h2>
  <p>まず仕組みの話から始める。映像とは、静止画の連続である。フィルムのコマ、動画ファイルのフレーム、パラパラ漫画のページ。形は違っても、止まった絵を高速で切り替えることで「動いて見える」という点は共通している。パラパラ漫画は、1枚1枚はただの絵なのに、めくる速さが上がった瞬間にキャラクターが走り出す。映像の出発点は、静止画の集まりが時間の中で動きに変わる、この仕組みにある。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/heRuLp7CyTM?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="The horse in motion (Eadweard Muybridge) 1878" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>The horse in motion (Eadweard Muybridge) 1878（Channel Stop）。1878年、マイブリッジが走る馬を連続写真で撮り、それを順に切り替えた映像。1枚ずつはただの写真だ。<a class="yt" href="https://www.youtube.com/watch?v=heRuLp7CyTM" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>
  <p>ただし、これは仕組みの定義にすぎない。監視カメラの映像も名作映画も、仕組みの上ではどちらも静止画の連続だ。この定義だけでは、良い映像とそうでない映像の違いを説明できない。その違いを言葉にすることが、このサイト全体の仕事になる。</p>

  <h2>物差し：どこで止めても、いい絵になる</h2>
  <p>良い映像を見分ける物差しとして、このサイトでは次の目安を使う。<strong>良い映像は、どこで一時停止しても、いい絵になっている。</strong></p>
  <p>乱暴な基準に見えるが、使い道は広い。どのコマで止めても絵になっているなら、構図、色、被写体の置き方といった1枚の絵としての設計が、偶然に頼らず作られていることになる。止めるたびに中途半端な絵が出てくる映像は、1コマごとの設計を運に任せていることが多い。</p>
  <p>作り手にとっても、この物差しはすぐ使える。自分の映像を適当な場所で止めて、そこが1枚の絵として見られるかを確かめる。それだけで、直すべき場所がかなり見えてくる。詳しい使い方は画編で扱う。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/8U-gCTEYxCA?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="isshin REEL 2022" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画2</span>isshin REEL 2022（isshin）。好きな所で一時停止してみてほしい。どこで止めても1枚の絵として成り立っている。詳しくは画編で扱う。<a class="yt" href="https://www.youtube.com/watch?v=8U-gCTEYxCA" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>物差しの限界</h2>
  <p>この物差しには限界がある。止めると崩れて見えるのに、動かすと気持ちいいコマがあるからだ。速い動きの途中のブレた絵、着地の直前で歪んだポーズ、カメラが大きく振れた瞬間の流れた背景。どれも静止画としては崩れている。それでも前後の流れの中では、その崩れが速さや勢いを生んでいる。1コマの完成度では測れない良さが、映像にはある。</p>

  <h2>定義を更新する</h2>
  <p>仕組みとしての定義、止めてもいい絵という物差し、その限界。この3つを踏まえて、このサイトでは良い映像をこう定義する。</p>
  <div class="pull">
    <p class="lab">このサイトの定義</p>
    <p class="q">良い映像は、どの要素にも「何を魅せたいか」の意図が設計されている。</p>
  </div>
  <p>大事なのは「どの要素にも」の部分だ。ジャンルによって、要素の重みは変わる。画が主役の作品もあれば、音が主役の作品もある。重みが小さいことと、意図がないことは別の話だ。脇役の要素が「なんとなく」「初期設定のまま」になっている映像は、見る人に小さな引っかかりを残しやすい。目立たない要素にまで理由が通っている映像は、全体として強くなる。</p>
  <p>偶然撮れた一瞬が良い、という反論もあるだろう。それでも、その一瞬を残し、その位置に置くと決めたのは作り手だ。意図は撮影の瞬間だけでなく、選ぶことと並べることにも宿る。</p>
  <p>ここで言う要素とは、本編を構成する6つ、画・動き・音・編集・合成・構成のことだ。良い映像の条件をこの6つに分け、1つずつ言葉にしていく。それがこのサイトのやり方である。</p>
</template>
<template id="body-intro-3">
  <h2>このサイトの立場：定義は物差しとして置く</h2>
  <p>0.1で、このサイトは良い映像をこう定義した。「良い映像は、どの要素にも『何を魅せたいか』の意図が設計されている。」この定義は、守るべき決まりとして置いたものではない。作品を見るとき、作るときに当てて測る物差しとして置いている。</p>
  <p>このサイトは「こう撮れ」「こう切れ」と指示しない。構図にも色にも編集にも、たくさんの型や定石がある。それらは紹介するが、使うかどうかは作り手が決める。判断の基準として最後に残るのは、その選択が「何を魅せたいか」に役立っているかどうかだ。作り手の自由を土台にするこの立場は、音楽理論の学習サイトSoundQuestの立ち位置に倣っている。</p>
  <p>ただ、映像の世界には反対側の考え方もある。決まった型やルールを先に覚え、それに沿って作る考え方だ。このサイトの立場をはっきりさせるために、ここでは型やルールで考える例を3つ見ておく。</p>

  <h2>例1：連続性編集のルール</h2>
  <p>撮影と編集の現場で広く共有されている基本のルールに、180度ルールと30度ルールがある。</p>
  <p>180度ルールは、2人の会話のような場面で、2人を結ぶ想定線（イマジナリーライン）の片側からだけ撮る、というものだ。線を越えて反対側から撮ると、画面の中で2人の左右が入れ替わり、見る人は誰がどちらを向いているのか一瞬分からなくなる。30度ルールは、同じ被写体を続けて映すとき、カメラの位置を30度以上変える、というものだ。角度の変化が小さいと、つなぎ目がジャンプカット（画面が飛んだように見えるつなぎ）に見えやすい。</p>

  <h2>例3：ドグマ95</h2>
  <p>1995年3月13日、デンマークの映画監督ラース・フォン・トリアーとトマス・ヴィンターベアは、パリで「ドグマ95」という映画運動を発表した。2人は「純潔の誓い」と呼ぶ10か条を自分たちに課した。撮影はロケのみでセットを持ち込まない、カメラは手持ち、映像と別に音を作らない、ジャンル映画は撮らない、監督の名前をクレジットしない、といった内容だ。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/lZg46C_wAUY?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="Festen (1998) - Trailer HQ - DK Version" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>

  </figure>
  <p>ここでのルールは、誰かに守らされるものとして作られてはいない。豪華なセットや後付けの音楽に頼らない映画を撮るために、作り手が自分から選んだ縛りだ。ルールそのものが、一つの流派の主張になっている。しかも、作った本人たちも完全には守れていない。ヴィンターベアは『セレブレーション』の撮影中に窓を覆った（小道具と照明を足した）と告白しており、トリアーも『イディオッツ』で音楽を使っている。運動は2005年に終わった。</p>

  <h2>型とどう付き合うか</h2>
  <p>3つの例を並べると、型やルールの正体が見えてくる。どの型も、誰かが「見る人に何を伝えたいか」を考えた末に残した答えだ。180度ルールは「空間を迷わせない」ための答えで、ドグマ95は「飾りに頼らない」ための答えだった。</p>
  <p>だから、このサイトは型を否定しない。型は、先人が出した答えの集まりとして役に立つ。特に仕事で映像を作る場合、型は人と人をつなぐ共通言語になる。監督やクライアントと話すとき、「ここは線を越えてもいいですか」と言えるのは、全員が同じ型を知っているからだ。</p>
  <p>型を破るのも自由だ。ただ、破るときは、破ることで何を魅せたいのかを説明できるようにしておきたい。理由のある崩しと、知らずに崩れたものは、見る人には違って見えることが多い。型を知ったうえで、使うか破るかを自分で選ぶ。それがこのサイトの勧める付き合い方である。</p>
</template>
<template id="body-intro-4">
  <h2>映像には、そう作られている理由がある</h2>
  <p>0.3で、型は先人が出した答えの集まりだと書いた。この記事では、その答えを学ぶと作り手として何が変わるのかを考える。</p>
  <p>世の中の映像には、そう見える理由がある。作り手が意識していたかどうかは関係ない。たとえばインタビュー映像では、カメラの横にいる聞き手に向かって話す人を、画面の真ん中から少しずらし、顔が向いている側を広く空けて映すことが多い。視線の先に空間があると、画面が窮屈に見えにくく、見る人の目も話し手の視線に沿って流れる。構図の理論では、この空間をリードルーム（ルッキングルームとも）と呼ぶ。</p>
  <p>理論やセオリーは、こうした理由を言葉にして整理したものだ。何となく気持ちよく見えていた画面に、名前と理由が付く。</p>

  <h2>理由が分かると、自分の映像に使える</h2>
  <p>理由が分かると、それを自分の映像に持ち込める。しかも、元の場面とは違う場面にも当てはめられる。リードルームの理由が「視線や動きの先を空ける」ことだと分かっていれば、話す人だけでなく、走る車や、画面の外を指さす手にも同じ考え方が使える。</p>
  <p>逆に、あえて視線の先を詰めて、人物が追い詰められている感じを出すこともできる。理由を知っていれば、崩すときにも狙いを持てる。</p>

  <h2>言葉を知らないと、作れるものを想像しにくい</h2>
  <p>用語や語彙を知っていることには、もう一つ意味がある。知らない手法は、作るときの選択肢に上がってこない。</p>
  <p>編集の用語に、JカットとLカットがある。Jカットは、次の場面の音が映像より先に聞こえ始めるつなぎ方だ。Lカットはその逆で、前の場面の音が、映像が切り替わった後も残る。会話の場面で、相手の声が先に聞こえてから相手の顔に切り替わる、といった使い方をする。これを知らないうちは、映像と音を同じ位置で切ることしか思いつきにくい。名前を知ると、他人の作品の中でも見つけられるようになり、自分の編集で試せる手が一つ増える。詳しくは編集編で扱う。</p>
  <p>語彙は、頭の中で完成形を思い描くための部品のようなものだ。部品が多いほど、作る前に想像できる映像の幅が広がる。仕事の現場で用語が人と人をつなぐ共通言語になることは、0.3で触れた。</p>

  <h2>他人の作品をロジカルに読める</h2>
  <p>理論を学ぶうえでの一番の強みは、他人の作品をロジカルに考えられるようになることだ。</p>
  <p>理由と語彙がないうちは、良い作品を見ても「すごい」「かっこいい」で終わりやすい。理由と語彙があると、「ここで画より先に次の場面の音を入れている」「この人物は画面の右に寄せて、左を空けている」と、良さを分解できる。分解できたものは、自分の映像に持ち帰れる。</p>
  <p>参考になる映像は、世の中にいくらでもある。1本から持ち帰れる量が増えれば、見るたびに学べることが増えていく。好きな作品を見る時間が、そのまま勉強の時間になる。</p>

  <h2>理論を知ると、感覚が鈍るのか</h2>
  <p>理論を学ぶと、型にはまった映像しか作れなくなるのではないか、という心配もあるだろう。</p>
  <p>このサイトでは、理論を、感覚で「いい」と感じたものに後から理由を付ける道具として扱う。感覚で選んだ構図が、理論で説明できることは多い。説明できれば、その感覚を次の作品でも再現できる。理論で説明できないのに良いと感じるものがあれば、それは新しい発見として大事にすればいい。</p>
  <p>理論を学ばずに良い映像を作る人もいる。そうした人も、たくさんの映像を見るうちに、理由を言葉にしないまま体で覚えているのだろう、とこのサイトは考えている。理論は、その道のりを短くする手段の一つだ。</p>
  <p>何を使うかを決めるのは、0.3で書いたとおり作り手自身だ。理由を知ったうえで、自分の映像に何を持ち込むかを選ぶ。そのための材料を集めることが、理論を学ぶ意味である。</p>

  <h2>映像の誕生：カメラ固定・ワンショットの時代</h2>
  <p>映画の始まりとしてよく挙げられるのは、1895年12月28日、パリのグラン・カフェの地下「インドの間」で、リュミエール兄弟がシネマトグラフを使って行った有料の上映だ。それより少し前、アメリカではエジソンの会社がキネトスコープを作っていた。箱の穴をのぞいて見る装置で、1893年に公開の場で披露され、1894年から商売として広がった。</p>
  <p>この時代の映画は、カメラを固定し、1つの出来事を1カットで撮るものが中心だった。工場から出てくる人々、駅に着く列車。動く写真であること自体が見世物だった。</p>

    <div class="frame"><iframe src="https://www.youtube.com/embed/1FAj9fJQRZA?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="The Arrival of a Train at La Ciotat Station 4K Scan" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画1</span>[Actual 4K Scan] The Arrival of a Train at La Ciotat Station（Andy Myers）。リュミエール兄弟『列車の到着』を高画質でスキャンしたもの。カメラは固定のまま、1カットで列車が駅に入ってくる。<a class="yt" href="https://www.youtube.com/watch?v=1FAj9fJQRZA" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>

  <h2>編集とモンタージュの発見</h2>
  <p>やがて、複数のカットをつないで1つの話を語る作り方が生まれる。アメリカのエドウィン・S・ポーターが撮った『大列車強盗』（1903年）は、場所の違うカットをつないで、強盗から追跡までの出来事を途切れずに見せた。ブリタニカ百科事典は、動作の連続性を確立した最初の物語映画と評している。続いてD・W・グリフィスが、離れた場所の出来事を交互に見せるクロスカッティングや、クロースアップを物語の中で使いこなし、『国民の創生』（1915年）などで編集の力を広く知らしめた。どちらの技法も、彼らが最初に使ったかどうかについては諸説ある。</p>
  <figure class="ref">
    <div class="frame"><iframe src="https://www.youtube.com/embed/VRwiwXgN7n0?rel=0&amp;enablejsapi=1&amp;controls=0&amp;disablekb=1&amp;playsinline=1&amp;iv_load_policy=3&amp;fs=0" title="The Great Train Robbery (1903)" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <figcaption><span class="no">動画2</span>The Great Train Robbery (1903) - Remastered HD 1080P（Classic Cinema HD）。『大列車強盗』全編、約12分。場所の違うカットがつながって、出来事が途切れずに進む。<a class="yt" href="https://www.youtube.com/watch?v=VRwiwXgN7n0" target="_blank" rel="noopener">YouTubeで開く</a></figcaption>
  </figure>
  <p>1910年代末から1920年代のソ連では、クレショフやエイゼンシュテインが、カットの並びが意味を生むことを理論として考えた。エイゼンシュテイン『戦艦ポチョムキン』（1925年）のオデッサの階段の場面がよく知られている。詳しくは編集編の「歴史：編集の発見」で扱う。</p>

  <h2>サイレントの完成：チャップリン</h2>
  <p>音のない時代に、映画は動きと表情と編集だけで笑いや感情を伝える方法を磨いた。その代表がチャップリンだ。『キッド』（1921年）、『黄金狂時代』（1925年）などで、セリフなしで伝わる演技と構成を見せた。トーキーが広がった後も、『街の灯』（1931年）を、音楽と効果音だけでセリフのない作品として作っている。</p>

  <h2>ゴールは「作れるようになる」側に置く</h2>
  <p>このサイトのゴールは、理論を覚えきることに置いていない。自分が作りたい映像を、前より意図を持って作れるようになることに置いている。そのため、全編を読み終えることを目標にする必要はない。</p>
  <p>まず自分の作るジャンルを決め、そのジャンルで必要になる章から読む。読んだら1本作り、詰まった所でまた戻ってくる。この往復を繰り返すのが、このサイトの想定している使い方だ。</p>

  <h2>ジャンル別の読む順番の例</h2>
  <p>以下は例で、順番を決めるものではない。</p>
  <ul>
    <li>Vlog：画編の構図 → 編集編のテンポ → 音編の雰囲気と沈黙 → 応用編A</li>
    <li>文字PV：画編の文字とタイポグラフィ → 音編のタイミングと音ハメ → 動き編のイージング → 応用編B</li>
    <li>モーショングラフィックス：画編のデザインとスタイルフレーム → 画編の色 → 動き編のイージング → 応用編C</li>
    <li>ゆっくり実況：構成編のフック → 音編の音の情報量 → 画編の文字とタイポグラフィ → 応用編D</li>

  </ul>

<template id="body-prep-1">
  <h2>コマ（フレーム）とは何か</h2>
  <p>0.1で、映像は静止画の連続だと書いた。その1枚1枚の静止画を、コマまたはフレームと呼ぶ。映像の時間は、このコマの積み重ねでできている。編集で「1フレームずらす」と言うとき、それは映像の時間の最小単位を1つ動かすことを指す。</p>

  <h2>fpsの数字と見え方の違い</h2>
  <p>1秒間に何コマを見せるかを、fps（frames per second）で表す。映画は24fps、日本のテレビ放送は約30fps（正確には29.97fps）、ゲームの実況や滑らかさを重視する映像では60fpsがよく使われる。</p>
  <p>数字が大きいほど動きは滑らかになるが、滑らかなほど良いとは限らない。24fpsの映像に映画らしさを感じる人は多く、60fpsにすると同じ素材が生々しく、ビデオらしく見えることがある。fpsは画質の設定であると同時に、作品の質感を選ぶ設定でもある。</p>
  <p>作業の途中でfpsが混ざると、動きがカクついたり、音とずれたりしやすい。作り始める前に、プロジェクトのfpsを1つに決めておく。</p>

  <h2>アニメの「〇コマ打ち」との関係</h2>
  <p>日本のアニメでは、24fpsの中で同じ絵を2コマ続けて見せる「2コマ打ち」、3コマ続ける「3コマ打ち」がよく使われる。2コマ打ちなら、1秒に描く絵は12枚になる。</p>
  <p>コマ打ちは手間を減らすためだけのものではない。速い動きは1コマ打ちで滑らかに、溜めの場面は3コマ打ちでかっちりと見せるように、動きの質感を変える手段にもなる。モーショングラフィックスや3DCGで、あえてコマを落として手描きのような感触を出す作り方も、同じ考え方の上にある。詳しくは動き編で扱う。</p>
</template>

<template id="body-prep-2">
  <h2>解像度と画質の関係</h2>
  <p>解像度は、1コマが縦横何個の点（ピクセル）でできているかを表す。1920×1080がフルHD、3840×2160が4Kと呼ばれる。点の数が多いほど細かい所まで描けるが、ファイルは重くなり、書き出しや編集にも時間がかかる。</p>
  <p>画質は解像度だけでは決まらない。同じフルHDでも、圧縮の強さ（ビットレート）や撮影時のピントで、見え方は大きく変わる。投稿先で再圧縮されることも考えて、どこまでの解像度が必要かを決める。</p>

  <h2>アスペクト比の種類と印象</h2>
  <p>アスペクト比は画面の横と縦の比率だ。今の動画で一番多いのは16:9。古いテレビは4:3で、映画には2.39:1前後の横長のシネマスコープがある。</p>

  <p>スマホで見るショート動画は、16:9を縦にした9:16が標準になっている。縦型では、横に並べる構図が取りにくい代わりに、人物の全身や、上から下への動きが収めやすい。</p>
  <p>もう一つの前提は、画面の上下にアプリのボタンや説明文が重なることだ。大事な文字や顔を、重なる位置に置かないようにする。横長で撮った素材を縦に切り出すと、構図が崩れやすい。縦で見せる作品は、撮る段階から縦で考えておく。構図の考え方は画編で扱う。</p>

  <p>被写体のどこが明るく、どこに影が落ちるかは、光の向きで決まる。正面からの光は影が少なく平らに見え、横からの光は凹凸が強調され、後ろからの光は輪郭が光る。</p>

  <p>カメラのホワイトバランスは、この色温度に合わせて白を白く写すための設定だ。撮影場所が変わるたびに色味がずれるのは、色温度が違うからである。逆に、あえてオレンジ寄りや青寄りに振って、時間帯や気分を伝えることもできる。</p>

  <p>同じ高さ、同じ大きさの音でも、ピアノと声は聞き分けられる。この違いを音色と呼ぶ。音色は、基本の高さの上に重なっている細かな成分の混ざり方で決まる。</p>
  <p>音MADで素材の声を楽器のように使えるのも、声が音色を持っているからだ。効果音を選ぶときも、大きさや高さに加えて、画面の質感に合う音色かどうかを見る。</p>

  <p>音楽には一定の間隔で刻まれる拍がある。1分間の拍の数をBPMと呼ぶ。BPM120なら、1拍は0.5秒だ。音ハメの最初の一歩は、使う曲のBPMを知り、編集ソフトのタイムラインに拍の位置の印（マーカー）を打つことだ。</p>

  <p>カットには2つの意味がある。1つは、カメラが回り始めてから止まるまでの一続きの映像のこと。もう1つは、その映像を編集で切る行為のことだ。編集でカットするとは、素材の中から見せる時間を選び、見せない時間を捨てることである。</p>

<template id="body-composite-1">
  <h2>レイヤー構造で画を考える</h2>
  <p>コンポジットとは、複数の素材を重ねて1つの画を作ることだ。背景、被写体、文字、光の効果。それぞれを別の層（レイヤー）として持ち、上から順に重ねる。紙に描いた絵を透明なシートに分けて重ねるのに近い。</p>
  <p>レイヤーに分けておくと、後から1つの要素だけを動かしたり、色を変えたりできる。画を1枚の絵として見るだけでなく、何層でできているかで考える習慣が、合成の入口になる。</p>

  <h2>描画モードの基礎</h2>
  <p>上のレイヤーを下のレイヤーにどう混ぜるかを、描画モード（ブレンドモード）と呼ぶ。基本の「通常」は上の画で下を覆う。「スクリーン」は明るい所だけを足すので、光や炎の素材を重ねるのに向く。「乗算」は暗い所だけを残すので、影や汚れを重ねるのに向く。</p>
  <p>描画モードは多くの種類があるが、まず「明るくする系」と「暗くする系」があると押さえれば、どれを選ぶか当たりを付けやすい。</p>

  <h2>合成が浮くとき何が起きているか</h2>
  <p>合成した素材が浮いて見えるとき、原因はたいてい、素材と背景の何かがそろっていないことにある。光の向き、色味、明るさの幅、ピントやボケ、ノイズの量、動き方。どれか1つがずれるだけで、目は違和感を拾う。</p>
  <p>浮いていると感じたら、この項目を1つずつ見比べて、ずれている所を探す。光と色の言葉は準備編の「色と光の最低限」、切り抜きの境目は次の章「マスクとキーイング」で扱う。</p>

<template id="body-composite-2">
  <h2>マスクの考え方</h2>
  <p>マスクは、レイヤーのどこを見せて、どこを隠すかを決める型紙だ。白い所が見え、黒い所が隠れ、灰色の所は半透明になる、と考えると分かりやすい。手で形を描いて切り抜くマスクは、動く被写体に合わせて形を少しずつ変えていく作業（ロトスコープ）になることもある。</p>

  <h2>クロマキーとルミナンスキー</h2>
  <p>色や明るさを手がかりに、自動で切り抜く方法をキーイングと呼ぶ。グリーンバックやブルーバックの前で撮り、その色だけを抜くのがクロマキーだ。緑や青が使われるのは、人の肌の色から遠く、分けやすいからである。明るさで抜くのがルミナンスキーで、黒い背景の炎や煙の素材を抜くときなどに使う。</p>
  <p>キーイングのきれいさは、撮影の段階でほぼ決まる。背景にむらなく光が当たっていること、被写体と背景の距離が離れていること、被写体に背景と同じ色が入っていないこと。後からの調整で取り返せる量には限りがある。</p>

  <h2>境界の処理で自然さが決まる</h2>
  <p>切り抜いた素材が自然に見えるかどうかは、境界、つまり輪郭の扱いで大きく変わる。境界がくっきりしすぎると切り紙のように見え、ぼかしすぎると被写体が溶けて見える。髪の毛のような細かい部分や、動きでブレた部分は特に難しい。</p>
  <p>グリーンバックの緑が被写体の縁に映り込む「色かぶり」を消す処理（スピル除去）も、境界の自然さに関わる。</p>

  <p>トラッキングは、映像の中の動きを読み取り、別の素材をその動きに追従させる技術だ。ポイントトラッキングでは、画面の中のはっきりした点（模様の角や小さな印）を選び、その点がコマごとにどこへ動いたかをソフトに追わせる。読み取った動きを文字や画像に当てると、映像の中に貼り付いたように動く。</p>

  <p>カメラトラッキングは、たくさんの点の動きから、撮影したカメラがどう動いたかを空間ごと計算する技術だ。カメラの動きが分かれば、3DCGの物体を実写の空間に置いたように合成できる。マッチムーブとも呼ばれる。</p>

  <p>トラッキングがずれる原因には、追う点がはっきりしない、点が画面の外に出る・何かに隠れる、動きが速くてブレている、といったものがある。撮影の段階で、追いやすい印を置いておく、シャッタースピードを上げてブレを減らす、といった準備が効果を持つ。</p>

  <h2>トリック撮影の発明</h2>

  <p>メリエスの『月世界旅行』（1902年）は、ロケットが月の顔に刺さる場面で知られ、セット、絵、トリックを組み合わせて、現実にない世界を画面に作り出した。</p>

  <p>その後、複数のフィルムを光学的に重ねるオプチカル・プリンターや、ブルーバックでの合成が、映画の特撮を支えた。</p>

  <p>1990年代以降、フィルムの合成はコンピュータの上のデジタル合成に置き換わった。それでも、レイヤーを重ねる、マスクで隠す、色や明るさで抜くという考え方は、メリエスやオプチカル合成の時代の延長にある。After Effectsのレイヤーも、二重露光と型紙の考え方を、誰でも扱える形にしたものだと言える。</p>

  <h2>魅せたいものを1文で言う</h2>
  <p>構成は、作品で何を魅せたいかを決めることから始まる。0.1の定義で言えば、全ての要素が向かう先を決める作業だ。編集編がカット単位の時間の設計なら、構成編は作品全体の時間の設計である。</p>

  <h2>盛る要素と捨てる要素</h2>
  <p>魅せたいものが決まると、素材の中から盛る要素と捨てる要素を選べるようになる。撮った素材や思いついたアイデアが良くても、魅せたいものにつながらないなら削る。削った分、残した要素が目立つ。</p>
  <p>捨てるのが惜しい素材は、別の作品のために取っておけばいい。1本の作品に全部を入れなくてよい。</p>

  <p>何を魅せるかは、ジャンルによって出発点が違う。Vlogでは日常のどこを切り取るか、文字PVでは曲のどの言葉を立てるか、切り抜きでは長い元動画のどの瞬間を選ぶか。応用編の各ジャンルの1章目で、そのジャンルで何を魅せるかを扱う。</p>

<template id="body-structure-2">
  <h2>フックの役割</h2>
  <p>フックは、作品の冒頭で見る人の注意をつかむ仕掛けだ。どれだけ後半が良くても、最初の数秒で離れられたら、その良さは届かない。ネット動画では、見る人は一覧の中から次々に動画を試すので、冒頭で残ってもらえるかが特に重要になる。縦型ショートでは、その時間がさらに短くなる。</p>

  <h2>最初に見せるのは一番いい所か</h2>
  <p>冒頭に作品の一番の見せ場を持ってくる作り方がある。結末やクライマックスを先に少し見せ、「どうしてこうなったのか」と思わせてから最初に戻る方法だ。切り抜きや解説動画でよく使われる。</p>
  <p>ただ、一番いい所を最初に出し切ると、後半の驚きが弱くなることもある。冒頭で見せるのは、見せ場そのものより、見せ場への期待や疑問の方がよい場合もある。何を魅せたいかによって選ぶ。</p>

  <h2>ジャンル別のフックの型</h2>
  <p>ジャンルによって使われやすいフックの形は違う。解説やゆっくり実況では、最初に問いを投げる。切り抜きでは、一番面白い発言を先に見せる。文字PVやMVでは、最初の1画面の絵の強さと、曲の入りで引き込む。Vlogでは、その日の一番いい景色を最初に見せる。自分のジャンルの再生数の多い作品の、最初の5秒を比べてみると、型が見えてくる。</p>

<template id="body-structure-3">

  <p>起承転結は、導入（起）、展開（承）、転換（転）、結末（結）の4つで話を組み立てる型だ。もとは漢詩の構成から来た言葉とされる。映像でも、何を見せる作品かを伝え、それを広げ、予想外のことを起こし、着地させる、という流れとして使える。</p>
  <p>ほかにも、序破急や、映画脚本で使われる三幕構成などの型がある。型があると、素材をどの順番に並べればいいか迷ったときの出発点になる。</p>

  <h2>情報を小出しにする効果</h2>
  <p>同じ素材でも、情報を出す順番で面白さは変わる。答えを先に言うか、後で言うか。全部を一度に見せるか、少しずつ見せるか。見る人が「次はどうなるのか」と思っている間は、作品から離れにくい。</p>
  <p>小出しにしすぎると、見る人は何の話か分からずに離れてしまう。何を先に渡し、何を後に取っておくかの釣り合いを決めることが、情報の出し方の設計である。</p>

  <h2>型を外すときの判断</h2>
  <p>型どおりに作ると、分かりやすい代わりに、先が読めることもある。転をあえて置かない、結を見せずに終える、といった外し方で、余韻や驚きを作れる。0.3で書いたとおり、型を外すなら、外すことで何を魅せたいのかを説明できるようにしておきたい。</p>

  <p>後から録るナレーションは、静かな部屋で、マイクとの距離を一定にして録る。部屋の反響が大きいと声がこもるので、布の多い場所で録ると良い。原稿を書いておくと言い直しが減るが、読み上げ調になりすぎない方がVlogには合うことが多い。</p>

  <h2>BGMと声のバランス</h2>
  <p>声が入っている間は、BGMを下げて声を立てる。声がない所ではBGMや現場音を上げて、空気を伝える。優先順位の考え方は音編の「音の情報量」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>撮影中は気にならなかった風の音や空調の音が、編集で目立つことがある。撮影の合間にイヤホンで音を確認すると、帰ってから気づくことが減る。BGMの権利については、使う音源の利用規約を確認する。</p>
</template>

<template id="body-vlog-5">
  <h2>素材を見て使う所を選ぶ</h2>
  <p>編集は、撮った素材を全部見返して、使える所に印を付けることから始まる。最初に決めた「何を見せたいか」に照らして、残す場面と捨てる場面を分ける。全部を時系列に並べるより、見せたいものにつながる場面を軸にした方が、まとまりやすい。</p>

  <h2>ジャンプカットとテンポ</h2>
  <p>話している途中の言いよどみや、移動中の何も起きない時間を切って詰めると、同じ構図のまま時間が飛ぶジャンプカットになる。Vlogでは、ジャンプカットをテンポを出す手段として使うことが多い。カットのつなぎ方は編集編の「カットとつなぎ」で扱っている。</p>

  <h2>Bロールで間をつなぐ</h2>
  <p>ジャンプカットが続きすぎると、画面が細かく飛んで落ち着かない。話の間にBロールを挟むと、声は続けたまま、画面に変化と空気を足せる。</p>

  <h2>詰まりやすい所</h2>
  <p>撮った本人は全ての場面に思い入れがあるので、削るのが難しい。一度最後までつないだら、しばらく置いてから見直すと、長いと感じる所が見つけやすい。</p>
</template>

  <p>投稿先が推奨する解像度、fps、形式に合わせて書き出す。撮影したときのfpsと書き出しのfpsがずれると、動きがカクつくことがある（準備編の「コマとfps」）。</p>

  <h2>詰まりやすい所</h2>
  <p>色を作り込みすぎて、肌の色が不自然になることがある。人が映っている場面では、肌の色が自然に見えるかを基準にして、やりすぎを止める。</p>

<template id="body-moji-2">

  <p>作り始める前に、曲を何度も聴いて、イントロ、Aメロ、Bメロ、サビ、間奏といった展開と、それぞれの時間を書き出す。どこで曲が盛り上がり、どこで静かになるかが分かると、映像のどこに力を入れるかが決めやすくなる。</p>

  <p>展開と言葉が見えたら、全体の構成を決める。サビで画面の色を変える、最後のサビで最初の画面に戻る、といった大きな流れを先に決めておくと、細部を作るときに迷いにくい。構成の考え方は構成編で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>最初から細かい動きを作り始めると、途中で全体のバランスが崩れやすい。先に全体を簡単な文字だけで仮に並べ、曲の頭から終わりまで通して見てから、作り込む所を決めるとよい。</p>

<template id="body-moji-3">

  <p>書体は曲の印象を左右する。明朝体は物語や切なさ、太いゴシック体は力強さ、手書き風は親しさを出しやすい。1本の作品で使う書体は2〜3種類程度に絞ると、まとまりが出やすい。書体の性格は画編の「文字とタイポグラフィ」で扱っている。</p>

  <h2>文字の大きさと強弱</h2>
  <p>1画面の中で、一番見せたい言葉を大きく、他を小さくして階層を作る。大きさだけでなく、太さ、色、傾きでも強弱は付けられる。全部を大きくすると、どれも目立たなくなる。</p>

  <h2>画面の中の置き方（三分割法など）</h2>
  <p>画面を縦横に3等分する線と交点を目安に文字を置く三分割法は、置き場所に迷ったときの出発点になる。真ん中に大きく置く、端に寄せて余白を広く取る、斜めに流す、といった置き方もある。止めて1枚の絵として見られるかを確かめながら決める。構図の考え方は画編の「構図」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>デザインに凝りすぎて、読めない画面になることがある。読ませたい言葉と、絵として見せる言葉を分けて考え、読ませたい言葉は背景との明るさの差を十分に取る。</p>
</template>

<template id="body-moji-4">

  <h2>音ハメで強調する</h2>
  <p>ドラムの強い音や、歌の強い言葉に合わせて、文字を揺らす、拡大する、色を変えると、その瞬間が強調される。全部の音に合わせると単調になるので、強調する所を選ぶ。合わせる所と外す所の考え方は、音編の「タイミングと音ハメ」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>歌声に合わせたつもりでも、見ると少し遅れて感じることがある。文字が完全に出きる瞬間が歌い出しに来るように、動き出しを1〜2フレーム早めると、合って見えることが多い。</p>

  <p>動きの種類を増やしすぎると、画面が騒がしくなり、文字が読みにくくなる。読ませたい言葉の所では動きを控えめにして、読ませる時間を優先する。</p>

  <p>紙のざらつき、ノイズ、光のにじみ、色ずれなどの質感を重ねると、画面に味が出る。質感は作品全体で統一すると、まとまりが出やすい。仕上げの効果の考え方は、合成編の「仕上げ」で扱っている。</p>

<template id="body-cut-6">
  <p class="tk">この章は叩き台。権利の話は、法律や配信者のガイドラインが変わることがあるので、公開する前に最新の情報で確かめる必要がある。ここに書くのは、確認しておくことの一覧である。</p>
  <h2>切り抜きの権利の基本</h2>
  <p>配信や動画には、配信者や制作者の著作権などの権利がある。さらに、配信の中で流れているゲームの映像、BGM、他の人の作品にも、それぞれの権利者がいる。切り抜きは他人の作品を素材にする活動なので、許可のない切り抜きは削除や問題につながるおそれがあることを知っておく。</p>

  <h2>配信者のガイドラインを確認する</h2>
  <p>配信者や所属事務所の中には、切り抜きのガイドラインを公開している人がいる。切り抜きを許可しているか、収益化してよいか、タイトルや概要欄に元の配信へのリンクを入れる必要があるか、といった条件が書かれていることが多い。切り抜く前に、その配信者のガイドラインを確認する。ガイドラインがない場合は、許可されているとは限らない。</p>

  <h2>迷ったときの判断</h2>
  <p>ガイドラインが見つからない、条件がはっきりしないときは、切り抜かない、または配信者に確認する。配信の中のゲームや音楽の権利も別にあるので、ゲームの配信ガイドラインなども合わせて確かめる。部の作品として公開する場合は、部としての方針も確認しておく。</p>
</template>

<template id="body-cg-1">
  <h2>このジャンルで何を魅せるか</h2>
  <p>3DCGは、仮想の空間に形を作り、質感、光、カメラ、動きをすべて自分で決めて映像にするジャンルだ。現実にない物も、撮れない角度も作れる。自由度が高い分、何を魅せたいかを決めないと、どこを見ればいいか分からない映像になりやすい。</p>

  <h2>重要な軸：構図、光、カメラ</h2>
  <p>特に比重が大きいのは、構図（画編の「構図」）、光（画編の「光とライティング」）、カメラ（動き編の「カメラワーク」）だ。仕上げでは、合成編の「レンダーパス合成」の考え方も使う。</p>

  <h2>作り方の流れ</h2>
  <p>この編では、モデリング → マテリアルとテクスチャ → リギング → アニメーション → ライティングとカメラ → レンダリング → コンポジット、の順に章を立てている。動かない静止画や、キャラクターの出てこない作品なら、リギングやアニメーションは飛ばしてよい。</p>

  <h2>参考にするもの</h2>
  <p>参考になるのは、他の3DCG作品のほか、写真、映画の撮影と照明、現実の物そのものだ。質感や光は、現実の物をよく見ることが一番の参考になる（参考作品は今後、候補を挙げて選ぶ）。</p>
</template>

<template id="body-cg-2">
  <h2>映る所から作る</h2>
  <p>モデリングは、3DCGの形を作る工程だ。最初に、カメラにどう映るかを決めておくと、作る量を減らせる。カメラに映らない裏側や、遠くて小さくしか映らない物は、細かく作り込まなくてよい。</p>

  <h2>大きな形から細部へ</h2>
  <p>形は、大まかな塊から作り始め、全体のバランスを確かめてから細部を足していく。最初から細部を作ると、後で全体の比率がおかしいと気づいたときに直すのが大変になる。資料の写真や三面図を下に敷いて作ると、形を取りやすい。</p>

  <h2>作り込む量の判断</h2>
  <p>どこまで細かく作るかは、カメラからの距離と、その物が画面の中でどれだけ大事かで決める。主役の物は作り込み、背景の物は簡単な形にとどめる。細かい凹凸は、形で作らずに次の章のテクスチャで表現する方法もある。</p>

  <h2>三角形、四角形、Nゴン</h2>
  <p>3DCGの形は、ポリゴンと呼ばれる面の集まりでできている。面の角（頂点）が3つなら三角ポリゴン、4つなら四角ポリゴン（クアッド）、5つ以上ならNゴンと呼ぶ。</p>

  <h2>詰まりやすい所</h2>
  <p>面の向きが裏返っている、面が重なっている、といった形の乱れは、後の工程で表示やレンダリングの不具合になりやすい。作業の区切りごとに、形の乱れがないかを確かめておく。</p>
</template>

<template id="body-cg-3">
  <h2>色とつや</h2>
  <p>マテリアルは、物の表面がどう光を返すかの設定だ。基本になるのは、表面の色、つやの強さ（ラフネス）、金属かどうか（メタリック）の3つである。同じ形でも、つやを変えるだけで、プラスチックにも陶器にも見える。</p>
  <p>現実の物をよく見ると、完全に均一な色やつやの物はほとんどない。少しのむらが、本物らしさにつながる。</p>

  <h2>テクスチャで情報を足す</h2>
  <p>テクスチャは、表面に貼る画像で、色の模様や汚れ、細かい凹凸、つやのむらを表現する。形を細かく作らなくても、テクスチャで凹凸があるように見せられる（ノーマルマップ、バンプマップなど）。画像を貼るための展開（UV展開）の作業も、この工程に含まれる。</p>

  <h2>詰まりやすい所</h2>
  <p>マテリアルは、光の当て方で見え方が大きく変わる。仮の光だけで調整すると、本番のライティングで違って見えることがある。ライティングをある程度決めてから、マテリアルを最終調整するとよい。</p>
</template>

<template id="body-cg-4">
  <h2>骨を入れる</h2>
  <p>リギングは、キャラクターや物を動かすための仕組みを作る工程だ。人の体なら、関節の位置に骨（ボーン）を入れ、骨が動くと周りの形も一緒に動くように結び付ける。骨と形の結び付きの強さ（ウェイト）を調整して、曲げたときに形が自然に変形するようにする。</p>

  <h2>動かしやすい操作を作る</h2>
  <p>骨を1本ずつ回して動かすのは手間がかかる。手首を動かすと腕全体がついてくる仕組み（IK）や、指をまとめて曲げる操作など、動かしやすい操作を作っておくと、次のアニメーションの工程が速くなる。</p>

  <h2>詰まりやすい所</h2>
  <p>肩や肘を大きく曲げたときに、形が潰れたり、ねじれたりしやすい。リギングが終わったら、極端なポーズを取らせて、崩れる所がないかを確かめる。Blenderには人型の骨組みを自動で作る機能もある（機能名は要確認）。</p>
</template>

<template id="body-cg-5">
  <h2>キーフレームとグラフエディタ</h2>
  <p>3DCGのアニメーションも、ある時点のポーズや位置をキーフレームとして記録し、その間をソフトに補間させて作る。グラフエディタで、位置や回転の値が時間とともにどう変わるかを見ながら、速さの変化を調整する。考え方は動き編の「イージング」で扱っている。</p>

  <h2>重さを感じさせる</h2>
  <p>3DCGの動きは、補間に任せると、重さのない、ふわふわした動きになりやすい。重い物はゆっくり動き出して強く止まる、着地の瞬間に少し沈み込む、といった工夫で、物の重さを感じさせる。</p>

  <h2>アニメーションの12原則から使えるもの</h2>
  <p>アニメーションの12原則は、3DCGのアニメーションでも使われている。動く前の「予備動作」、止まった後の「フォロースルー」、体の部位が少しずつ遅れて動く「オーバーラッピング」、ポーズとポーズの間を弧を描くように動かす「アーク」。12原則については、動き編の「歴史：動きの原則」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>体の全ての部位が同時に動き出して、同時に止まると、ロボットのように見える。部位ごとに動き出しと止まりを少しずらすと、生き物らしくなる。</p>
</template>

<template id="body-cg-6">
  <h2>見せたい所を照らす</h2>
  <p>3DCGのライティングは、見せたい所に光を当て、見せなくていい所を暗く落とす作業だ。光の向き、強さ、色、大きさを決める。主になる光（キーライト）、影を和らげる光（フィルライト）、輪郭を出す光（リムライト）の三点照明から組み立てるのが一つの出発点になる。考え方は画編の「光とライティング」で扱っている。</p>
  <p>空全体からの光を画像で与える方法（HDRIなど）を使うと、現実の空間に近い光を手早く作れる。</p>

  <h2>カメラの位置とレンズ</h2>
  <p>カメラの位置と高さで、被写体の見え方が変わる。低い位置から見上げると大きく強く見え、高い位置から見下ろすと小さく見える。レンズの焦点距離も大事で、広角は遠近感が強く、望遠は遠近感が弱くなる。現実のカメラに近い焦点距離を選ぶと、見慣れた自然な画になりやすい。</p>

  <h2>構図の型（三分割法など）</h2>
  <p>カメラの画面の中で、主役をどこに置くかを決める。三分割法は置き場所の目安になる。3DCGでは物の位置を自由に動かせるので、カメラだけでなく、物の配置を構図に合わせて動かすこともできる。構図の考え方は画編の「構図」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>光を足していくと、影がなくなって平らな画になりやすい。光を足す前に、本当にその光が必要か、影を残した方が見せたい所が際立つのではないかを考える。</p>
</template>

<template id="body-cg-7">
  <h2>画質と時間の釣り合い</h2>
  <p>レンダリングは、3DCGの空間を画像として書き出す工程だ。画質を上げるほど、1枚にかかる時間は長くなる。映像では1秒に何十枚も書き出すので、1枚の時間の差が全体では大きな差になる。サンプル数、解像度、光の反射の回数などを、見た目が許せる範囲で下げて、時間との釣り合いを取る。</p>
  <p>Blenderでは、速く書き出せるEeveeと、光を正確に計算するCyclesを使い分けることができる。</p>

  <h2>パスに分けて書き出す</h2>
  <p>後の合成で調整できるよう、色、影、反射、光などの要素ごとに分けて書き出すことがある。これがレンダーパスだ。物体ごとの選択用の画像も書き出しておくと、合成で特定の物だけを調整しやすい。考え方は合成編の「レンダーパス合成」で扱っている。</p>

  <h2>詰まりやすい所</h2>
  <p>長いレンダリングの途中で失敗すると、やり直しの時間が大きい。動画ファイルで直接書き出すより、連番の画像で書き出す方が、途中で止まっても続きから再開できる。本番の前に、低い画質で全体を書き出して確かめておく。</p>
</template>

<template id="body-cg-8">
  <h2>パスを重ねる流れ</h2>
  <p>書き出したレンダーパスを、合成ソフトで重ねて画を仕上げる。BlenderのコンポジターやAfter Effects、DaVinci ResolveのFusionなどを使う。基本の色のパスに、光や反射のパスを足し、影のパスを掛け合わせる、という順に重ねていく。考え方は合成編の「レンダーパス合成」で扱っている。</p>

  <h2>色と光を後から整える</h2>
  <p>パスに分けておくと、反射だけを強める、特定の物の色だけを変える、といった調整を、レンダリングをやり直さずにできる。光のにじみ（グロー）や被写界深度のボケ、全体の色の調整も、この段階で加えることが多い。仕上げの考え方は合成編の「仕上げ」で扱っている。</p>

  <h2>実写と合わせる</h2>
  <p>3DCGの物を実写の映像に合成する場合は、実写の光の向き、色、ボケ、ノイズ、カメラの動きに合わせる。カメラの動きは、合成編の「トラッキング」で扱っているカメラトラッキングで読み取る。</p>

  <h2>詰まりやすい所</h2>
  <p>合成で調整できるからといって、3DCGの段階の作業を雑にすると、合成で直しきれないことがある。光の向きや形の問題は、3DCGの段階で直しておく。</p>
</template>

var PARTS = [
 {id:"intro",name:"序論",desc:"映像とは何かを定義し、このサイトの立場と読み方を決める。",start:0,articles:[
  {id:"intro-0",pub:true,body:"body-intro-0",mins:3,n:"0.0",title:"凡例",sub:"このサイトの読み方",summary:"このサイトの作りと、本文を読むときの約束ごと。編と章の番号の読み方、用語の吹き出し、図と動画、「要確認」と出典の扱い。",outline:["編と章の作り","用語の吹き出し","図と動画","「要確認」と出典"],further:["intro-1","intro-5","intro-3"]},
  {id:"intro-1",n:"0.1",title:"映像とは何か",sub:"静止画の連続から、意図の設計へ",pub:true,body:"body-intro-1",mins:7,summary:"映像は静止画の連続である、という仕組みの定義から出発する。「どこで止めてもいい絵になる」という物差しとその限界を経て、このサイトの中心となる定義にたどり着く。",further:["visual-1","motion-1","intro-3"]},
  {id:"intro-2a",pub:true,body:"body-intro-2a",mins:3,n:"0.2a",title:"映像の歴史（通史）前半",sub:"フィルムの時代",summary:"映画の誕生から、編集とモンタージュの発見、サイレントの完成、音と初期アニメまで。全体をつかむための通史で、手法ごとの歴史は各編で掘り下げる。",outline:["映像の誕生：カメラ固定・ワンショットの時代","編集とモンタージュの発見","サイレントの完成：チャップリン","トーキーと音同期アニメ：ミッキー","カラーの普及まで"]},
  {id:"intro-2b",pub:true,tk:true,body:"body-intro-2b",mins:3,n:"0.2b",title:"映像の歴史（通史）後半",sub:"デジタルとネットの時代",summary:"テレビとビデオの大衆化、CGとデジタル編集、ネット動画、スマホと縦型ショートまで。部員が作っているジャンルの源流をたどる。",outline:["テレビとビデオの大衆化","CGとデジタル編集：個人でも作れる時代へ","ネット動画の誕生：YouTube、ニコニコ","スマホと縦型ショートの流行"]},
  {id:"intro-3",n:"0.3",title:"映像理論の流派",sub:"このサイトの立場",pub:true,body:"body-intro-3",mins:5,summary:"このサイトは型を強制せず、中心の定義を物差しとして使う。対比として、連続性編集のルール、ウォルター・マーチの6つのルール、ドグマ95という型やルールで考える例を見て、型との付き合い方を決める。",outline:["このサイトの立場：定義は物差しとして置く","例1：連続性編集のルール","例2：ウォルター・マーチの6つのルール","例3：ドグマ95","型とどう付き合うか"],further:["intro-1","edit-1","intro-4"]},
  {id:"intro-4",n:"0.4",title:"映像理論を学ぶ意味",sub:"映像の理由が読めるようになる",pub:true,body:"body-intro-4",mins:4,summary:"世の中の映像には、そう作られている理由がある。理論はその理由を言葉にしたもの。理由と語彙を知ると、自分の映像に活かせて、作れるものを想像しやすくなり、他人の作品をロジカルに読めるようになる。",outline:["映像には、そう作られている理由がある","理由が分かると、自分の映像に使える","言葉を知らないと、作れるものを想像しにくい","他人の作品をロジカルに読める","理論を知ると、感覚が鈍るのか"],further:["intro-3","visual-1","edit-1"]},
  {id:"intro-5",n:"0.5",title:"学ぶかどうか、学び方を決める",sub:"詰まった所から開いていい",pub:true,body:"body-intro-5",mins:3,summary:"理論を学ばず、作りながら必要な記事だけ開く選び方もある。どちらを選んでも、全編を順番に読む必要はない。詰まった所から開き、1記事で区切っていい。編と章に分けたのは、一度に抱える量を減らし、自分のペースで進めるため。",outline:["学ばずに作る、という選び方もある","全部を一度に理解しなくていい","詰まった所から読む","1記事で区切る","困りごと索引の使い方"],further:["intro-4","intro-6","intro-1"]},
  {id:"intro-6",pub:true,tk:true,body:"body-intro-6",mins:1,n:"0.6",title:"ゴールとプランを練る",sub:"ジャンル別の読む順番",summary:"作るジャンルに合わせた読む順番の例。基礎を一通り通る道と、応用編から逆引きする道。",outline:["ゴールは「作れるようになる」側に置く","ジャンル別の読む順番の例","応用編から基礎へ逆引きする"]}
 ]},
 {id:"prep",name:"準備編",desc:"本編を読むための前提知識と、用語の土台。",articles:[

  {id:"prep-3",pub:true,tk:true,body:"body-prep-3",mins:1,title:"色と光の最低限",sub:"画編と合成編のための約束ごと",summary:"色相・明度・彩度と、光の向き。画編と合成編を読むのに必要な最小限だけを押さえる。",outline:["色の三属性","光の向きと影の出方","色温度"]},
  {id:"prep-4",pub:true,tk:true,body:"body-prep-4",mins:1,title:"音の最低限",sub:"音を言葉で扱うために",summary:"音量、音の高さ、音色。音編を読むための前提をそろえる。",outline:["音量（デシベル）の感覚","音の高さと周波数","音色とは何か"]},

  {id:"visual-3",pub:true,tk:true,body:"body-visual-3",mins:1,title:"色",sub:"配色と色の役割",summary:"色は情報を運ぶ。配色の型と、色が雰囲気や読み分けにどう働くか。",outline:["配色の型：同系、補色、アクセント","色で情報を分ける","作品全体の色の統一感"]},

 {id:"edit",name:"編集編",desc:"カット単位の時間設計。つなぐことで意味とテンポが生まれる。",articles:[

 ]},
 {id:"composite",name:"合成編",desc:"レイヤーを重ね、素材から画を作り、仕上げる。",articles:[

  {id:"composite-4",pub:true,tk:true,body:"body-composite-4",mins:1,title:"レンダーパス合成",sub:"3DCGを合成で仕上げる",summary:"3DCGはパスに分けて出力し、合成で画を仕上げる。その工程の考え方。",outline:["レンダーパスとは何か","パス合成で調整できること","仕上げとしてのコンポジット"]},

 ]},

 ]},

 {t:"彩度",d:"色の鮮やかさ。低くすると灰色に近づく。",l:"prep-3"},
 {t:"色温度",d:"光の色をケルビン（K）で表したもの。数字が低いほどオレンジ寄り、高いほど青寄り。",l:"prep-3"},
 {t:"ホワイトバランス",d:"光の色温度に合わせて、白を白く写すためのカメラの設定。",l:"prep-3"},
 {t:"デシベル",a:["dB"],d:"音の大きさを表す単位。編集ソフトでは0dBが上限で、超えると音が割れる。",l:"prep-4"},
 {t:"周波数",d:"音の高さを決める、空気が1秒に震える回数。単位はHz。数字が大きいほど高い音。",l:"prep-4"},
 {t:"イコライザー",a:["EQ"],d:"音の高さの帯域ごとに、音量を上げ下げする道具。",l:"prep-4"},
 {t:"音色",d:"同じ高さ・大きさでも、ピアノと声を聞き分けられる違い。",l:"prep-4"},
 {t:"リードルーム",d:"人物の視線や動きの先に空ける空間。ルッキングルームとも呼ぶ。",l:"visual-1"},
 {t:"三分割法",d:"画面を縦横に3等分する線と交点を目安に、被写体を置く構図の型。",l:"visual-1"},
 {t:"日の丸構図",d:"被写体を画面の真ん中に置く構図。正面からの強さや対称の美しさが出る。",l:"visual-1"},
 {t:"余白",d:"画面の中で、被写体の周りに何もない空間。置き方で印象が変わる。",l:"visual-1"},
 {t:"補色",d:"色相環で反対側にある色の組み合わせ。強いコントラストが出る。",l:"visual-3"},
 {t:"アクセントカラー",d:"全体を少ない色でまとめた中に、1色だけ差す目立つ色。",l:"visual-3"},
 {t:"三点照明",d:"キーライト（主な光）、フィルライト（影を和らげる光）、リムライト（輪郭を出す光）で組み立てる照明の基本形。",l:"visual-5"},
 {t:"逆光",d:"被写体の後ろから当たる光。輪郭が光り、被写体が背景から浮き上がる。",l:"visual-5"},
 {t:"予備動作",d:"動きの前の溜め。ボールを投げる前に腕を引くような動き。",l:"motion-1"},
 {t:"フォロースルー",d:"動きが止まった後に残る余韻。髪や服が少し遅れて揺れるような動き。",l:"motion-1"},
 {t:"モーションブラー",d:"速い動きの軌跡をぼかして残す効果。動きを滑らかに見せる。",l:"motion-1"},
 {t:"イーズイン",d:"止まった状態からゆっくり加速して動き出すこと。ソフトによって呼び方が逆になることがある。",l:"motion-2"},
 {t:"イーズアウト",d:"減速しながらゆっくり止まること。ソフトによって呼び方が逆になることがある。",l:"motion-2"},
 {t:"グラフエディタ",d:"動きの値や速度を、時間を横軸にしたグラフで見て調整する画面。",l:"motion-2"},
 {t:"キーフレーム",d:"ある時点の位置や大きさなどを記録した点。間の動きはソフトが補間する。",l:"motion-2"},
 {t:"パン",d:"カメラを左右に振る動き。",l:"motion-3"},
 {t:"チルト",d:"カメラを上下に振る動き。",l:"motion-3"},
 {t:"ドリー",d:"カメラ自体を前後に動かすこと。ズームと違い、被写体と背景の位置関係が変わる。",l:"motion-3"},
 {t:"アニメーションの12原則",a:["12原則"],d:"ディズニーのアニメーターたちの動きのコツを、12の原則としてまとめたもの。『The Illusion of Life』（1981年）で紹介された。",l:"motion-4"},
 {t:"スクワッシュ＆ストレッチ",d:"物が潰れたり伸びたりする変形で、柔らかさや勢いを表す。12原則の一つ。",l:"motion-4"},
 {t:"BPM",d:"1分間の拍の数。BPM120なら1拍は0.5秒。",l:"sound-2"},
 {t:"ダッキング",d:"声が鳴っている間だけ、BGMの音量を下げること。",l:"sound-3"},
 {t:"環境音",d:"風、車、ざわめきなど、その場所で鳴っている音。場所の実在感を作る。",l:"sound-4"},
 {t:"トーキー",d:"映像と同期した音（セリフや歌）が付いた映画。1920年代後半から広がった。",l:"sound-5"},
 {t:"ミッキーマウシング",d:"音楽に合わせてキャラクターの動きをぴったり同期させる手法。",l:"sound-5"},
 {t:"ジャンプカット",d:"同じ構図のまま時間が飛ぶつなぎ。画面が飛んだように見える。",l:"edit-1"},
 {t:"Jカット",d:"次の場面の音が、映像より先に聞こえ始めるつなぎ方。",l:"edit-1"},
 {t:"Lカット",d:"前の場面の音が、映像が切り替わった後も残るつなぎ方。",l:"edit-1"},
 {t:"ディゾルブ",d:"前のカットが消えながら、次のカットが現れるつなぎ。時間の経過や区切りの合図になりやすい。",l:"edit-1"},
 {t:"マッチカット",d:"似た形や動きでカットをつなぐ方法。",l:"edit-1"},
 {t:"アクションつなぎ",d:"動きの途中でカットを切り替え、つなぎ目を目立たなくする方法。",l:"edit-1"},
 {t:"180度ルール",d:"会話する2人を結ぶ想定線（イマジナリーライン）の片側からだけ撮る、という連続性編集のルール。",l:"intro-3"},
 {t:"30度ルール",d:"同じ被写体を続けて映すとき、カメラの位置を30度以上変える、という連続性編集のルール。",l:"intro-3"},
 {t:"イマジナリーライン",d:"会話する2人などを結ぶ想定上の線。越えて撮ると左右が入れ替わって見える。",l:"intro-3"},
 {t:"連続性編集",d:"カットが変わっても時間と空間が続いて見えるよう、つなぎ目を気づかせない編集の考え方。",l:"intro-3"},
 {t:"クレショフ効果",d:"同じ顔のカットでも、前後に並べるカットによって違う感情に見える現象。",l:"edit-2"},
 {t:"クロスカッティング",d:"離れた場所で同時に起きている出来事を、交互に見せる編集。",l:"edit-4"},
 {t:"レイヤー",d:"画面を構成する層。素材ごとに分けて重ねることで、個別に動かしたり調整したりできる。",l:"composite-1"},
 {t:"描画モード",a:["ブレンドモード"],d:"上のレイヤーを下にどう混ぜるかの設定。スクリーン（明るくする）、乗算（暗くする）など。",l:"composite-1"},
 {t:"マスク",d:"レイヤーのどこを見せて、どこを隠すかを決める型紙。",l:"composite-2"},
 {t:"キーイング",d:"色や明るさを手がかりに、素材を自動で切り抜くこと。",l:"composite-2"},
 {t:"クロマキー",d:"グリーンバックやブルーバックの色だけを抜いて切り抜く方法。",l:"composite-2"},
 {t:"ロトスコープ",d:"動く被写体に合わせて、マスクの形を1コマずつ描き変える作業。",l:"composite-2"},
 {t:"トラッキング",d:"映像の中の動きを読み取り、別の素材をその動きに追従させる技術。",l:"composite-3"},
 {t:"カメラトラッキング",a:["マッチムーブ"],d:"たくさんの点の動きから、撮影したカメラの動きを空間ごと計算する技術。",l:"composite-3"},
 {t:"グロー",d:"明るい所の周りに光のにじみを足す効果。",l:"composite-5"},
 {t:"カラーコレクション",d:"素材の色味や明るさを、正しい状態に戻し、そろえる調整。",l:"composite-5"},
 {t:"カラーグレーディング",d:"作品の雰囲気に合わせて、色の方向を作る調整。",l:"composite-5"},
 {t:"LUT",d:"色の変換をまとめた設定ファイル。かけるだけで決まった色の調子にできる。",l:"vlog-6"},
 {t:"ストップトリック",d:"カメラを止めて物を入れ替え、物が一瞬で変わったように見せるトリック撮影。",l:"composite-6"},
 {t:"二重露光",d:"同じフィルムに2回撮影して、像を重ねる方法。",l:"composite-6"},
 {t:"三幕構成",d:"話を設定・対立・解決の3つに分けて組み立てる、映画脚本でよく使われる型。",l:"structure-3"},
 {t:"クライマックス",d:"作品の中で一番盛り上がる所。最後の着地であるオチとは分けて考えられる。",l:"structure-4"},
 {t:"撮れ高",d:"作品に使える素材がどれだけ撮れたか。",l:"vlog-2"},
 {t:"ショットリスト",d:"撮りたいショットを、場所や寄り・引きと一緒に書き出したリスト。",l:"vlog-2"},
 {t:"Bロール",d:"話や主な出来事（Aロール）の間に挟む、風景や手元などの素材。",l:"vlog-3"},
 {t:"テロップ",d:"画面に重ねて出す文字。発言を読ませたり、強調したりする。",l:"cut-4"},
 {t:"立ち絵",d:"ゆっくり実況などで、画面の端に表示するキャラクターの絵。",l:"yukkuri-4"},
 {t:"アセット",d:"作品の中で使う図形、イラスト、文字などの素材。",l:"mg-3"},
 {t:"アンカーポイント",d:"レイヤーを回転・拡大するときの中心になる点。",l:"mg-3"},
 {t:"トランジション",d:"場面と場面をつなぐ切り替えの演出。",l:"mg-5"},
 {t:"ポリゴン",img:"tipfig-ngon",d:"3DCGの形を作る面の一つ一つ。頂点の数で三角ポリゴン、四角ポリゴン、Nゴンと呼び分ける。",l:"cg-2"},
 {t:"Nゴン",img:"tipfig-ngon",d:"頂点が5つ以上ある面。曲げたり滑らかにしたりすると、しわや影の乱れが出やすい。",l:"cg-2"},
 {t:"エッジループ",img:"tipfig-loop",d:"四角ポリゴンの辺が、縦や横に一続きにつながった線。まとめて選んだり、足して形を締めたりできる。",l:"cg-2"},
 {t:"サブディビジョン",d:"面を細かく分けて、形を滑らかにすること。四角ポリゴンで組んだモデルほどきれいに分かれる。",l:"cg-2"},
 {t:"モデリング",d:"3DCGで物の形を作る工程。",l:"cg-2"},
 {t:"マテリアル",d:"3DCGで、物の表面が光をどう返すか（色、つや、金属かどうか）の設定。",l:"cg-3"},
 {t:"テクスチャ",d:"3DCGの物の表面に貼る画像。模様、汚れ、細かい凹凸を表す。",l:"cg-3"},
 {t:"UV展開",d:"3DCGの形の表面を平面に開き、テクスチャを貼れるようにする作業。",l:"cg-3"},
 {t:"リギング",d:"3DCGのキャラクターや物を動かすための骨組みと操作を作る工程。",l:"cg-4"},
 {t:"ボーン",d:"リギングで形の中に入れる骨。骨が動くと周りの形も動く。",l:"cg-4"},
 {t:"IK",d:"手先や足先を動かすと、腕や脚全体が自然についてくる仕組み。",l:"cg-4"},
 {t:"HDRI",d:"周囲の光の情報を含む画像。3DCGで空間全体の光として使う。",l:"cg-6"},
 {t:"焦点距離",d:"レンズの画角を決める数字。小さいほど広角で遠近感が強く、大きいほど望遠で遠近感が弱い。",l:"cg-6"},
 {t:"レンダリング",d:"3DCGの空間を画像として書き出す工程。",l:"cg-7"}
];
</script>
<script>
(function(){
var COLORS={intro:["#BFBFBF","#000"],prep:["#BFBF00","#000"],visual:["#00BFBF","#000"],motion:["#00BF00","#000"],
  sound:["#BF00BF","#fff"],edit:["#BF0000","#fff"],composite:["#0000BF","#fff"],structure:["#00214C","#fff"],genres:["#32006A","#fff"]};
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}

var FLAT=[],BY={},GBY={};
PARTS.forEach(function(p,pi){
  p.no=pi; p.label=pi===0?"序論":"第"+pi+"編 "+p.name;
  p.c=COLORS[p.id][0]; p.ci=COLORS[p.id][1];
  var base=p.start===0?0:1;
  if(p.groups){p.articles=[];p.groups.forEach(function(g){g.part=p;g.label=g.k+" "+g.title;GBY[g.id]=g;
    g.articles.forEach(function(a,ai){a.group=g;a.n=pi+g.k+"."+(ai+1);p.articles.push(a)})});}
  p.articles.forEach(function(a,ai){
    a.part=p; a.num=a.n||(pi+"."+(ai+base));
    var txt=""; if(a.body){var t=document.getElementById(a.body); if(t)txt=t.content.textContent;}
    a.index=(p.name+(a.group?a.group.title:"")+a.num+a.title+a.sub+a.summary+(a.outline||[]).join(" ")+txt).toLowerCase();
    a.i=FLAT.length; FLAT.push(a); BY[a.id]=a;
  });
});
var firstHome=true;

function chRow(a){
  return '<li><a class="'+(a.pub?"pub":"draft")+'" href="#'+a.id+'"><span class="n">'+a.num+'</span><span class="t">'+esc(a.title)+'<span class="s">'+esc(a.sub)+'</span></span><span class="st">'+(a.tk?"叩き台":a.pub?"本文あり":"章立てのみ")+'</span></a></li>';
}
function partList(p){
  if(!p.groups)return '<ul class="chl">'+p.articles.map(chRow).join("")+'</ul>';
  return p.groups.map(function(g){return '<div class="grp"><h3><a href="#'+g.id+'"><span class="gk">'+p.no+g.k+'</span>'+esc(g.title)+'</a><span class="s">'+esc(g.sub)+'</span></h3><ul class="chl">'+g.articles.map(chRow).join("")+'</ul></div>'}).join("");
}
function topBar(a,p){
  var strip=FLAT.map(function(x){return '<a href="#'+x.id+'" title="'+x.num+' '+esc(x.title)+'" aria-label="'+x.num+' '+esc(x.title)+'" class="'+(x.pub?"pub ":"")+(a&&x===a?"on":"")+'" style="background:'+x.part.c+'"></a>'}).join("");
  return '<div class="top"><div class="wrap row"><a class="home" href="#top">映像とは何か</a><span class="where">'+(p?'<a href="#'+p.id+'">'+esc(p.label)+'</a>':'')+'</span></div><nav class="strip" aria-label="全章">'+strip+'</nav></div>';
}
var FOOT='<footer><div class="wrap">'+FLAT.length+'章のうち '+FLAT.filter(function(a){return a.pub}).length+'章に本文あり（うち'+FLAT.filter(function(a){return a.tk}).length+'章は叩き台）。叩き台の章は、要点と流れだけを先に書いたもので、順次書き直す。</div></footer>';

function viewHome(){
  var bars=PARTS.map(function(p){return '<a class="bar" href="#'+p.id+'" style="background:'+p.c+';color:'+p.ci+';box-shadow:1px 0 0 '+p.c+';animation-delay:'+(p.no*45)+'ms"><span class="nm">'+esc(p.name)+'</span><span class="ct">'+(p.groups?p.groups.length+'ジャンル':p.articles.length+'章')+'</span></a>'}).join("");
  var h='<nav class="bars'+(firstHome?" intro":"")+'" aria-label="編">'+bars+'</nav>'+
   '<header class="band"><div class="wrap"><h1>映像とは何か</h1><p>映像研の部員が、作りながら読むための理論書。全ての映像に共通する基礎を編に分け、最後にジャンルごとの応用へ進む。順番に読まなくていい。詰まった所から開いて、1章読んだら閉じていい。</p>'+
   '<div class="tools"><input type="search" id="q" placeholder="章を検索：構図、音ハメ、3DCG" aria-label="章を検索"><a href="#troubles">困りごとから探す</a><a href="#glossary">用語索引</a></div></div></header>'+
   '<main class="wrap" id="homeMain"></main>'+FOOT;
  app.innerHTML=h; firstHome=false;
  renderHomeMain("");
  var q=document.getElementById("q");
  q.addEventListener("input",function(){renderHomeMain(q.value.trim().toLowerCase())});
}
function renderHomeMain(q){
  var m=document.getElementById("homeMain");
  if(q){
    var hits=FLAT.filter(function(a){return a.index.indexOf(q)!==-1});
    m.innerHTML='<section class="results"><h2>'+(hits.length?hits.length+"章が該当":"該当する章はない")+'</h2>'+
     (hits.length?'<ul class="chl">'+hits.map(chRow).join("")+'</ul>':'<p class="empty">別の言葉で探すか、<a href="#troubles">困りごとから探す</a>。</p>')+'</section>';
    return;
  }
  m.innerHTML='<section class="thesis"><p class="k">このサイトの定義</p><blockquote>良い映像は、どの要素にも「何を魅せたいか」の意図が設計されている。</blockquote><p class="src"><a href="#intro-1">0.1「映像とは何か」で、この定義にたどり着くまでを読む</a></p></section>'+
   PARTS.map(function(p){return '<section class="part" id="sec-'+p.id+'"><h2><span class="sw" style="background:'+p.c+'"></span><a href="#'+p.id+'">'+esc(p.label)+'</a></h2><p class="desc">'+esc(p.desc)+'</p>'+partList(p)+'</section>'}).join("");
}
function viewPart(p){
  app.innerHTML=topBar(null,null)+'<header class="phead" style="background:'+p.c+';color:'+p.ci+'"><div class="wrap"><h1>'+esc(p.label)+'</h1><p>'+esc(p.desc)+'</p></div></header>'+
   '<main class="wrap"><div class="part" style="padding-top:40px">'+partList(p)+'</div></main>'+FOOT;
}
function viewGroup(g){
  var p=g.part;
  app.innerHTML=topBar(null,p)+'<header class="phead" style="background:'+p.c+';color:'+p.ci+'"><div class="wrap"><p class="gp"><a href="#'+p.id+'">'+esc(p.label)+'</a></p><h1>'+esc(g.title)+'</h1><p>'+esc(g.summary)+'</p></div></header>'+
   '<main class="wrap"><div class="part" style="padding-top:40px"><ul class="chl">'+g.articles.map(chRow).join("")+'</ul></div></main>'+FOOT;
}
function viewArticle(a){
  var p=a.part,pv=FLAT[a.i-1],nx=FLAT[a.i+1];
  var h=topBar(a,p)+'<main class="wrap" style="--c:'+p.c+'"><header class="ahead"><p class="pn"><span class="sw" style="background:'+p.c+'"></span><a href="#'+p.id+'">'+esc(p.label)+'</a>'+(a.group?'<a href="#'+a.group.id+'">'+esc(a.group.title)+'</a>':'')+'<span>'+a.num+'</span></p>'+
   '<h1>'+esc(a.title)+'</h1><p class="sub">'+esc(a.sub)+'</p><p class="sum">'+esc(a.summary)+'</p>'+
   '<p class="meta">'+(a.pub?'<b>'+(a.tk?'叩き台':'本文あり')+'</b>　読むのに約'+a.mins+'分':'章立てのみ。本文は執筆中')+'</p></header>';
  if(a.pub){
    h+='<article class="body" id="body"></article>';
    if(a.further)h+='<section class="more"><h2>続けて読む</h2><ul class="chl">'+a.further.map(function(id){return chRow(BY[id])}).join("")+'</ul></section>';
  }else{
    h+='<ol class="outline">'+a.outline.map(function(o){return '<li>'+esc(o)+'</li>'}).join("")+'</ol><p class="note">章立てと概要から、読みたい内容の当たりを付けられる。</p>';
  }
  h+='<nav class="prevnext" aria-label="前後の章">'+(pv?'<a href="#'+pv.id+'"><small>前の章　'+pv.num+'</small><b>'+esc(pv.title)+'</b></a>':'<span></span>')+
     (nx?'<a class="nx" href="#'+nx.id+'"><small>次の章　'+nx.num+'</small><b>'+esc(nx.title)+'</b></a>':'<span></span>')+'</nav></main>'+FOOT;
  app.innerHTML=h;
  if(a.pub){var bd=document.getElementById("body"),fr=document.getElementById(a.body).content.cloneNode(true);
    if(a.tk&&!fr.querySelector(".tk")){var n=document.createElement("p");n.className="tk";n.textContent="この章は叩き台。要点と流れだけを先に書いた短い本文で、内容は今後見直す。";bd.appendChild(n)}
    bd.appendChild(fr); linkTerms(bd,a); setupVideos(bd);}
}
/* ---------- 参考動画：同時に1本だけ再生し、画面外に出たら止める ---------- */
function ytCmd(f,func){try{f.contentWindow.postMessage(JSON.stringify({event:"command",func:func,args:[]}),"*")}catch(e){}}
function ytListen(f){var k=0;(function ping(){try{f.contentWindow.postMessage(JSON.stringify({event:"listening",id:f.dataset.yid}),"*")}catch(e){}if(++k<6&&!f.dataset.ready)setTimeout(ping,500)})()}
var ytSeen=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting&&e.target.dataset.playing)ytCmd(e.target,"pauseVideo")})}):null;
var IC={play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 8.5a5 5 0 0 1 0 7" stroke="#fff" stroke-width="2" fill="none"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 9l6 6M21 9l-6 6" stroke="#fff" stroke-width="2"/></svg>',
  full:'<svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zM14 3h7v7h-2V5h-5zM3 14h2v5h5v2H3zM19 14h2v7h-7v-2h5z"/></svg>'};
function fmt(t){t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+":"+("0"+t%60).slice(-2)}
function setupVideos(root){
  [].forEach.call(root.querySelectorAll('iframe[src*="youtube.com/embed/"]'),function(f,i){
    f.dataset.yid="yt"+i; f.addEventListener("load",function(){f.dataset.ready="";ytListen(f)});
    if(ytSeen)ytSeen.observe(f);
    var box=f.parentNode,id=(f.src.match(/embed\/([^?]+)/)||[])[1],st=(f.src.match(/[?&]start=(\d+)/)||[])[1]||0;
    var ui={f:f,box:box,dur:0,cur:0,drag:false,id:id};f._ui=ui;
    var hit=document.createElement("div");hit.className="hit";box.appendChild(hit);
    var c=document.createElement("div");c.className="ctl";
    c.innerHTML='<button class="pp" type="button" aria-label="再生">'+IC.play+'</button>'+
      '<input class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="再生位置">'+
      '<span class="tm">0:00 / 0:00</span>'+
      '<button class="mu" type="button" aria-label="消音">'+IC.vol+'</button>'+
      '<input class="vol" type="range" min="0" max="100" value="100" aria-label="音量">'+
      '<button class="fs" type="button" aria-label="全画面">'+IC.full+'</button>'+
      '<a class="go" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+id+'">YouTube ↗</a>';
    box.appendChild(c);
    ui.pp=c.querySelector(".pp");ui.seek=c.querySelector(".seek");ui.tm=c.querySelector(".tm");ui.mu=c.querySelector(".mu");ui.vol=c.querySelector(".vol");ui.go=c.querySelector(".go");
    function toggle(){ytCmd(f,f.dataset.playing?"pauseVideo":"playVideo")}
    hit.addEventListener("click",toggle);
    hit.addEventListener("dblclick",function(){fsToggle()});
    ui.pp.addEventListener("click",toggle);
    ui.seek.addEventListener("input",function(){ui.drag=true;ui.tm.textContent=fmt(ui.seek.value/1000*ui.dur)+" / "+fmt(ui.dur)});
    ui.seek.addEventListener("change",function(){ui.drag=false;ytArgs(f,"seekTo",[ui.seek.value/1000*ui.dur,true])});
    ui.vol.addEventListener("input",function(){ytArgs(f,"setVolume",[+ui.vol.value]);if(+ui.vol.value>0&&ui.muted)ytCmd(f,"unMute")});
    ui.mu.addEventListener("click",function(){ytCmd(f,ui.muted?"unMute":"mute")});
    var fsb=c.querySelector(".fs");
    function fsToggle(){if(document.fullscreenElement)document.exitFullscreen();else if(box.requestFullscreen)box.requestFullscreen()}
    if(!box.requestFullscreen)fsb.style.display="none"; else fsb.addEventListener("click",fsToggle);
    ui.go.addEventListener("click",function(){ui.go.href="https://www.youtube.com/watch?v="+id+(ui.cur>1?"&t="+Math.floor(ui.cur)+"s":"");if(f.dataset.playing)ytCmd(f,"pauseVideo")});
    var idleT=null;
    function wake(){box.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(function(){if(f.dataset.playing)box.classList.add("idle")},2200)}
    box.addEventListener("mousemove",wake);
    box.addEventListener("touchstart",function(){box.classList.add("touch");clearTimeout(ui.tt);ui.tt=setTimeout(function(){box.classList.remove("touch")},3000)},{passive:true});
    if(st)ui.cur=+st;
  });
}
function ytArgs(f,func,args){try{f.contentWindow.postMessage(JSON.stringify({event:"command",func:func,args:args}),"*")}catch(e){}}
function ytInfo(f,info){
  var ui=f._ui;if(!ui)return;
  if(info.duration)ui.dur=info.duration;
  if(info.currentTime!==undefined)ui.cur=info.currentTime;
  if(info.muted!==undefined){ui.muted=info.muted;ui.mu.innerHTML=info.muted?IC.mute:IC.vol;ui.mu.setAttribute("aria-label",info.muted?"消音を解除":"消音")}
  if(info.volume!==undefined&&document.activeElement!==ui.vol)ui.vol.value=ui.muted?0:info.volume;
  if(info.playerState!==undefined){
    var on=info.playerState===1||info.playerState===3;
    if(info.playerState===1||info.playerState===2)ui.box.classList.add("started");
    ui.pp.innerHTML=info.playerState===1?IC.pause:IC.play;ui.pp.setAttribute("aria-label",info.playerState===1?"一時停止":"再生");
    if(info.playerState!==1)ui.box.classList.remove("idle");
  }
  if(!ui.drag&&ui.dur){ui.seek.value=Math.round(ui.cur/ui.dur*1000);ui.tm.textContent=fmt(ui.cur)+" / "+fmt(ui.dur)}
}
addEventListener("message",function(e){
  if(!/^https:\/\/www\.youtube\.com$/.test(e.origin))return;
  var d;try{d=JSON.parse(e.data)}catch(err){return}
  var fs=document.querySelectorAll('iframe[src*="youtube.com/embed/"]'),src=null;
  for(var i=0;i<fs.length;i++)if(fs[i].contentWindow===e.source){src=fs[i];break}
  if(!src)return;
  if(d.event==="initialDelivery"||d.event==="onReady")src.dataset.ready="1";
  if(d.info)ytInfo(src,d.info);
  var st=d.info&&d.info.playerState; if(st===undefined)return;
  if(st===1){src.dataset.playing="1";for(var j=0;j<fs.length;j++)if(fs[j]!==src&&fs[j].dataset.playing)ytCmd(fs[j],"pauseVideo")}
  else if(st===2||st===0)delete src.dataset.playing;
});

/* ---------- 用語の吹き出し ---------- */
var TERMS=[];
GLOSSARY.forEach(function(g){[g.t].concat(g.a||[]).forEach(function(w){TERMS.push({w:w,g:g})})});
TERMS.sort(function(x,y){return y.w.length-x.w.length});
function linkTerms(root){
  var used={};
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    var p=n.parentNode.closest("h2,h3,figure,.pull,.tk,.term,a");
    return p?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  TERMS.forEach(function(t){
    if(used[t.g.t])return;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i],k=n.nodeValue.indexOf(t.w);if(k<0)continue;
      var after=n.splitText(k),rest=after.splitText(t.w.length);
      var s=document.createElement("span");s.className="term";s.tabIndex=0;s.setAttribute("role","button");
      s.setAttribute("aria-label",t.w+"：用語の説明");s.dataset.g=GLOSSARY.indexOf(t.g);s.textContent=t.w;
      after.parentNode.replaceChild(s,after);
      nodes.splice(i,1,n,rest);used[t.g.t]=1;break;
    }
  });
}
var tip=document.createElement("div");tip.className="tip";tip.hidden=true;tip.setAttribute("role","tooltip");tip.id="tip";
document.body.appendChild(tip);
var tipFor=null,hideT=null;
function showTip(el){
  clearTimeout(hideT);
  if(tipFor&&tipFor!==el)tipFor.classList.remove("on");
  var g=GLOSSARY[+el.dataset.g],a=BY[g.l];
  tip.style.setProperty("--tc",a.part.c);
  tip.innerHTML='<p class="tt">'+esc(g.t)+'</p>'+(g.img?'<div class="im"></div>':'')+'<p>'+esc(g.d)+'</p>'+(BY[a.id]&&location.hash.slice(1)!==a.id?'<a href="#'+a.id+'">'+a.num+' '+esc(a.title)+'で詳しく</a>':'');
  if(g.img){var tf=document.getElementById(g.img);if(tf)tip.querySelector(".im").appendChild(tf.content.cloneNode(true))}
  tip.hidden=false;tipFor=el;el.classList.add("on");el.setAttribute("aria-describedby","tip");
  var r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight,vw=document.documentElement.clientWidth;
  var x=Math.min(Math.max(16,r.left),vw-tw-16),y=r.bottom+8;
  if(y+th>window.innerHeight&&r.top-th-8>0)y=r.top-th-8;
  tip.style.left=(x+window.scrollX)+"px";tip.style.top=(y+window.scrollY)+"px";
}
function hideTip(){if(!tipFor)return;tip.hidden=true;tipFor.classList.remove("on");tipFor.removeAttribute("aria-describedby");tipFor=null}
function laterHide(){clearTimeout(hideT);hideT=setTimeout(hideTip,180)}
var touchy=false,wasOpen=false;document.addEventListener("pointerdown",function(e){touchy=e.pointerType!=="mouse";var t=e.target.closest&&e.target.closest(".term");wasOpen=!!t&&tipFor===t&&!tip.hidden},true);
document.addEventListener("mouseover",function(e){if(touchy)return;var t=e.target.closest&&e.target.closest(".term");if(t)showTip(t);else if(e.target.closest&&e.target.closest(".tip"))clearTimeout(hideT)});
document.addEventListener("mouseout",function(e){if(touchy)return;if(e.target.closest&&(e.target.closest(".term")||e.target.closest(".tip")))laterHide()});
document.addEventListener("focusin",function(e){if(e.target.classList&&e.target.classList.contains("term"))showTip(e.target)});
document.addEventListener("focusout",function(e){if(e.target.classList&&e.target.classList.contains("term"))laterHide()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")hideTip()});
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest(".term");
  if(t){if(touchy&&wasOpen)hideTip();else showTip(t);return}
  if(!(e.target.closest&&e.target.closest(".tip")))hideTip();
},true);
addEventListener("resize",hideTip);

function lk(id){var a=BY[id];return '<a class="'+(a.pub?"":"draft")+'" href="#'+a.id+'"><span class="sw" style="background:'+a.part.c+'"></span>'+a.num+' '+esc(a.title)+'</a>'}
function viewTroubles(){
  app.innerHTML=topBar(null,null)+'<main class="wrap idx"><h1>困りごとから探す</h1><p>理論の順番ではなく、作品で詰まっている症状から章を引く。灰色の章は、まだ章立てだけ。</p>'+
   '<ul class="tr">'+TROUBLES.map(function(t){return '<li><span class="q">'+esc(t.q)+'</span><span class="ls">'+t.l.map(lk).join("")+'</span></li>'}).join("")+'</ul></main>'+FOOT;
}
function viewGlossary(){
  app.innerHTML=topBar(null,null)+'<main class="wrap idx"><h1>用語索引</h1><p>章の中で使う言葉の、最小限の定義。章の順に並べている。本文の中で点線の下線が付いた言葉は、カーソルを合わせる（スマホでは押す）と、ここと同じ説明が出る。</p>'+
   '<dl class="gl">'+GLOSSARY.slice().sort(function(x,y){return BY[x.l].i-BY[y.l].i}).map(function(g){var a=BY[g.l];return '<div><dt>'+esc(g.t)+'</dt><dd>'+esc(g.d)+'<a href="#'+a.id+'">'+a.num+' '+esc(a.title)+'</a></dd></div>'}).join("")+'</dl></main>'+FOOT;
}
function route(){go((location.hash||"#top").slice(1))}
function go(h){
  hideTip();
  var part=PARTS.filter(function(p){return p.id===h})[0];
  if(BY[h])viewArticle(BY[h]); else if(GBY[h])viewGroup(GBY[h]); else if(part)viewPart(part);
  else if(h==="troubles")viewTroubles(); else if(h==="glossary")viewGlossary(); else viewHome();
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
addEventListener("popstate",route);
/* プレビュー画面などハッシュ移動が効かない環境でも、サイト内リンクで画面を切り替える */
document.addEventListener("click",function(e){
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  var a=e.target.closest?e.target.closest('a[href^="#"]'):null; if(!a)return;
  var h=a.getAttribute("href").slice(1)||"top";
  e.preventDefault(); go(h);
  try{history.pushState(null,"","#"+h)}catch(err){}
});
route();
})();
</script>
