 {t:"ディゾルブ",d:"前のカットが消えながら、次のカットが現れるつなぎ。時間の経過や区切りの合図になりやすい。",l:"edit-1"},
 {t:"マッチカット",d:"似た形や動きでカットをつなぐ方法。",l:"edit-1"},
 {t:"アクションつなぎ",d:"動きの途中でカットを切り替え、つなぎ目を目立たなくする方法。",l:"edit-1"},
 {t:"180度ルール",d:"会話する2人を結ぶ想定線（イマジナリーライン）の片側からだけ撮る、という連続性編集のルール。",l:"intro-3"},
 {t:"30度ルール",d:"同じ被写体を続けて映すとき、カメラの位置を30度以上変える、という連続性編集のルール。",l:"intro-3"},
 {t:"イマジナリーライン",d:"会話する2人などを結ぶ想定上の線。越えて撮ると左右が入れ替わって見える。",l:"intro-3"},
 {t:"連続性編集",d:"カットが変わっても時間と空間が続いて見えるよう、つなぎ目を気づかせない編集の考え方。",l:"intro-3"},
 {t:"クレショフ効果",d:"同じ顔のカットでも、前後に並べるカットによって違う感情に見える現象。",l:"edit-2"},
 {t:"クロスカッティング",d:"離れた場所で同時に起きている出来事を、交互に見せる編集。",l:"edit-4"},
 {t:"レイヤー",d:"画面を構成する層。素材ごとに分けて重ねることで、個別に動かしたり調整したりできる。",l:"composite-1"},
 {t:"描画モード",a:["ブレンドモード"],d:"上のレイヤーを下にどう混ぜるかの設定。スクリーン（明るくする）、乗算（暗くする）など。",l:"composite-1"},
 {t:"マスク",d:"レイヤーのどこを見せて、どこを隠すかを決める型紙。",l:"composite-2"},
 {t:"キーイング",d:"色や明るさを手がかりに、素材を自動で切り抜くこと。",l:"composite-2"},
 {t:"クロマキー",d:"グリーンバックやブルーバックの色だけを抜いて切り抜く方法。",l:"composite-2"},
 {t:"ロトスコープ",d:"動く被写体に合わせて、マスクの形を1コマずつ描き変える作業。",l:"composite-2"},
 {t:"トラッキング",d:"映像の中の動きを読み取り、別の素材をその動きに追従させる技術。",l:"composite-3"},
 {t:"カメラトラッキング",a:["マッチムーブ"],d:"たくさんの点の動きから、撮影したカメラの動きを空間ごと計算する技術。",l:"composite-3"},
 {t:"グロー",d:"明るい所の周りに光のにじみを足す効果。",l:"composite-5"},
 {t:"カラーコレクション",d:"素材の色味や明るさを、正しい状態に戻し、そろえる調整。",l:"composite-5"},
 {t:"カラーグレーディング",d:"作品の雰囲気に合わせて、色の方向を作る調整。",l:"composite-5"},
 {t:"LUT",d:"色の変換をまとめた設定ファイル。かけるだけで決まった色の調子にできる。",l:"vlog-6"},
 {t:"ストップトリック",d:"カメラを止めて物を入れ替え、物が一瞬で変わったように見せるトリック撮影。",l:"composite-6"},
 {t:"二重露光",d:"同じフィルムに2回撮影して、像を重ねる方法。",l:"composite-6"},
 {t:"三幕構成",d:"話を設定・対立・解決の3つに分けて組み立てる、映画脚本でよく使われる型。",l:"structure-3"},
 {t:"クライマックス",d:"作品の中で一番盛り上がる所。最後の着地であるオチとは分けて考えられる。",l:"structure-4"},
 {t:"撮れ高",d:"作品に使える素材がどれだけ撮れたか。",l:"vlog-2"},
 {t:"ショットリスト",d:"撮りたいショットを、場所や寄り・引きと一緒に書き出したリスト。",l:"vlog-2"},
 {t:"Bロール",d:"話や主な出来事（Aロール）の間に挟む、風景や手元などの素材。",l:"vlog-3"},
 {t:"テロップ",d:"画面に重ねて出す文字。発言を読ませたり、強調したりする。",l:"cut-4"},
 {t:"立ち絵",d:"ゆっくり実況などで、画面の端に表示するキャラクターの絵。",l:"yukkuri-4"},
 {t:"アセット",d:"作品の中で使う図形、イラスト、文字などの素材。",l:"mg-3"},
 {t:"アンカーポイント",d:"レイヤーを回転・拡大するときの中心になる点。",l:"mg-3"},
 {t:"トランジション",d:"場面と場面をつなぐ切り替えの演出。",l:"mg-5"},
 {t:"ポリゴン",img:"tipfig-ngon",d:"3DCGの形を作る面の一つ一つ。頂点の数で三角ポリゴン、四角ポリゴン、Nゴンと呼び分ける。",l:"cg-2"},
 {t:"Nゴン",img:"tipfig-ngon",d:"頂点が5つ以上ある面。曲げたり滑らかにしたりすると、しわや影の乱れが出やすい。",l:"cg-2"},
 {t:"エッジループ",img:"tipfig-loop",d:"四角ポリゴンの辺が、縦や横に一続きにつながった線。まとめて選んだり、足して形を締めたりできる。",l:"cg-2"},
 {t:"サブディビジョン",d:"面を細かく分けて、形を滑らかにすること。四角ポリゴンで組んだモデルほどきれいに分かれる。",l:"cg-2"},
 {t:"モデリング",d:"3DCGで物の形を作る工程。",l:"cg-2"},
 {t:"マテリアル",d:"3DCGで、物の表面が光をどう返すか（色、つや、金属かどうか）の設定。",l:"cg-3"},
 {t:"テクスチャ",d:"3DCGの物の表面に貼る画像。模様、汚れ、細かい凹凸を表す。",l:"cg-3"},
 {t:"UV展開",d:"3DCGの形の表面を平面に開き、テクスチャを貼れるようにする作業。",l:"cg-3"},
 {t:"リギング",d:"3DCGのキャラクターや物を動かすための骨組みと操作を作る工程。",l:"cg-4"},
 {t:"ボーン",d:"リギングで形の中に入れる骨。骨が動くと周りの形も動く。",l:"cg-4"},
 {t:"IK",d:"手先や足先を動かすと、腕や脚全体が自然についてくる仕組み。",l:"cg-4"},
 {t:"HDRI",d:"周囲の光の情報を含む画像。3DCGで空間全体の光として使う。",l:"cg-6"},
 {t:"焦点距離",d:"レンズの画角を決める数字。小さいほど広角で遠近感が強く、大きいほど望遠で遠近感が弱い。",l:"cg-6"},
 {t:"レンダリング",d:"3DCGの空間を画像として書き出す工程。",l:"cg-7"}
];
</script>
<script>
(function(){
var COLORS={intro:["#BFBFBF","#000"],prep:["#BFBF00","#000"],visual:["#00BFBF","#000"],motion:["#00BF00","#000"],
  sound:["#BF00BF","#fff"],edit:["#BF0000","#fff"],composite:["#0000BF","#fff"],structure:["#00214C","#fff"],genres:["#32006A","#fff"]};
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}

var FLAT=[],BY={},GBY={};
PARTS.forEach(function(p,pi){
  p.no=pi; p.label=pi===0?"序論":"第"+pi+"編 "+p.name;
  p.c=COLORS[p.id][0]; p.ci=COLORS[p.id][1];
  var base=p.start===0?0:1;
  if(p.groups){p.articles=[];p.groups.forEach(function(g){g.part=p;g.label=g.k+" "+g.title;GBY[g.id]=g;
    g.articles.forEach(function(a,ai){a.group=g;a.n=pi+g.k+"."+(ai+1);p.articles.push(a)})});}
  p.articles.forEach(function(a,ai){
    a.part=p; a.num=a.n||(pi+"."+(ai+base));
    var txt=""; if(a.body){var t=document.getElementById(a.body); if(t)txt=t.content.textContent;}
    a.index=(p.name+(a.group?a.group.title:"")+a.num+a.title+a.sub+a.summary+(a.outline||[]).join(" ")+txt).toLowerCase();
    a.i=FLAT.length; FLAT.push(a); BY[a.id]=a;
  });
});
var firstHome=true;

function chRow(a){
  return '<li><a class="'+(a.pub?"pub":"draft")+'" href="#'+a.id+'"><span class="n">'+a.num+'</span><span class="t">'+esc(a.title)+'<span class="s">'+esc(a.sub)+'</span></span><span class="st">'+(a.tk?"叩き台":a.pub?"本文あり":"章立てのみ")+'</span></a></li>';
}
function partList(p){
  if(!p.groups)return '<ul class="chl">'+p.articles.map(chRow).join("")+'</ul>';
  return p.groups.map(function(g){return '<div class="grp"><h3><a href="#'+g.id+'"><span class="gk">'+p.no+g.k+'</span>'+esc(g.title)+'</a><span class="s">'+esc(g.sub)+'</span></h3><ul class="chl">'+g.articles.map(chRow).join("")+'</ul></div>'}).join("");
}
function topBar(a,p,cp){
  cp=cp||p;
  var pm=PARTS.map(function(x){return '<a href="#'+x.id+'" class="'+(cp===x?"on":"")+'" style="background:'+x.c+';color:'+x.ci+'"'+(cp===x?' aria-current="true"':'')+'><span class="nm">'+esc(x.no===0?x.name:x.no+" "+x.name)+'</span><span class="ct">'+(x.groups?x.groups.length+'ジャンル':x.articles.length+'章')+'</span></a>'}).join("");
  var strip=FLAT.map(function(x){return '<a href="#'+x.id+'" title="'+x.num+' '+esc(x.title)+'" aria-label="'+x.num+' '+esc(x.title)+'" class="'+(x.pub?"pub ":"")+(a&&x===a?"on":"")+'" style="background:'+x.part.c+'"></a>'}).join("");
  return '<div class="top"><div class="wrap row"><a class="home" href="#top">映像とは何か</a><span class="where">'+(p?'<a href="#'+p.id+'">'+esc(p.label)+'</a>':'')+'</span></div><div class="snav"><nav class="strip" aria-label="全章">'+strip+'</nav><nav class="pmenu" aria-label="編を選ぶ">'+pm+'</nav></div></div>';
}
var FOOT='<footer><div class="wrap">'+FLAT.length+'章のうち '+FLAT.filter(function(a){return a.pub}).length+'章に本文あり（うち'+FLAT.filter(function(a){return a.tk}).length+'章は叩き台）。叩き台の章は、要点と流れだけを先に書いたもので、順次書き直す。</div></footer>';

function viewHome(){
  var bars=PARTS.map(function(p){return '<a class="bar" href="#'+p.id+'" style="background:'+p.c+';color:'+p.ci+';box-shadow:1px 0 0 '+p.c+';animation-delay:'+(p.no*45)+'ms"><span class="nm">'+esc(p.name)+'</span><span class="ct">'+(p.groups?p.groups.length+'ジャンル':p.articles.length+'章')+'</span></a>'}).join("");
  var h='<nav class="bars'+(firstHome?" intro":"")+'" aria-label="編">'+bars+'</nav>'+
   '<header class="band"><div class="wrap"><h1>映像とは何か</h1><p>映像研の部員が、作りながら読むための理論書。全ての映像に共通する基礎を編に分け、最後にジャンルごとの応用へ進む。順番に読まなくていい。詰まった所から開いて、1章読んだら閉じていい。</p>'+
   '<div class="tools"><input type="search" id="q" placeholder="章を検索：構図、音ハメ、3DCG" aria-label="章を検索"><a href="#troubles">困りごとから探す</a><a href="#glossary">用語索引</a></div></div></header>'+
   '<main class="wrap" id="homeMain"></main>'+FOOT;
  app.innerHTML=h; firstHome=false;
  renderHomeMain("");
  var q=document.getElementById("q");
  q.addEventListener("input",function(){renderHomeMain(q.value.trim().toLowerCase())});
}
function renderHomeMain(q){
  var m=document.getElementById("homeMain");
  if(q){
    var hits=FLAT.filter(function(a){return a.index.indexOf(q)!==-1});
    m.innerHTML='<section class="results"><h2>'+(hits.length?hits.length+"章が該当":"該当する章はない")+'</h2>'+
     (hits.length?'<ul class="chl">'+hits.map(chRow).join("")+'</ul>':'<p class="empty">別の言葉で探すか、<a href="#troubles">困りごとから探す</a>。</p>')+'</section>';
    return;
  }
  m.innerHTML='<section class="thesis"><p class="k">このサイトの定義</p><blockquote>良い映像は、どの要素にも「何を魅せたいか」の意図が設計されている。</blockquote><p class="src"><a href="#intro-1">0.1「映像とは何か」で、この定義にたどり着くまでを読む</a></p></section>'+
   PARTS.map(function(p){return '<section class="part" id="sec-'+p.id+'"><h2><span class="sw" style="background:'+p.c+'"></span><a href="#'+p.id+'">'+esc(p.label)+'</a></h2><p class="desc">'+esc(p.desc)+'</p>'+partList(p)+'</section>'}).join("");
}
function viewPart(p){
  app.innerHTML=topBar(null,null,p)+'<header class="phead" style="background:'+p.c+';color:'+p.ci+'"><div class="wrap"><h1>'+esc(p.label)+'</h1><p>'+esc(p.desc)+'</p></div></header>'+
   '<main class="wrap"><div class="part" style="padding-top:40px">'+partList(p)+'</div></main>'+FOOT;
}
function viewGroup(g){
  var p=g.part;
  app.innerHTML=topBar(null,p)+'<header class="phead" style="background:'+p.c+';color:'+p.ci+'"><div class="wrap"><p class="gp"><a href="#'+p.id+'">'+esc(p.label)+'</a></p><h1>'+esc(g.title)+'</h1><p>'+esc(g.summary)+'</p></div></header>'+
   '<main class="wrap"><div class="part" style="padding-top:40px"><ul class="chl">'+g.articles.map(chRow).join("")+'</ul></div></main>'+FOOT;
}
function viewArticle(a){
  var p=a.part,pv=FLAT[a.i-1],nx=FLAT[a.i+1];
  var h=topBar(a,p)+'<main class="wrap" style="--c:'+p.c+'"><header class="ahead"><p class="pn"><span class="sw" style="background:'+p.c+'"></span><a href="#'+p.id+'">'+esc(p.label)+'</a>'+(a.group?'<a href="#'+a.group.id+'">'+esc(a.group.title)+'</a>':'')+'<span>'+a.num+'</span></p>'+
   '<h1>'+esc(a.title)+'</h1><p class="sub">'+esc(a.sub)+'</p><p class="sum">'+esc(a.summary)+'</p>'+
   '<p class="meta">'+(a.pub?'<b>'+(a.tk?'叩き台':'本文あり')+'</b>　読むのに約'+a.mins+'分':'章立てのみ。本文は執筆中')+'</p></header>';
  if(a.pub){
    h+='<article class="body" id="body"></article>';
    if(a.further)h+='<section class="more"><h2>続けて読む</h2><ul class="chl">'+a.further.map(function(id){return chRow(BY[id])}).join("")+'</ul></section>';
  }else{
    h+='<ol class="outline">'+a.outline.map(function(o){return '<li>'+esc(o)+'</li>'}).join("")+'</ol><p class="note">章立てと概要から、読みたい内容の当たりを付けられる。</p>';
  }
  h+='<nav class="prevnext" aria-label="前後の章">'+(pv?'<a href="#'+pv.id+'"><small>前の章　'+pv.num+'</small><b>'+esc(pv.title)+'</b></a>':'<span></span>')+
     (nx?'<a class="nx" href="#'+nx.id+'"><small>次の章　'+nx.num+'</small><b>'+esc(nx.title)+'</b></a>':'<span></span>')+'</nav></main>'+FOOT;
  app.innerHTML=h;
  if(a.pub){var bd=document.getElementById("body"),fr=document.getElementById(a.body).content.cloneNode(true);
    if(a.tk&&!fr.querySelector(".tk")){var n=document.createElement("p");n.className="tk";n.textContent="この章は叩き台。要点と流れだけを先に書いた短い本文で、内容は今後見直す。";bd.appendChild(n)}
    bd.appendChild(fr); linkTerms(bd,a); setupVideos(bd);}
}
/* ---------- 参考動画：同時に1本だけ再生し、画面外に出たら止める ---------- */
function ytCmd(f,func){try{f.contentWindow.postMessage(JSON.stringify({event:"command",func:func,args:[]}),"*")}catch(e){}}
function ytListen(f){var k=0;(function ping(){try{f.contentWindow.postMessage(JSON.stringify({event:"listening",id:f.dataset.yid}),"*")}catch(e){}if(++k<6&&!f.dataset.ready)setTimeout(ping,500)})()}
var ytSeen=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting&&e.target.dataset.playing)ytCmd(e.target,"pauseVideo")})}):null;
var IC={play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 8.5a5 5 0 0 1 0 7" stroke="#fff" stroke-width="2" fill="none"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15 9l6 6M21 9l-6 6" stroke="#fff" stroke-width="2"/></svg>',
  full:'<svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zM14 3h7v7h-2V5h-5zM3 14h2v5h5v2H3zM19 14h2v7h-7v-2h5z"/></svg>'};
/* 音量と消音は全動画で共有し、ページを移っても覚えておく */
var VOL={v:100,m:false};
try{var sv=JSON.parse(localStorage.getItem("mq-vol")||"null");if(sv&&typeof sv.v==="number"){VOL.v=Math.max(0,Math.min(100,sv.v));VOL.m=!!sv.m}}catch(e){}
function volSave(){try{localStorage.setItem("mq-vol",JSON.stringify(VOL))}catch(e){}}
addEventListener("storage",function(e){if(e.key!=="mq-vol"||!e.newValue)return;try{var n=JSON.parse(e.newValue);VOL.v=n.v;VOL.m=!!n.m;volAll()}catch(x){}});
function volApply(f){ytArgs(f,"setVolume",[VOL.v]);ytCmd(f,VOL.m?"mute":"unMute");var ui=f._ui;if(ui&&document.activeElement!==ui.vol)ui.vol.value=VOL.m?0:VOL.v}
function volAll(){[].forEach.call(document.querySelectorAll('iframe[src*="youtube.com/embed/"]'),function(x){if(x.dataset.ready)volApply(x);else if(x._ui)x._ui.vol.value=VOL.m?0:VOL.v})}
function fmt(t){t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+":"+("0"+t%60).slice(-2)}
function setupVideos(root){
  [].forEach.call(root.querySelectorAll('iframe[src*="youtube.com/embed/"]'),function(f,i){
    f.dataset.yid="yt"+i; f.addEventListener("load",function(){f.dataset.ready="";ytListen(f)});
    if(ytSeen)ytSeen.observe(f);
    var box=f.parentNode,id=(f.src.match(/embed\/([^?]+)/)||[])[1],st=(f.src.match(/[?&]start=(\d+)/)||[])[1]||0;
    var ui={f:f,box:box,dur:0,cur:0,drag:false,id:id};f._ui=ui;
    var hit=document.createElement("div");hit.className="hit";box.appendChild(hit);
    var c=document.createElement("div");c.className="ctl";
    c.innerHTML='<button class="pp" type="button" aria-label="再生">'+IC.play+'</button>'+
      '<input class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="再生位置">'+
      '<span class="tm">0:00 / 0:00</span>'+
      '<button class="mu" type="button" aria-label="消音">'+IC.vol+'</button>'+
      '<input class="vol" type="range" min="0" max="100" value="'+(VOL.m?0:VOL.v)+'" aria-label="音量">'+
      '<button class="fs" type="button" aria-label="全画面">'+IC.full+'</button>'+
      '<a class="go" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+id+'">YouTube ↗</a>';
    box.appendChild(c);
    ui.pp=c.querySelector(".pp");ui.seek=c.querySelector(".seek");ui.tm=c.querySelector(".tm");ui.mu=c.querySelector(".mu");ui.vol=c.querySelector(".vol");ui.go=c.querySelector(".go");
    function toggle(){ytCmd(f,f.dataset.playing?"pauseVideo":"playVideo")}
    hit.addEventListener("click",toggle);
    hit.addEventListener("dblclick",function(){fsToggle()});
    ui.pp.addEventListener("click",toggle);
    ui.seek.addEventListener("input",function(){ui.drag=true;ui.tm.textContent=fmt(ui.seek.value/1000*ui.dur)+" / "+fmt(ui.dur)});
    ui.seek.addEventListener("change",function(){ui.drag=false;ytArgs(f,"seekTo",[ui.seek.value/1000*ui.dur,true])});
    ui.vol.addEventListener("input",function(){VOL.v=+ui.vol.value;if(VOL.v>0)VOL.m=false;volSave();volAll()});
    ui.mu.addEventListener("click",function(){VOL.m=!ui.muted;if(!VOL.m&&VOL.v===0)VOL.v=50;volSave();volAll()});
    var fsb=c.querySelector(".fs");
    function fsToggle(){if(document.fullscreenElement)document.exitFullscreen();else if(box.requestFullscreen)box.requestFullscreen()}
    if(!box.requestFullscreen)fsb.style.display="none"; else fsb.addEventListener("click",fsToggle);
    ui.go.addEventListener("click",function(){ui.go.href="https://www.youtube.com/watch?v="+id+(ui.cur>1?"&t="+Math.floor(ui.cur)+"s":"");if(f.dataset.playing)ytCmd(f,"pauseVideo")});
    var idleT=null;
    function wake(){box.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(function(){if(f.dataset.playing)box.classList.add("idle")},2200)}
    box.addEventListener("mousemove",wake);
    box.addEventListener("touchstart",function(){box.classList.add("touch");clearTimeout(ui.tt);ui.tt=setTimeout(function(){box.classList.remove("touch")},3000)},{passive:true});
    if(st)ui.cur=+st;
  });
}
function ytArgs(f,func,args){try{f.contentWindow.postMessage(JSON.stringify({event:"command",func:func,args:args}),"*")}catch(e){}}
function ytInfo(f,info){
  var ui=f._ui;if(!ui)return;
  if(info.duration)ui.dur=info.duration;
  if(info.currentTime!==undefined)ui.cur=info.currentTime;
  if(info.muted!==undefined){ui.muted=info.muted;ui.mu.innerHTML=info.muted?IC.mute:IC.vol;ui.mu.setAttribute("aria-label",info.muted?"消音を解除":"消音")}
  if(info.volume!==undefined&&document.activeElement!==ui.vol)ui.vol.value=ui.muted?0:info.volume;
  if(info.playerState!==undefined){
    var on=info.playerState===1||info.playerState===3;
    if(info.playerState===1||info.playerState===2)ui.box.classList.add("started");
    ui.pp.innerHTML=info.playerState===1?IC.pause:IC.play;ui.pp.setAttribute("aria-label",info.playerState===1?"一時停止":"再生");
    if(info.playerState!==1)ui.box.classList.remove("idle");
  }
  if(!ui.drag&&ui.dur){ui.seek.value=Math.round(ui.cur/ui.dur*1000);ui.tm.textContent=fmt(ui.cur)+" / "+fmt(ui.dur)}
}
addEventListener("message",function(e){
  if(!/^https:\/\/www\.youtube\.com$/.test(e.origin))return;
  var d;try{d=JSON.parse(e.data)}catch(err){return}
  var fs=document.querySelectorAll('iframe[src*="youtube.com/embed/"]'),src=null;
  for(var i=0;i<fs.length;i++)if(fs[i].contentWindow===e.source){src=fs[i];break}
  if(!src)return;
  if((d.event==="initialDelivery"||d.event==="onReady")&&!src.dataset.ready){src.dataset.ready="1";volApply(src)}
  if(d.info)ytInfo(src,d.info);
  var st=d.info&&d.info.playerState; if(st===undefined)return;
  if(st===1){if(!src.dataset.playing)volApply(src);src.dataset.playing="1";for(var j=0;j<fs.length;j++)if(fs[j]!==src&&fs[j].dataset.playing)ytCmd(fs[j],"pauseVideo")}
  else if(st===2||st===0)delete src.dataset.playing;
});

/* ---------- 用語の吹き出し ---------- */
var TERMS=[];
GLOSSARY.forEach(function(g){[g.t].concat(g.a||[]).forEach(function(w){TERMS.push({w:w,g:g})})});
TERMS.sort(function(x,y){return y.w.length-x.w.length});
function linkTerms(root){
  var used={};
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    var p=n.parentNode.closest("h2,h3,figure,.pull,.tk,.term,.noterm,a");
    return p?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  TERMS.forEach(function(t){
    if(used[t.g.t])return;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i],k=n.nodeValue.indexOf(t.w);if(k<0)continue;
      var after=n.splitText(k),rest=after.splitText(t.w.length);
      var s=document.createElement("span");s.className="term";s.tabIndex=0;s.setAttribute("role","button");
      s.setAttribute("aria-label",t.w+"：用語の説明");s.dataset.g=GLOSSARY.indexOf(t.g);s.textContent=t.w;
      after.parentNode.replaceChild(s,after);
      nodes.splice(i,1,n,rest);used[t.g.t]=1;break;
    }
  });
}
var tip=document.createElement("div");tip.className="tip";tip.hidden=true;tip.setAttribute("role","tooltip");tip.id="tip";
document.body.appendChild(tip);
var tipFor=null,hideT=null;
function showTip(el){
  clearTimeout(hideT);
  if(tipFor&&tipFor!==el)tipFor.classList.remove("on");
  var g=GLOSSARY[+el.dataset.g],a=BY[g.l];
  tip.style.setProperty("--tc",a.part.c);
  tip.innerHTML='<p class="tt">'+esc(g.t)+'</p>'+(g.img?'<div class="im"></div>':'')+'<p>'+esc(g.d)+'</p>'+(BY[a.id]&&location.hash.slice(1)!==a.id?'<a href="#'+a.id+'">'+a.num+' '+esc(a.title)+'で詳しく</a>':'')+(g.u?'<a href="'+esc(g.u)+'" target="_blank" rel="noopener">'+esc(g.un||g.u)+' ↗</a>':'');
  if(g.img){var tf=document.getElementById(g.img);if(tf)tip.querySelector(".im").appendChild(tf.content.cloneNode(true))}
  tip.hidden=false;tipFor=el;el.classList.add("on");el.setAttribute("aria-describedby","tip");
  var r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight,vw=document.documentElement.clientWidth;
  var x=Math.min(Math.max(16,r.left),vw-tw-16),y=r.bottom+8;
  if(y+th>window.innerHeight&&r.top-th-8>0)y=r.top-th-8;
  tip.style.left=(x+window.scrollX)+"px";tip.style.top=(y+window.scrollY)+"px";
}
function hideTip(){if(!tipFor)return;tip.hidden=true;tipFor.classList.remove("on");tipFor.removeAttribute("aria-describedby");tipFor=null}
function laterHide(){clearTimeout(hideT);hideT=setTimeout(hideTip,180)}
var touchy=false,wasOpen=false;document.addEventListener("pointerdown",function(e){touchy=e.pointerType!=="mouse";var t=e.target.closest&&e.target.closest(".term");wasOpen=!!t&&tipFor===t&&!tip.hidden},true);
document.addEventListener("mouseover",function(e){if(touchy)return;var t=e.target.closest&&e.target.closest(".term");if(t)showTip(t);else if(e.target.closest&&e.target.closest(".tip"))clearTimeout(hideT)});
document.addEventListener("mouseout",function(e){if(touchy)return;if(e.target.closest&&(e.target.closest(".term")||e.target.closest(".tip")))laterHide()});
document.addEventListener("focusin",function(e){if(e.target.classList&&e.target.classList.contains("term"))showTip(e.target)});
document.addEventListener("focusout",function(e){if(e.target.classList&&e.target.classList.contains("term"))laterHide()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")hideTip()});
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest(".term");
  if(t){if(touchy&&wasOpen)hideTip();else showTip(t);return}
  if(!(e.target.closest&&e.target.closest(".tip")))hideTip();
},true);
addEventListener("resize",hideTip);

function lk(id){var a=BY[id];return '<a class="'+(a.pub?"":"draft")+'" href="#'+a.id+'"><span class="sw" style="background:'+a.part.c+'"></span>'+a.num+' '+esc(a.title)+'</a>'}
function viewTroubles(){
  app.innerHTML=topBar(null,null)+'<main class="wrap idx"><h1>困りごとから探す</h1><p>理論の順番ではなく、作品で詰まっている症状から章を引く。灰色の章は、まだ章立てだけ。</p>'+
   '<ul class="tr">'+TROUBLES.map(function(t){return '<li><span class="q">'+esc(t.q)+'</span><span class="ls">'+t.l.map(lk).join("")+'</span></li>'}).join("")+'</ul></main>'+FOOT;
}
function viewGlossary(){
  app.innerHTML=topBar(null,null)+'<main class="wrap idx"><h1>用語索引</h1><p>章の中で使う言葉の、最小限の定義。章の順に並べている。本文の中で点線の下線が付いた言葉は、カーソルを合わせる（スマホでは押す）と、ここと同じ説明が出る。</p>'+
   '<dl class="gl">'+GLOSSARY.slice().sort(function(x,y){return BY[x.l].i-BY[y.l].i}).map(function(g){var a=BY[g.l];return '<div><dt>'+esc(g.t)+'</dt><dd>'+esc(g.d)+'<a href="#'+a.id+'">'+a.num+' '+esc(a.title)+'</a></dd></div>'}).join("")+'</dl></main>'+FOOT;
}
function route(){go((location.hash||"#top").slice(1))}
function go(h){
  hideTip();
  var part=PARTS.filter(function(p){return p.id===h})[0];
  if(BY[h])viewArticle(BY[h]); else if(GBY[h])viewGroup(GBY[h]); else if(part)viewPart(part);
  else if(h==="troubles")viewTroubles(); else if(h==="glossary")viewGlossary(); else viewHome();
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
/* 上の帯：スマホなど hover がない端末では、帯を1回押すと編のメニューを開く */
document.addEventListener("click",function(e){
  var sn=document.querySelector(".snav"); if(!sn)return;
  var noHover=window.matchMedia&&matchMedia("(hover:none)").matches;
  if(noHover&&e.target.closest(".strip")&&!sn.classList.contains("open")){e.preventDefault();sn.classList.add("open");return}
  if(!e.target.closest(".snav"))sn.classList.remove("open");
});
addEventListener("popstate",route);
/* プレビュー画面などハッシュ移動が効かない環境でも、サイト内リンクで画面を切り替える */
document.addEventListener("click",function(e){
  if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  var a=e.target.closest?e.target.closest('a[href^="#"]'):null; if(!a)return;
  var h=a.getAttribute("href").slice(1)||"top";
  e.preventDefault(); go(h);
  try{history.pushState(null,"","#"+h)}catch(err){}
});
route();
})();
</script>
